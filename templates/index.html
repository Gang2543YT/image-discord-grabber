<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Terraria Online Multiplayer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a24;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        canvas {
            display: block;
        }
        /* Connection & Lobby Screen */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #151d28, #2c3e50);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            color: white;
        }
        .menu-box {
            background: rgba(0, 0, 0, 0.85);
            padding: 30px 40px;
            border-radius: 10px;
            border: 3px solid #f39c12;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            width: 380px;
        }
        .menu-box h1 {
            margin-top: 0;
            color: #f39c12;
            font-size: 22px;
            text-shadow: 2px 2px #000;
        }
        .menu-box label {
            display: block;
            margin-top: 12px;
            font-size: 13px;
            color: #ccc;
            text-align: left;
        }
        .menu-box input {
            width: 100%;
            padding: 8px;
            font-size: 14px;
            font-family: 'Courier New', Courier, monospace;
            background: #222;
            border: 2px solid #555;
            color: white;
            border-radius: 5px;
            margin-top: 4px;
            outline: none;
            box-sizing: border-box;
            text-align: center;
        }
        .menu-box input:focus {
            border-color: #f39c12;
        }
        .menu-box button {
            background: #f39c12;
            color: #111;
            font-weight: bold;
            padding: 10px 20px;
            font-size: 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            margin-top: 18px;
            width: 100%;
            transition: background 0.2s;
        }
        .menu-box button:hover {
            background: #e67e22;
        }
        #error-msg {
            color: #ff4d4d;
            font-size: 12px;
            margin-top: 12px;
            min-height: 15px;
            font-weight: bold;
        }
        .mode-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .mode-btn {
            flex: 1;
            padding: 8px;
            background: #333;
            border: 2px solid #555;
            color: #fff;
            cursor: pointer;
            border-radius: 5px;
            font-family: 'Courier New', Courier, monospace;
        }
        .mode-btn.active {
            background: #f39c12;
            color: #111;
            border-color: #f39c12;
            font-weight: bold;
        }

        /* In-Game HUD */
        #ui-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 6px;
            border: 2px solid #444;
            pointer-events: none;
            font-size: 12px;
            display: none;
            line-height: 1.5;
            z-index: 5;
        }

        /* Hotbar positioned at bottom center */
        #hotbar-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            z-index: 5;
            pointer-events: none;
        }

        #hotbar {
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.75);
            padding: 8px;
            border-radius: 8px;
            border: 2px solid #555;
            pointer-events: auto;
        }

        .slot {
            width: 38px;
            height: 38px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #666;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 9px;
            position: relative;
        }
        .slot.active {
            border-color: #f39c12;
            background: rgba(243, 156, 18, 0.2);
        }
        .slot span {
            position: absolute;
            bottom: 2px;
            right: 3px;
            font-size: 8px;
            color: #f1c40f;
        }

        /* Health bar positioned left-aligned above hotbar area like Minecraft */
        #health-bar {
            position: absolute;
            bottom: 74px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 4px;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 10px;
            border-radius: 6px;
            border: 2px solid #444;
            z-index: 5;
            pointer-events: none;
            width: 440px;
            justify-content: flex-start;
        }

        .heart {
            width: 18px;
            height: 18px;
            position: relative;
            display: inline-block;
        }
        .heart::before, .heart::after {
            content: "";
            position: absolute;
            top: 0;
            width: 10px;
            height: 16px;
            border-radius: 10px 10px 0 0;
            background: #333; /* Empty heart background */
        }
        .heart::before {
            left: 10px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }
        .heart::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        .heart.full::before, .heart.full::after {
            background: #e74c3c; /* Full red heart */
        }
    </style>
</head>
<body>

    <!-- Connection / Lobby Start Screen -->
    <div id="start-screen">
        <div class="menu-box">
            <h1>ONLINE MULTIPLAYER</h1>
            <div class="mode-buttons">
                <button class="mode-btn active" id="btn-host" onclick="setMode('host')">Host Room</button>
                <button class="mode-btn" id="btn-join" onclick="setMode('join')">Join Room</button>
            </div>

            <label for="player-name">Your Player Name:</label>
            <input type="text" id="player-name" placeholder="Leave blank for random" maxlength="16">

            <div id="join-section" style="display: none;">
                <label for="room-code-input">Room Code / ID:</label>
                <input type="text" id="room-code-input" placeholder="Paste host room code">
            </div>

            <div id="host-section">
                <label for="room-code-display">Your Room Code (Share with friends):</label>
                <input type="text" id="room-code-display" readonly style="background: #111; color: #f39c12; font-weight: bold;">
            </div>

            <div id="error-msg"></div>
            <button id="connect-btn" onclick="startConnection()">CONNECT & PLAY</button>
        </div>
    </div>

    <div id="ui-overlay">
        <strong>Controls:</strong> A/D to Move | Space to Jump | Mouse to Aim & Mine<br>
        <strong>Hotbar:</strong> 1-9 & 0 to select items
    </div>

    <!-- Health Bar (Left-aligned above hotbar) -->
    <div id="health-bar">
        <div class="heart full" id="heart-0"></div>
        <div class="heart full" id="heart-1"></div>
        <div class="heart full" id="heart-2"></div>
        <div class="heart full" id="heart-3"></div>
        <div class="heart full" id="heart-4"></div>
        <div class="heart full" id="heart-5"></div>
        <div class="heart full" id="heart-6"></div>
        <div class="heart full" id="heart-7"></div>
        <div class="heart full" id="heart-8"></div>
        <div class="heart full" id="heart-9"></div>
    </div>

    <!-- Hotbar Container -->
    <div id="hotbar-container">
        <div id="hotbar">
            <div class="slot active" id="slot-0"><span>0</span></div>
            <div class="slot" id="slot-1"><span>0</span></div>
            <div class="slot" id="slot-2"><span>0</span></div>
            <div class="slot" id="slot-3"><span>0</span></div>
            <div class="slot" id="slot-4"><span>0</span></div>
            <div class="slot" id="slot-5"><span>0</span></div>
            <div class="slot" id="slot-6"><span>0</span></div>
            <div class="slot" id="slot-7"><span>0</span></div>
            <div class="slot" id="slot-8"><span>0</span></div>
            <div class="slot" id="slot-9"><span>0</span></div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- PeerJS for true P2P online multiplayer connectivity -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- CONSTANTS & CONFIG ---
        const TILE_SIZE = 24;
        const CHUNK_WIDTH = 32;
        const WORLD_HEIGHT = 80;
        const loadedChunks = new Map();
        let gameStarted = false;
        let isHost = true;
        let peer = null;
        let conn = null;
        let hostConnections = []; 
        let worldSeed = 12345;

        const RANDOM_NAMES = [
            'PixelKnight', 'VoxelVoyager', 'CraftMaster', 'DiggingDwarf', 'BlockBuster', 
            'CaveCrawler', 'ShadowMiner', 'BedrockBoss', 'ObsidianOgre', 'GoldGoblin',
            'CopperCommander', 'IronIcon', 'StoneStalker', 'DirtDefender', 'TreeTrapper'
        ];
        const TAKEN_NAMES = ['steve', 'terrarian', 'builderx', 'minerbro', 'notch'];

        const COLORS = {
            skyTop: '#151d28',
            skyBottom: '#4a90e2',
            grass: '#558b2f',
            dirt: '#795548',
            stone: '#616161',
            copper_ore: '#d84315',
            iron_ore: '#b0bec5',
            wood: '#8d6e63',
            leaves: '#2e7d32'
        };

        const localPlayer = {
            id: null,
            name: '',
            x: 0,
            y: 0,
            width: 20,
            height: 38,
            vx: 0,
            vy: 0,
            speed: 4.5,
            jumpForce: -10.5,
            gravity: 0.45,
            grounded: false,
            facing: 1,
            swingTimer: 0,
            selectedSlot: 0,
            maxHp: 100,
            hp: 100,
            inventory: { 
                0: { type: null, count: 0 },
                1: { type: null, count: 0 },
                2: { type: null, count: 0 },
                3: { type: null, count: 0 },
                4: { type: null, count: 0 },
                5: { type: null, count: 0 },
                6: { type: null, count: 0 },
                7: { type: null, count: 0 },
                8: { type: null, count: 0 },
                9: { type: null, count: 0 }
            }
        };

        const remotePlayers = {};
        const particles = [];
        const itemDrops = []; // World dropped items when blocks are broken
        const clouds = [
            { x: 100, y: 80, speed: 0.3, width: 120, height: 40 },
            { x: 550, y: 130, speed: 0.2, width: 180, height: 50 },
            { x: 1000, y: 60, speed: 0.4, width: 100, height: 35 }
        ];

        function setMode(mode) {
            isHost = (mode === 'host');
            document.getElementById('btn-host').classList.toggle('active', isHost);
            document.getElementById('btn-join').classList.toggle('active', !isHost);
            document.getElementById('host-section').style.display = isHost ? 'block' : 'none';
            document.getElementById('join-section').style.display = isHost ? 'none' : 'block';
        }

        window.addEventListener('load', () => {
            peer = new Peer();
            peer.on('open', (id) => {
                localPlayer.id = id;
                if (isHost) {
                    document.getElementById('room-code-display').value = id;
                }
            });

            peer.on('connection', (incomingConn) => {
                if (!isHost) return;
                hostConnections.push(incomingConn);

                incomingConn.on('data', (data) => {
                    handleHostNetworkData(incomingConn, data);
                });

                incomingConn.on('close', () => {
                    delete remotePlayers[incomingConn.peer];
                    hostConnections = hostConnections.filter(c => c !== incomingConn);
                    broadcastToClients({ type: 'PLAYER_DISCONNECTED', id: incomingConn.peer });
                });
            });
        });

        function startConnection() {
            let name = document.getElementById('player-name').value.trim();
            if (name === '') {
                name = RANDOM_NAMES[Math.floor(Math.random() * RANDOM_NAMES.length)];
            }
            if (TAKEN_NAMES.includes(name.toLowerCase())) {
                document.getElementById('error-msg').innerText = `⚠️ The name "${name}" is reserved or taken! Choose another.`;
                return;
            }
            localPlayer.name = name;

            if (isHost) {
                worldSeed = Math.floor(Math.random() * 100000);
                initializeWorldAndSpawn();
                launchGame();
            } else {
                const roomCode = document.getElementById('room-code-input').value.trim();
                if (!roomCode) {
                    document.getElementById('error-msg').innerText = "⚠️ Please enter a valid host room code!";
                    return;
                }

                document.getElementById('error-msg').innerText = "Connecting to room...";
                conn = peer.connect(roomCode);

                conn.on('open', () => {
                    conn.send({ type: 'JOIN_REQUEST', name: localPlayer.name, x: localPlayer.x, y: localPlayer.y });
                });

                conn.on('data', (data) => {
                    handleClientNetworkData(data);
                });

                conn.on('error', (err) => {
                    document.getElementById('error-msg').innerText = "Connection failed! Check the room code.";
                });
            }
        }

        function initializeWorldAndSpawn() {
            generateChunk(0);
            generateChunk(1);
            generateChunk(-1);
            generateChunk(2);
            generateChunk(-2);

            const chunk0 = loadedChunks.get(0);
            const surfaceY = chunk0[0].surfaceHeight;
            localPlayer.x = 0;
            localPlayer.y = (surfaceY - 3) * TILE_SIZE;
        }

        function launchGame() {
            gameStarted = true;
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('ui-overlay').style.display = 'block';
            document.getElementById('health-bar').style.display = 'flex';
            document.getElementById('hotbar-container').style.display = 'flex';
            updateHotbarUI();
            updateHealthUI();
        }

        function updateHealthUI() {
            const activeHearts = Math.ceil(Math.max(0, Math.min(100, localPlayer.hp)) / 10);
            for (let i = 0; i < 10; i++) {
                const heart = document.getElementById(`heart-${i}`);
                if (heart) {
                    if (i < activeHearts) {
                        heart.classList.add('full');
                    } else {
                        heart.classList.remove('full');
                    }
                }
            }
        }

        function seededRandom(seed) {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        function generateChunk(cx) {
            const chunkData = [];
            for (let x = 0; x < CHUNK_WIDTH; x++) {
                const worldX = cx * CHUNK_WIDTH + x;
                const surfaceHeight = Math.floor(40 + Math.sin(worldX * 0.04 + worldSeed) * 9 + Math.cos(worldX * 0.015 + worldSeed * 0.5) * 14);
                
                const column = { surfaceHeight, blocks: {}, trees: [] };
                for (let y = 0; y < WORLD_HEIGHT; y++) {
                    let type = null;
                    if (y === surfaceHeight) {
                        type = 'grass';
                    } else if (y > surfaceHeight && y < surfaceHeight + 5) {
                        type = 'dirt';
                    } else if (y >= surfaceHeight + 5) {
                        const oreCheck = seededRandom(worldSeed + worldX * 73 + y * 19);
                        if (y > surfaceHeight + 15 && oreCheck < 0.06) {
                            type = oreCheck < 0.03 ? 'copper_ore' : 'iron_ore';
                        } else {
                            type = 'stone';
                        }
                    }
                    if (type) column.blocks[y] = type;
                }

                const treeCheck = seededRandom(worldSeed + worldX * 127);
                if (treeCheck < 0.25 && x > 2 && x < CHUNK_WIDTH - 2) {
                    const sh = surfaceHeight;
                    const treeHeight = 5 + Math.floor(seededRandom(worldSeed + worldX * 31) * 3);
                    const treeTrunkX = worldX;
                    const treeTrunkBaseY = sh - 1;

                    const treeBlocks = [];
                    for (let th = 0; th < treeHeight; th++) {
                        treeBlocks.push({ x: treeTrunkX, y: treeTrunkBaseY - th, type: 'wood' });
                    }
                    for (let lx = -2; lx <= 2; lx++) {
                        for (let ly = -treeHeight - 3; ly <= -treeHeight; ly++) {
                            if (Math.abs(lx) === 2 && Math.abs(ly + treeHeight + 1.5) > 1.5 && seededRandom(worldSeed + worldX * 5 + lx * 7 + ly * 11) < 0.3) continue;
                            treeBlocks.push({ x: treeTrunkX + lx, y: treeTrunkBaseY + ly, type: 'leaves' });
                        }
                    }
                    column.trees = treeBlocks;
                }

                chunkData[x] = column;
            }
            loadedChunks.set(cx, chunkData);
            return chunkData;
        }

        function handleHostNetworkData(connection, data) {
            if (data.type === 'JOIN_REQUEST') {
                let clientName = data.name;
                if (clientName.toLowerCase() === localPlayer.name.toLowerCase()) {
                    clientName += '_2';
                }

                remotePlayers[connection.peer] = {
                    id: connection.peer,
                    name: clientName,
                    x: data.x || 0, 
                    y: data.y || 0,
                    facing: 1, 
                    swingTimer: 0
                };

                const serializedChunks = {};
                loadedChunks.forEach((chunk, cx) => {
                    serializedChunks[cx] = chunk;
                });

                connection.send({
                    type: 'INIT_SUCCESS',
                    seed: worldSeed,
                    name: clientName,
                    spawnX: localPlayer.x,
                    spawnY: localPlayer.y,
                    players: remotePlayers,
                    chunks: serializedChunks
                });

                broadcastToClients({ type: 'PLAYER_JOINED', player: remotePlayers[connection.peer] }, connection.peer);
            } 
            else if (data.type === 'PLAYER_UPDATE') {
                if (remotePlayers[connection.peer]) {
                    const rp = remotePlayers[connection.peer];
                    rp.targetX = data.state.x;
                    rp.targetY = data.state.y;
                    rp.facing = data.state.facing;
                    rp.swingTimer = data.state.swingTimer;
                    rp.name = data.state.name;
                }
                broadcastToClients({ type: 'REMOTE_PLAYER_UPDATE', id: connection.peer, state: data.state }, connection.peer);
            }
            else if (data.type === 'BLOCK_ACTION') {
                setBlock(data.bx, data.by, data.typeAction);
                if (data.typeAction === null) {
                    itemDrops.push({ x: (data.bx + 0.5) * TILE_SIZE, y: data.by * TILE_SIZE, vx: (Math.random() - 0.5) * 3, vy: -3, type: data.itemType });
                }
                broadcastToClients(data);
            }
        }

        function handleClientNetworkData(data) {
            if (data.type === 'INIT_SUCCESS') {
                worldSeed = data.seed;
                localPlayer.name = data.name;
                localPlayer.x = data.spawnX;
                localPlayer.y = data.spawnY;

                if (data.players) {
                    for (const [id, pData] of Object.entries(data.players)) {
                        if (id !== localPlayer.id) {
                            remotePlayers[id] = {
                                ...pData,
                                targetX: pData.x,
                                targetY: pData.y
                            };
                        }
                    }
                }
                if (data.chunks) {
                    loadedChunks.clear();
                    for (const [cxStr, chunkData] of Object.entries(data.chunks)) {
                        loadedChunks.set(parseInt(cxStr), chunkData);
                    }
                }
                launchGame();
            }
            else if (data.type === 'PLAYER_JOINED') {
                remotePlayers[data.player.id] = {
                    ...data.player,
                    targetX: data.player.x,
                    targetY: data.player.y
                };
            }
            else if (data.type === 'REMOTE_PLAYER_UPDATE') {
                if (!remotePlayers[data.id]) {
                    remotePlayers[data.id] = { id: data.id, name: 'Player', x: data.state.x, y: data.state.y, targetX: data.state.x, targetY: data.state.y };
                }
                const rp = remotePlayers[data.id];
                rp.targetX = data.state.x;
                rp.targetY = data.state.y;
                rp.facing = data.state.facing;
                rp.swingTimer = data.state.swingTimer;
                rp.name = data.state.name;
            }
            else if (data.type === 'PLAYER_DISCONNECTED') {
                delete remotePlayers[data.id];
            }
            else if (data.type === 'BLOCK_ACTION') {
                setBlock(data.bx, data.by, data.typeAction);
                if (data.typeAction === null) {
                    itemDrops.push({ x: (data.bx + 0.5) * TILE_SIZE, y: data.by * TILE_SIZE, vx: (Math.random() - 0.5) * 3, vy: -3, type: data.itemType });
                }
            }
        }

        function broadcastToClients(packet, excludePeerId = null) {
            hostConnections.forEach(c => {
                if (c.peer !== excludePeerId) {
                    c.send(packet);
                }
            });
        }

        const keys = {};
        const mouse = { x: 0, y: 0, down: false };

        window.addEventListener('keydown', e => {
            if (!gameStarted) return;
            if ((e.code >= 'Digit1' && e.code <= 'Digit9') || e.code === 'Digit0') {
                e.preventDefault();
            }
            keys[e.code] = true;

            // Proper hotbar slot switching via number keys (1-9 and 0 for slot 10)
            if (e.code >= 'Digit1' && e.code <= 'Digit9') {
                localPlayer.selectedSlot = parseInt(e.code) - 1;
                updateHotbarUI();
            } else if (e.code === 'Digit0') {
                localPlayer.selectedSlot = 9;
                updateHotbarUI();
            }
        });
        window.addEventListener('keyup', e => { if (gameStarted) keys[e.code] = false; });
        window.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });
        window.addEventListener('mousedown', () => { if (gameStarted) mouse.down = true; });
        window.addEventListener('mouseup', () => { mouse.down = false; });
        window.addEventListener('contextmenu', e => e.preventDefault());

        function addItemToInventory(itemType) {
            // First check if same item type exists in hotbar to stack
            for (let i = 0; i < 10; i++) {
                if (localPlayer.inventory[i].type === itemType) {
                    localPlayer.inventory[i].count++;
                    updateHotbarUI();
                    return true;
                }
            }
            // Otherwise put in first empty slot
            for (let i = 0; i < 10; i++) {
                if (localPlayer.inventory[i].type === null) {
                    localPlayer.inventory[i].type = itemType;
                    localPlayer.inventory[i].count = 1;
                    updateHotbarUI();
                    return true;
                }
            }
            return false; // Inventory full
        }

        function updateHotbarUI() {
            for (let i = 0; i < 10; i++) {
                const slot = document.getElementById(`slot-${i}`);
                const item = localPlayer.inventory[i];
                if (slot) {
                    const countSpan = slot.querySelector('span');
                    // Display short readable label for items/blocks
                    let label = '';
                    if (item.type) {
                        if (item.type === 'wood') label = 'Wood';
                        else if (item.type === 'stone') label = 'Stone';
                        else if (item.type === 'dirt' || item.type === 'grass') label = 'Dirt';
                        else if (item.type === 'leaves') label = 'Leaf';
                        else if (item.type === 'copper_ore') label = 'Copper';
                        else if (item.type === 'iron_ore') label = 'Iron';
                        else label = item.type;
                    }
                    
                    // Remove old text node if exists and keep count span
                    slot.childNodes[0].nodeValue = label;
                    if (countSpan) {
                        countSpan.innerText = item.count > 0 ? item.count : '';
                    }
                    slot.classList.toggle('active', i === localPlayer.selectedSlot);
                }
            }
        }

        function getBlock(bx, by) {
            const cx = Math.floor(bx / CHUNK_WIDTH);
            const lx = ((bx % CHUNK_WIDTH) + CHUNK_WIDTH) % CHUNK_WIDTH;
            let chunk = loadedChunks.get(cx);
            if (!chunk) chunk = generateChunk(cx);
            return chunk[lx]?.blocks[by] || null;
        }

        function setBlock(bx, by, type) {
            const cx = Math.floor(bx / CHUNK_WIDTH);
            const lx = ((bx % CHUNK_WIDTH) + CHUNK_WIDTH) % CHUNK_WIDTH;
            let chunk = loadedChunks.get(cx);
            if (!chunk) chunk = generateChunk(cx);
            if (type === null) {
                delete chunk[lx].blocks[by];
            } else {
                chunk[lx].blocks[by] = type;
            }
        }

        function checkCollision(nx, ny) {
            const left = Math.floor(nx / TILE_SIZE);
            const right = Math.floor((nx + localPlayer.width - 1) / TILE_SIZE);
            const top = Math.floor(ny / TILE_SIZE);
            const bottom = Math.floor((ny + localPlayer.height - 1) / TILE_SIZE);

            for (let bx = left; bx <= right; bx++) {
                for (let by = top; by <= bottom; by++) {
                    if (getBlock(bx, by) !== null) return true;
                }
            }
            return false;
        }

        function updateLocalPlayer() {
            localPlayer.vx = 0;
            if (keys['KeyA'] || keys['ArrowLeft']) { localPlayer.vx = -localPlayer.speed; localPlayer.facing = -1; }
            if (keys['KeyD'] || keys['ArrowRight']) { localPlayer.vx = localPlayer.speed; localPlayer.facing = 1; }

            localPlayer.x += localPlayer.vx;
            if (checkCollision(localPlayer.x, localPlayer.y)) localPlayer.x -= localPlayer.vx;

            localPlayer.vy += localPlayer.gravity;
            localPlayer.y += localPlayer.vy;
            localPlayer.grounded = false;

            if (checkCollision(localPlayer.x, localPlayer.y)) {
                localPlayer.y -= localPlayer.vy;
                if (localPlayer.vy > 0) localPlayer.grounded = true;
                localPlayer.vy = 0;
            }

            if ((keys['Space'] || keys['KeyW'] || keys['ArrowUp']) && localPlayer.grounded) {
                localPlayer.vy = localPlayer.jumpForce;
                localPlayer.grounded = false;
            }

            // Check picking up item drops in world
            for (let i = itemDrops.length - 1; i >= 0; i--) {
                const drop = itemDrops[i];
                const dist = Math.hypot((localPlayer.x + localPlayer.width/2) - drop.x, (localPlayer.y + localPlayer.height/2) - drop.y);
                if (dist < 28) {
                    if (addItemToInventory(drop.type)) {
                        itemDrops.splice(i, 1);
                    }
                }
            }

            if (localPlayer.swingTimer > 0) localPlayer.swingTimer--;

            if (mouse.down && localPlayer.swingTimer === 0) {
                const cameraX = localPlayer.x - canvas.width / 2 + localPlayer.width / 2;
                const cameraY = localPlayer.y - canvas.height / 2 + localPlayer.height / 2;
                const worldMouseX = mouse.x + cameraX;
                const worldMouseY = mouse.y + cameraY;

                const targetBx = Math.floor(worldMouseX / TILE_SIZE);
                const targetBy = Math.floor(worldMouseY / TILE_SIZE);
                const pBx = Math.floor((localPlayer.x + localPlayer.width / 2) / TILE_SIZE);
                const pBy = Math.floor((localPlayer.y + localPlayer.height / 2) / TILE_SIZE);

                if (Math.hypot(targetBx - pBx, targetBy - pBy) < 6) {
                    const block = getBlock(targetBx, targetBy);
                    const selectedSlotData = localPlayer.inventory[localPlayer.selectedSlot];

                    if (block) {
                        localPlayer.swingTimer = 12;
                        const blockColor = COLORS[block] || '#fff';
                        const minedType = block;
                        setBlock(targetBx, targetBy, null);

                        for (let p = 0; p < 5; p++) {
                            particles.push({
                                x: (targetBx + 0.5) * TILE_SIZE, y: (targetBy + 0.5) * TILE_SIZE,
                                vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.7) * 5,
                                size: Math.random() * 3 + 2, color: blockColor, life: 20
                            });
                        }

                        let dropName = 'wood';
                        if (minedType.includes('ore')) dropName = minedType;
                        else if (minedType === 'stone') dropName = 'stone';
                        else if (minedType === 'dirt' || minedType === 'grass') dropName = 'dirt';
                        else if (minedType === 'leaves') dropName = 'leaves';

                        // Spawn physical block drop in world
                        itemDrops.push({
                            x: (targetBx + 0.5) * TILE_SIZE,
                            y: targetBy * TILE_SIZE,
                            vx: (Math.random() - 0.5) * 3,
                            vy: -3,
                            type: dropName
                        });

                        const packet = { type: 'BLOCK_ACTION', bx: targetBx, by: targetBy, typeAction: null, itemType: dropName };
                        if (isHost) broadcastToClients(packet);
                        else if (conn) conn.send(packet);
                    } else {
                        // Placing selected block
                        if (selectedSlotData.type !== null && selectedSlotData.count > 0) {
                            let placeType = selectedSlotData.type;
                            setBlock(targetBx, targetBy, placeType);
                            selectedSlotData.count--;
                            if (selectedSlotData.count <= 0) {
                                selectedSlotData.type = null;
                            }
                            updateHotbarUI();
                            localPlayer.swingTimer = 10;

                            const packet = { type: 'BLOCK_ACTION', bx: targetBx, by: targetBy, typeAction: placeType };
                            if (isHost) broadcastToClients(packet);
                            else if (conn) conn.send(packet);
                        }
                    }
                }
            }

            const statePayload = {
                x: localPlayer.x,
                y: localPlayer.y,
                facing: localPlayer.facing,
                swingTimer: localPlayer.swingTimer,
                name: localPlayer.name
            };
            if (isHost) {
                broadcastToClients({ type: 'REMOTE_PLAYER_UPDATE', id: localPlayer.id, state: statePayload });
            } else if (conn && conn.open) {
                conn.send({ type: 'PLAYER_UPDATE', state: statePayload });
            }
        }

        function draw() {
            Object.values(remotePlayers).forEach(rp => {
                if (rp.targetX !== undefined) {
                    rp.x += (rp.targetX - rp.x) * 0.25;
                }
                if (rp.targetY !== undefined) {
                    rp.y += (rp.targetY - rp.y) * 0.25;
                }
            });

            const camera = {
                x: localPlayer.x - canvas.width / 2 + localPlayer.width / 2,
                y: localPlayer.y - canvas.height / 2 + localPlayer.height / 2
            };

            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, COLORS.skyTop);
            grad.addColorStop(1, COLORS.skyBottom);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
            clouds.forEach(cloud => {
                cloud.x -= cloud.speed;
                if (cloud.x < -cloud.width) cloud.x = canvas.width + 300;
                let renderCloudX = cloud.x - (camera.x * 0.2) % (canvas.width + 400);
                ctx.fillRect(renderCloudX, cloud.y, cloud.width, cloud.height);
            });

            const startChunk = Math.floor(camera.x / (CHUNK_WIDTH * TILE_SIZE)) - 1;
            const endChunk = startChunk + Math.ceil(canvas.width / (CHUNK_WIDTH * TILE_SIZE)) + 2;

            for (let cx = startChunk; cx <= endChunk; cx++) {
                let chunk = loadedChunks.get(cx) || generateChunk(cx);

                chunk.forEach(col => {
                    col.trees.forEach(t => {
                        const sx = t.x * TILE_SIZE - camera.x;
                        const sy = t.y * TILE_SIZE - camera.y;
                        if (sx >= -TILE_SIZE && sx <= canvas.width + TILE_SIZE && sy >= -TILE_SIZE && sy <= canvas.height + TILE_SIZE) {
                            ctx.fillStyle = COLORS[t.type];
                            ctx.fillRect(sx, sy, TILE_SIZE, TILE_SIZE);
                        }
                    });
                });

                for (let lx = 0; lx < CHUNK_WIDTH; lx++) {
                    const bx = cx * CHUNK_WIDTH + lx;
                    const col = chunk[lx];
                    for (const [strY, type] of Object.entries(col.blocks)) {
                        const by = parseInt(strY);
                        const sx = bx * TILE_SIZE - camera.x;
                        const sy = by * TILE_SIZE - camera.y;

                        if (sx < -TILE_SIZE || sx > canvas.width + TILE_SIZE || sy < -TILE_SIZE || sy > canvas.height + TILE_SIZE) continue;

                        ctx.fillStyle = COLORS[type] || '#fff';
                        ctx.fillRect(sx, sy, TILE_SIZE, TILE_SIZE);

                        if (by > col.surfaceHeight) {
                            const depth = by - col.surfaceHeight;
                            const alpha = Math.min(0.88, depth * 0.08 + 0.05);
                            ctx.fillStyle = `rgba(10, 10, 18, ${alpha})`;
                            ctx.fillRect(sx, sy, TILE_SIZE, TILE_SIZE);
                        }
                    }
                }
            }

            // Draw item drops in world
            itemDrops.forEach(drop => {
                drop.x += drop.vx;
                drop.y += drop.vy;
                drop.vy += 0.4; // gravity on drops
                // check floor collision for drop
                const bx = Math.floor(drop.x / TILE_SIZE);
                const by = Math.floor((drop.y + 8) / TILE_SIZE);
                if (getBlock(bx, by) !== null) {
                    drop.y = by * TILE_SIZE - 8;
                    drop.vy = 0;
                    drop.vx *= 0.8;
                }

                const sx = drop.x - camera.x;
                const sy = drop.y - camera.y;
                ctx.fillStyle = COLORS[drop.type] || '#f1c40f';
                ctx.fillRect(sx - 5, sy - 5, 10, 10);
            });

            particles.forEach(pt => {
                ctx.fillStyle = pt.color;
                ctx.fillRect(pt.x - camera.x, pt.y - camera.y, pt.size, pt.size);
            });

            function renderPlayerEntity(p, shirtColor) {
                const px = p.x - camera.x;
                const py = p.y - camera.y;

                ctx.fillStyle = '#2c3e50';
                ctx.fillRect(px + 3, py + 26, 5, 12);
                ctx.fillRect(px + 12, py + 26, 5, 12);
                ctx.fillStyle = shirtColor;
                ctx.fillRect(px + 2, py + 12, 16, 16);
                ctx.fillStyle = '#f1c40f';
                ctx.fillRect(px + 3, py + 2, 14, 12);
                ctx.fillStyle = '#d35400';
                ctx.fillRect(px + 3, py, 14, 4);

                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.font = '11px Courier New';
                ctx.textAlign = 'center';
                const nameWidth = ctx.measureText(p.name).width;
                ctx.fillRect(px + 10 - nameWidth/2 - 4, py - 22, nameWidth + 8, 16);
                ctx.fillStyle = '#ffffff';
                ctx.fillText(p.name, px + 10, py - 10);

                if (p.swingTimer > 0) {
                    ctx.save();
                    ctx.translate(px + 10, py + 19);
                    ctx.rotate(p.facing * (1 - p.swingTimer / 12) * Math.PI * 1.2);
                    ctx.fillStyle = '#bdc3c7';
                    ctx.fillRect(10, -4, 20, 6);
                    ctx.restore();
                }
            }

            renderPlayerEntity(localPlayer, '#2980b9');

            Object.values(remotePlayers).forEach(rp => {
                renderPlayerEntity(rp, '#8e44ad');
            });
        }

        function loop() {
            if (gameStarted) {
                updateLocalPlayer();

                for (let i = particles.length - 1; i >= 0; i--) {
                    const pt = particles[i];
                    pt.x += pt.vx; pt.y += pt.vy;
                    pt.vy += 0.3; pt.life--;
                    if (pt.life <= 0) particles.splice(i, 1);
                }

                draw();
            }
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
