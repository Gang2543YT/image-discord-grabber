<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft-Style Voxel Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: monospace;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            pointer-events: none;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="crosshair">+</div>
    <div id="ui">
        Controls: WASD to Move, Space to Jump, Mouse to Look<br>
        Left Click: Break Block (Stone/Ores require a pickaxe)<br>
        Right Click: Place Block<br>
        Inventory/Tool: Press 'E' to toggle dummy crafting/tool check
    </div>

    <!-- Include Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- GAME STATE & CONFIGURATION ---
        const CHUNK_SIZE = 16;
        const CHUNK_HEIGHT = 64;
        const RENDER_DISTANCE = 2;
        const loadedChunks = new Map();

        let scene, camera, renderer;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let prevTime = performance.now();

        // Player Inventory & Equipment
        const playerInventory = {
            selectedTool: { type: 'wooden_pickaxe' }, // Start with a pickaxe for testing
            items: { wood: 10, stone: 5 },
            getSelectedToolbarItem() { return this.selectedTool; }
        };

        // Block Materials (Minecraft-inspired palette)
        const blockMaterials = {
            grass: new THREE.MeshLambertMaterial({ color: 0x559933 }),
            dirt: new THREE.MeshLambertMaterial({ color: 0x866043 }),
            stone: new THREE.MeshLambertMaterial({ color: 0x7f7f7f }),
            iron_ore: new THREE.MeshLambertMaterial({ color: 0x9e9e9e }),
            oak_planks: new THREE.MeshLambertMaterial({ color: 0xa67c52 })
        };

        // Crafting Recipes System
        const craftingRecipes = [
            {
                input: [['oak_log']],
                output: { item: 'oak_planks', count: 4 }
            },
            {
                input: [['oak_planks'], ['oak_planks']],
                output: { item: 'stick', count: 4 }
            },
            {
                input: [
                    ['oak_planks', 'oak_planks', 'oak_planks'],
                    [null, 'stick', null],
                    [null, 'stick', null]
                ],
                output: { item: 'wooden_pickaxe', count: 1 }
            },
            {
                input: [
                    ['stone', 'stone', 'stone'],
                    [null, 'stick', null],
                    [null, 'stick', null]
                ],
                output: { item: 'stone_pickaxe', count: 1 }
            }
        ];

        // --- INITIALIZATION ---
        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(8, 40, 8);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.4);
            sunLight.position.set(50, 100, 50);
            scene.add(sunLight);

            // Event Listeners
            setupControls();
            window.addEventListener('resize', onWindowResize);
        }

        // --- INFINITE CHUNK GENERATION ---
        function getChunkKey(cx, cz) {
            return `${cx},${cz}`;
        }

        function updateChunks() {
            const playerChunkX = Math.floor(camera.position.x / CHUNK_SIZE);
            const playerChunkZ = Math.floor(camera.position.z / CHUNK_SIZE);
            const activeChunks = new Set();

            for (let x = -RENDER_DISTANCE; x <= RENDER_DISTANCE; x++) {
                for (let z = -RENDER_DISTANCE; z <= RENDER_DISTANCE; z++) {
                    const cx = playerChunkX + x;
                    const cz = playerChunkZ + z;
                    const key = getChunkKey(cx, cz);
                    activeChunks.add(key);

                    if (!loadedChunks.has(key)) {
                        generateChunk(cx, cz);
                    }
                }
            }

            // Unload out-of-range chunks
            for (const [key, chunk] of loadedChunks.entries()) {
                if (!activeChunks.has(key)) {
                    scene.remove(chunk.mesh);
                    loadedChunks.delete(key);
                }
            }
        }

        function generateChunk(cx, cz) {
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const instancedBlockGroups = {};

            // Collect block transformations per type for efficiency
            for (let x = 0; x < CHUNK_SIZE; x++) {
                for (let z = 0; z < CHUNK_SIZE; z++) {
                    const worldX = cx * CHUNK_SIZE + x;
                    const worldZ = cz * CHUNK_SIZE + z;
                    
                    const surfaceHeight = Math.floor(20 + Math.sin(worldX * 0.1) * 4 + Math.cos(worldZ * 0.1) * 4);

                    for (let y = 0; y < CHUNK_HEIGHT; y++) {
                        let blockType = null;
                        if (y === surfaceHeight) {
                            blockType = 'grass';
                        } else if (y < surfaceHeight && y > surfaceHeight - 4) {
                            blockType = 'dirt';
                        } else if (y <= surfaceHeight - 4) {
                            blockType = (y < 10 && Math.random() < 0.08) ? 'iron_ore' : 'stone';
                        }

                        if (blockType) {
                            if (!instancedBlockGroups[blockType]) instancedBlockGroups[blockType] = [];
                            
                            // Apply Underground Darkness & Smooth Transition starting right below grass
                            let lightingFactor = 1.0;
                            if (y < surfaceHeight) {
                                const depth = surfaceHeight - y;
                                lightingFactor = Math.max(0.12, 1.0 - (depth * 0.18));
                            }

                            instancedBlockGroups[blockType].push({
                                matrix: new THREE.Matrix4().makeTranslation(worldX, y, worldZ),
                                light: lightingFactor
                            });
                        }
                    }
                }
            }

            const chunkGroup = new THREE.Group();
            for (const [type, dataList] of Object.entries(instancedBlockGroups)) {
                const mat = blockMaterials[type].clone();
                const instancedMesh = new THREE.InstancedMesh(geometry, mat, dataList.length);
                
                dataList.forEach((item, index) => {
                    instancedMesh.setMatrixAt(index, item.matrix);
                    // Tint color for depth/darkness transition
                    instancedMesh.setColorAt(index, new THREE.Color(item.light, item.light, item.light));
                });
                
                instancedMesh.instanceMatrix.needsUpdate = true;
                if (instancedMesh.instanceColor) instancedMesh.instanceColor.needsUpdate = true;
                chunkGroup.add(instancedMesh);
            }

            scene.add(chunkGroup);
            loadedChunks.set(getChunkKey(cx, cz), { mesh: chunkGroup });
        }

        // --- TOOL-GATED MINING & INTERACTION ---
        window.addEventListener('mousedown', (e) => {
            if (document.pointerLockElement !== document.body) {
                document.body.requestPointerLock();
                return;
            }

            // Raycast logic to break/place blocks
            const raycaster = new THREE.Raycaster();
            const center = new THREE.Vector2(0, 0);
            raycaster.setFromCamera(center, camera);
            
            const intersects = raycaster.intersectObjects(scene.children, true);
            if (intersects.length > 0 && intersects[0].distance < 6) {
                const intersect = intersects[0];
                
                if (e.button === 0) { // Left click: Break
                    handleBlockBreak(intersect);
                } else if (e.button === 2) { // Right click: Place
                    handleBlockPlace(intersect);
                }
            }
        });

        function handleBlockBreak(intersect) {
            // Simplified block validation and tool requirement check
            const requiresPickaxe = true; // Assuming targeted block is stone/ore for simulation
            if (requiresPickaxe) {
                const activeTool = playerInventory.getSelectedToolbarItem();
                const hasPickaxe = activeTool && activeTool.type.includes('pickaxe');
                if (!hasPickaxe) {
                    console.warn("You need a pickaxe to mine this block!");
                    return;
                }
            }
            // Remove object mesh instance or chunk element
            const object = intersect.object;
            scene.remove(object);
        }

        function handleBlockPlace(intersect) {
            const position = intersect.point.clone().add(intersect.face.normal.clone().multiplyScalar(0.5));
            const x = Math.floor(position.x);
            const y = Math.floor(position.y);
            const z = Math.floor(position.z);

            const geom = new THREE.BoxGeometry(1, 1, 1);
            const mesh = new THREE.Mesh(geom, blockMaterials.oak_planks);
            mesh.position.set(x, y, z);
            scene.add(mesh);
        }

        // --- CONTROLS & ANIMATION LOOP ---
        function setupControls() {
            document.addEventListener('keydown', (e) => {
                if (e.code === 'KeyW') moveForward = true;
                if (e.code === 'KeyS') moveBackward = true;
                if (e.code === 'KeyA') moveLeft = true;
                if (e.code === 'KeyD') moveRight = true;
            });
            document.addEventListener('keyup', (e) => {
                if (e.code === 'KeyW') moveForward = false;
                if (e.code === 'KeyS') moveBackward = false;
                if (e.code === 'KeyA') moveLeft = false;
                if (e.code === 'KeyD') moveRight = false;
            });
            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === document.body) {
                    camera.rotation.y -= e.movementX * 0.002;
                    camera.rotation.x -= e.movementY * 0.002;
                    camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
                }
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            // Basic movement physics
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;

            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();

            if (moveForward || moveBackward) velocity.z -= direction.z * 50.0 * delta;
            if (moveLeft || moveRight) velocity.x -= direction.x * 50.0 * delta;

            camera.translateX(velocity.x * delta);
            camera.translateZ(velocity.z * delta);

            // Update infinite chunks based on player location
            updateChunks();

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
