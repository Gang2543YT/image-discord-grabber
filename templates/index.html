<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2D Block Miner</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #87CEEB; /* Sky blue */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }
    canvas {
      display: block;
    }
    /* Inventory UI */
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      pointer-events: none;
      padding: 15px;
      box-sizing: border-box;
    }
    #inventory {
      background: rgba(0, 0, 0, 0.6);
      border: 3px solid #444;
      border-radius: 10px;
      padding: 10px;
      display: inline-flex;
      gap: 15px;
      pointer-events: auto;
    }
    .inv-slot {
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid #fff;
      border-radius: 6px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }
    .inv-slot .block-icon {
      width: 30px;
      height: 30px;
      border-radius: 4px;
    }
    .inv-count {
      position: absolute;
      bottom: -5px;
      right: -5px;
      background: #222;
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 10px;
      border: 2px solid #555;
    }
  </style>
</head>
<body>

  <div id="ui-layer">
    <div id="inventory">
      <div class="inv-slot">
        <div class="block-icon" style="background: #4CAF50;"></div>
        <div class="inv-count" id="count-grass">0</div>
      </div>
      <div class="inv-slot">
        <div class="block-icon" style="background: #795548;"></div>
        <div class="inv-count" id="count-dirt">0</div>
      </div>
      <div class="inv-slot">
        <div class="block-icon" style="background: #9E9E9E;"></div>
        <div class="inv-count" id="count-stone">0</div>
      </div>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// --- GAME SETTINGS ---
const TILE = 40;
const COLS = 100;
const ROWS = 50;
const GRAVITY = 0.5;
const FRICTION = 0.8;

// Resize handling
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// --- WORLD GENERATION ---
// 0: Air, 1: Grass, 2: Dirt, 3: Stone
let world = [];
for (let y = 0; y < ROWS; y++) {
  let row = [];
  for (let x = 0; x < COLS; x++) {
    if (y < 20) row.push(0); // Sky
    else if (y === 20) row.push(1); // Surface Grass
    else if (y > 20 && y < 25) row.push(2); // Dirt layer
    else row.push(3); // Deep Stone
  }
  world.push(row);
}

// Block Colors Dictionary
const blockColors = {
  1: "#4CAF50", // Grass
  2: "#795548", // Dirt
  3: "#9E9E9E"  // Stone
};

// --- PLAYER STATE ---
let player = {
  x: TILE * 5,
  y: TILE * 15, // Start above ground
  w: 26,
  h: 38,
  vx: 0,
  vy: 0,
  speed: 4,
  jumpPower: -10,
  grounded: false,
  facingRight: true,
  walkFrame: 0, // For walking animation
  miningFrame: 0, // For arm swinging
  inventory: { 1: 0, 2: 0, 3: 0 }
};

// --- PARTICLES ---
let particles = [];
function spawnParticles(x, y, color) {
  for (let i = 0; i < 6; i++) {
    particles.push({
      x: x + TILE / 2,
      y: y + TILE / 2,
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 8 - 2,
      size: Math.random() * 6 + 4,
      life: 1.0,
      color: color
    });
  }
}

// --- INPUTS ---
let keys = {};
window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

let mouse = { x: 0, y: 0, down: false };
window.addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener("mousedown", e => { mouse.down = true; attemptMine(); });
window.addEventListener("mouseup", e => { mouse.down = false; });

// --- CAMERA ---
let cam = { x: 0, y: 0 };

// --- COLLISION LOGIC ---
function getTile(tx, ty) {
  if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) return 1; // Bounds act as solid blocks
  return world[ty][tx];
}

function checkCollision(x, y, w, h) {
  let leftTile = Math.floor(x / TILE);
  let rightTile = Math.floor((x + w) / TILE);
  let topTile = Math.floor(y / TILE);
  let bottomTile = Math.floor((y + h) / TILE);

  for (let ty = topTile; ty <= bottomTile; ty++) {
    for (let tx = leftTile; tx <= rightTile; tx++) {
      if (getTile(tx, ty) !== 0) return true;
    }
  }
  return false;
}

// --- MINING MECHANICS ---
function attemptMine() {
  // Translate screen mouse to world coordinates
  let worldX = mouse.x + cam.x;
  let worldY = mouse.y + cam.y;
  
  let tx = Math.floor(worldX / TILE);
  let ty = Math.floor(worldY / TILE);

  // Check distance (reach)
  let pCenterX = player.x + player.w / 2;
  let pCenterY = player.y + player.h / 2;
  let dist = Math.hypot((tx * TILE + TILE / 2) - pCenterX, (ty * TILE + TILE / 2) - pCenterY);

  if (dist < TILE * 4 && tx >= 0 && tx < COLS && ty >= 0 && ty < ROWS) {
    let blockType = world[ty][tx];
    if (blockType !== 0) {
      // Trigger mining animation
      player.miningFrame = 15;
      
      // Add to inventory and UI
      player.inventory[blockType]++;
      updateUI();
      
      // Break block and spawn particles
      spawnParticles(tx * TILE, ty * TILE, blockColors[blockType]);
      world[ty][tx] = 0; 
    }
  }
}

function updateUI() {
  document.getElementById("count-grass").innerText = player.inventory[1];
  document.getElementById("count-dirt").innerText = player.inventory[2];
  document.getElementById("count-stone").innerText = player.inventory[3];
}

// --- MAIN UPDATE LOOP ---
function update() {
  // 1. Horizontal Movement
  if (keys['a']) { player.vx = -player.speed; player.facingRight = false; player.walkFrame++; }
  else if (keys['d']) { player.vx = player.speed; player.facingRight = true; player.walkFrame++; }
  else { player.vx *= FRICTION; player.walkFrame = 0; }

  player.x += player.vx;
  if (checkCollision(player.x, player.y, player.w, player.h)) {
    // Resolve X collision
    if (player.vx > 0) player.x = Math.floor((player.x + player.w) / TILE) * TILE - player.w - 0.01;
    if (player.vx < 0) player.x = Math.floor(player.x / TILE) * TILE + TILE + 0.01;
    player.vx = 0;
  }

  // 2. Vertical Movement (Gravity)
  player.vy += GRAVITY;
  player.y += player.vy;
  player.grounded = false;

  if (checkCollision(player.x, player.y, player.w, player.h)) {
    // Resolve Y collision
    if (player.vy > 0) {
      player.y = Math.floor((player.y + player.h) / TILE) * TILE - player.h - 0.01;
      player.grounded = true;
    }
    if (player.vy < 0) {
      player.y = Math.floor(player.y / TILE) * TILE + TILE + 0.01;
    }
    player.vy = 0;
  }

  // Jumping
  if ((keys['w'] || keys[' ']) && player.grounded) {
    player.vy = player.jumpPower;
  }

  // Animation Timers
  if (player.miningFrame > 0) player.miningFrame--;

  // Update Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.3; // Gravity on particles
    p.life -= 0.05;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Update Camera (Smooth follow)
  let targetCamX = (player.x + player.w / 2) - canvas.width / 2;
  let targetCamY = (player.y + player.h / 2) - canvas.height / 2;
  
  // Clamp camera to world bounds
  targetCamX = Math.max(0, Math.min(targetCamX, COLS * TILE - canvas.width));
  targetCamY = Math.max(0, Math.min(targetCamY, ROWS * TILE - canvas.height));

  cam.x += (targetCamX - cam.x) * 0.1;
  cam.y += (targetCamY - cam.y) * 0.1;
}

// --- DRAW LOOP ---
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(-cam.x, -cam.y);

  // Draw Blocks (Only visible ones)
  let startCol = Math.max(0, Math.floor(cam.x / TILE));
  let endCol = Math.min(COLS, startCol + Math.ceil(canvas.width / TILE) + 1);
  let startRow = Math.max(0, Math.floor(cam.y / TILE));
  let endRow = Math.min(ROWS, startRow + Math.ceil(canvas.height / TILE) + 1);

  for (let y = startRow; y < endRow; y++) {
    for (let x = startCol; x < endCol; x++) {
      let block = world[y][x];
      if (block !== 0) {
        ctx.fillStyle = blockColors[block];
        ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
        
        // Block shading/borders for depth
        ctx.fillStyle = "rgba(0,0,0,0.15)";
        ctx.fillRect(x * TILE, y * TILE + TILE - 4, TILE, 4);
        ctx.fillRect(x * TILE + TILE - 4, y * TILE, 4, TILE);
      }
    }
  }

  // Draw Player (Animated)
  let px = player.x;
  let py = player.y;
  
  // Walking bounce animation
  let bounce = (player.vx !== 0 && player.grounded) ? Math.sin(player.walkFrame * 0.5) * 3 : 0;
  
  ctx.fillStyle = "#FFC107"; // Player head/body color
  
  // Draw Body
  ctx.fillRect(px, py + bounce, player.w, player.h - bounce);
  
  // Draw Eyes based on facing direction
  ctx.fillStyle = "#000";
  let eyeOffset = player.facingRight ? 16 : 4;
  ctx.fillRect(px + eyeOffset, py + bounce + 6, 6, 6);

  // Draw Mining Tool (Pickaxe Arm)
  if (player.miningFrame > 0) {
    ctx.save();
    let armX = px + (player.facingRight ? player.w : 0);
    let armY = py + player.h / 2 + bounce;
    ctx.translate(armX, armY);
    
    // Calculate rotation angle towards mouse
    let angle = Math.atan2(mouse.y + cam.y - armY, mouse.x + cam.x - armX);
    
    // Add swinging motion based on the miningFrame
    let swing = (player.miningFrame / 15) * Math.PI / 2;
    ctx.rotate(angle - (player.facingRight ? swing : -swing));

    // Draw Pickaxe
    ctx.fillStyle = "#8D6E63"; // Wood handle
    ctx.fillRect(0, -2, 20, 4);
    ctx.fillStyle = "#CFD8DC"; // Iron head
    ctx.fillRect(15, -10, 6, 20);
    
    ctx.restore();
  }

  // Draw Particles
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  });
  ctx.globalAlpha = 1.0;

  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
