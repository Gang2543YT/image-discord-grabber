<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚔️ Terraria-Style Multiplayer WebSocket RPG</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #020617;
            font-family: 'Courier New', Courier, monospace;
            color: #f8fafc;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            z-index: 10;
        }
        .screen.active {
            display: flex;
        }
        h1 {
            font-size: 3.5rem;
            margin-bottom: 5px;
            color: #38bdf8;
            text-shadow: 4px 4px #000;
            letter-spacing: 2px;
        }
        p {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 25px;
        }
        input {
            background: #090d16;
            border: 3px solid #334155;
            color: #fff;
            padding: 12px 20px;
            font-size: 1.2rem;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            outline: none;
            border-radius: 4px;
            margin-bottom: 15px;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.6);
            width: 280px;
        }
        input:focus {
            border-color: #38bdf8;
        }
        .pixel-btn {
            background: #0284c7;
            border: 3px solid #7dd3fc;
            color: white;
            padding: 12px 32px;
            font-size: 1.2rem;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 0 #0369a1, 0 10px 10px rgba(0,0,0,0.5);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .pixel-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0369a1, 0 5px 5px rgba(0,0,0,0.5);
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            display: none;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            z-index: 5;
        }
        #hud.active {
            display: flex;
        }
        .hud-box {
            background: rgba(15, 23, 42, 0.85);
            border: 3px solid #334155;
            padding: 10px 18px;
            font-size: 1rem;
            font-weight: bold;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
            display: flex;
            gap: 15px;
        }
        /* HOTBAR / INVENTORY UI */
        #hotbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 8px;
            z-index: 5;
            pointer-events: auto;
        }
        #hotbar.active {
            display: flex;
        }
        .slot {
            width: 50px;
            height: 50px;
            background: rgba(15, 23, 42, 0.9);
            border: 3px solid #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            color: #94a3b8;
            position: relative;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        .slot.selected {
            border-color: #38bdf8;
            background: rgba(30, 41, 59, 0.95);
        }
        .slot .icon {
            font-size: 1.2rem;
        }
        .slot .count {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 0.7rem;
            color: #f8fafc;
            font-weight: bold;
        }
        .controls-overlay {
            position: absolute;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            border: 3px solid #334155;
            padding: 8px 16px;
            font-size: 0.85rem;
            color: #cbd5e1;
            text-align: center;
            pointer-events: none;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
            z-index: 5;
            display: none;
        }
        .controls-overlay.active {
            display: block;
        }
    </style>
</head>
<body>

    <!-- START MENU -->
    <div id="title-screen" class="screen active">
        <h1>TERRA-QUEST MMO</h1>
        <p>Mine blocks, collect materials, build, and explore with friends!</p>
        <input id="name-input" maxlength="15" placeholder="Hero Name..." /><br>
        <input id="room-input" maxlength="15" placeholder="Server Room (e.g. alpha)" value="main" /><br>
        <button class="pixel-btn" onclick="connectToServer()">JOIN WORLD</button>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div class="hud-box">
            <span>🛡️ <span id="hud-name">Hero</span></span>
            <span>ROOM: <span id="hud-room" style="color:#38bdf8;">main</span></span>
            <span>LVL: <span id="hud-lvl">1</span></span>
            <span>HP: <span id="hud-hp" style="color:#f87171;">100</span>/<span id="hud-max-hp">100</span></span>
            <span>GOLD: <span id="hud-gold" style="color:#fbbf24;">0</span></span>
        </div>
    </div>

    <div id="controls-hint" class="controls-overlay">
        Move: <b>A/D</b> | Jump: <b>W/Space</b> | <b>Left-Click</b>: Mine Block | <b>Right-Click</b>: Place Block | Select: <b>1, 2, 3</b>
    </div>

    <!-- HOTBAR INVENTORY -->
    <div id="hotbar">
        <div class="slot selected" id="slot-0" onclick="selectSlot(0)">
            <span class="icon">🟫</span>
            <span class="count" id="count-1">0</span>
        </div>
        <div class="slot" id="slot-1" onclick="selectSlot(1)">
            <span class="icon">⬜</span>
            <span class="count" id="count-2">0</span>
        </div>
        <div class="slot" id="slot-2" onclick="selectSlot(2)">
            <span class="icon">🟩</span>
            <span class="count" id="count-3">0</span>
        </div>
    </div>

    <!-- CANVAS -->
    <canvas id="game-canvas"></canvas>

    <script>
        const socket = io();
        const titleScreen = document.getElementById('title-screen');
        const hud = document.getElementById('hud');
        const hotbar = document.getElementById('hotbar');
        const controlsHint = document.getElementById('controls-hint');
        const nameInput = document.getElementById('name-input');
        const roomInput = document.getElementById('room-input');
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        ctx.imageSmoothingEnabled = false;

        let screenWidth = window.innerWidth;
        let screenHeight = window.innerHeight;
        canvas.width = screenWidth;
        canvas.height = screenHeight;

        window.addEventListener('resize', () => {
            screenWidth = window.innerWidth;
            screenHeight = window.innerHeight;
            canvas.width = screenWidth;
            canvas.height = screenHeight;
        });

        const TILE_SIZE = 32;
        const WORLD_WIDTH = 120; 
        const WORLD_HEIGHT = 45; 

        let worldMap = []; 
        let entities = []; 
        let particles = []; 
        let remotePlayers = {}; 
        let currentRoom = 'main';

        // Inventory System
        let inventory = {
            1: 0, // Dirt
            2: 0, // Stone
            3: 0  // Grass
        };
        let selectedSlotIndex = 0;
        const hotbarMapping = [1, 2, 3]; // Maps slot index to tile ID

        let hero = {
            name: 'Hero',
            x: 100,
            y: 100,
            width: 22,
            height: 30,
            vx: 0,
            vy: 0,
            speed: 3.5,
            jumpForce: -11,
            gravity: 0.5,
            grounded: false,
            facing: 'right',
            animTimer: 0,
            frame: 0,
            hp: 100,
            maxHp: 100,
            level: 1,
            exp: 0,
            maxExp: 50,
            gold: 0,
            atk: 15
        };

        function selectSlot(index) {
            selectedSlotIndex = index;
            document.querySelectorAll('.slot').forEach((s, i) => {
                if (i === index) s.classList.add('selected');
                else s.classList.remove('selected');
            });
        }

        function connectToServer() {
            let name = nameInput.value.trim();
            if (name) hero.name = name;
            let room = roomInput.value.trim().toLowerCase();
            if (room) currentRoom = room;

            document.getElementById('hud-name').textContent = hero.name;
            document.getElementById('hud-room').textContent = currentRoom;

            socket.emit('join_server', { name: hero.name, room: currentRoom });

            generateTerrain();
            titleScreen.classList.remove('active');
            hud.classList.add('active');
            hotbar.classList.add('active');
            controlsHint.classList.add('active');

            requestAnimationFrame(gameLoop);
        }

        socket.on('current_players', (players) => {
            remotePlayers = players;
            if (socket.id && remotePlayers[socket.id]) {
                delete remotePlayers[socket.id];
            }
        });

        socket.on('player_joined', (player) => {
            remotePlayers[player.id] = player;
        });

        socket.on('player_moved', (player) => {
            remotePlayers[player.id] = player;
        });

        socket.on('player_left', (data) => {
            delete remotePlayers[data.id];
        });

        socket.on('tile_updated', (data) => {
            if (data.room === currentRoom) {
                worldMap[data.y][data.x] = data.tile;
            }
        });

        function generateTerrain() {
            worldMap = [];
            for (let y = 0; y < WORLD_HEIGHT; y++) {
                let row = [];
                for (let x = 0; x < WORLD_WIDTH; x++) {
                    row.push(0);
                }
                worldMap.push(row);
            }

            let surfaceHeight = 18;
            for (let x = 0; x < WORLD_WIDTH; x++) {
                surfaceHeight += Math.floor(Math.sin(x * 0.15) * 1.5 + (Math.random() * 0.6 - 0.3));
                surfaceHeight = Math.max(12, Math.min(28, surfaceHeight));

                for (let y = surfaceHeight; y < WORLD_HEIGHT; y++) {
                    if (y === surfaceHeight) {
                        worldMap[y][x] = 3; 
                    } else if (y < surfaceHeight + 5) {
                        worldMap[y][x] = 1; 
                    } else {
                        worldMap[y][x] = 2; 
                    }
                }
            }

            hero.x = 4 * TILE_SIZE;
            for (let y = 0; y < WORLD_HEIGHT; y++) {
                if (worldMap[y][4] > 0) {
                    hero.y = (y - 2) * TILE_SIZE;
                    break;
                }
            }

            entities = [];
            for (let x = 10; x < WORLD_WIDTH - 5; x += Math.floor(Math.random() * 6) + 5) {
                for (let y = 5; y < WORLD_HEIGHT - 2; y++) {
                    if (worldMap[y][x] === 0 && worldMap[y + 1][x] > 0) {
                        entities.push({
                            type: 'slime',
                            x: x * TILE_SIZE,
                            y: y * TILE_SIZE,
                            width: 26,
                            height: 20,
                            vx: (Math.random() > 0.5 ? 1 : -1) * 1.2,
                            vy: 0,
                            hp: 35,
                            maxHp: 35,
                            color: Math.random() > 0.5 ? '#4ade80' : '#ec4899',
                            jumpTimer: 0
                        });
                        break;
                    }
                }
            }
        }

        const keys = {};
        window.addEventListener('keydown', e => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
            keys[e.key] = true;
            keys[e.key.toLowerCase()] = true;

            if (e.key === '1') selectSlot(0);
            if (e.key === '2') selectSlot(1);
            if (e.key === '3') selectSlot(2);
        });

        window.addEventListener('keyup', e => {
            keys[e.key] = false;
            keys[e.key.toLowerCase()] = false;
        });

        // Mouse Mining and Placement Interactions
        window.addEventListener('mousedown', e => {
            if (titleScreen.classList.contains('active')) return;

            let cameraX = hero.x - screenWidth / 2 + hero.width / 2;
            let cameraY = hero.y - screenHeight / 2 + hero.height / 2;
            cameraX = Math.max(0, Math.min(WORLD_WIDTH * TILE_SIZE - screenWidth, cameraX));
            cameraY = Math.max(0, Math.min(WORLD_HEIGHT * TILE_SIZE - screenHeight, cameraY));

            let worldMouseX = e.clientX + cameraX;
            let worldMouseY = e.clientY + cameraY;

            let tileX = Math.floor(worldMouseX / TILE_SIZE);
            let tileY = Math.floor(worldMouseY / TILE_SIZE);

            if (tileX < 0 || tileX >= WORLD_WIDTH || tileY < 0 || tileY >= WORLD_HEIGHT) return;

            // Check distance from player (reach limit)
            let dist = Math.hypot((hero.x + hero.width/2) - worldMouseX, (hero.y + hero.height/2) - worldMouseY);
            if (dist > 140) return; // Out of reach

            if (e.button === 0) {
                // Left Click: Mine Block
                let currentTile = worldMap[tileY][tileX];
                if (currentTile > 0) {
                    inventory[currentTile] = (inventory[currentTile] || 0) + 1;
                    worldMap[tileY][tileX] = 0;
                    socket.emit('update_tile', { room: currentRoom, x: tileX, y: tileY, tile: 0 });
                    particles.push({ x: tileX * TILE_SIZE, y: tileY * TILE_SIZE, text: '+1', life: 30, color: '#38bdf8' });
                }
            } else if (e.button === 2) {
                // Right Click: Place Block
                let activeTileType = hotbarMapping[selectedSlotIndex];
                if (worldMap[tileY][tileX] === 0 && inventory[activeTileType] > 0) {
                    // Make sure player isn't standing directly inside the placed tile
                    let pBox = { x: hero.x, y: hero.y, w: hero.width, h: hero.height };
                    let tBox = { x: tileX * TILE_SIZE, y: tileY * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE };
                    
                    let overlapping = !(pBox.x + pBox.w < tBox.x || pBox.x > tBox.x + tBox.w || pBox.y + pBox.h < tBox.y || pBox.y > tBox.y + tBox.h);
                    
                    if (!overlapping) {
                        inventory[activeTileType]--;
                        worldMap[tileY][tileX] = activeTileType;
                        socket.emit('update_tile', { room: currentRoom, x: tileX, y: tileY, tile: activeTileType });
                    }
                }
            }
        });

        window.addEventListener('contextmenu', e => e.preventDefault()); // Prevent context menu on right click

        function checkCollision(nx, ny, w, h) {
            let startX = Math.floor(nx / TILE_SIZE);
            let endX = Math.floor((nx + w - 1) / TILE_SIZE);
            let startY = Math.floor(ny / TILE_SIZE);
            let endY = Math.floor((ny + h - 1) / TILE_SIZE);

            if (startX < 0 || endX >= WORLD_WIDTH || startY < 0 || endY >= WORLD_HEIGHT) return true;

            for (let y = startY; y <= endY; y++) {
                for (let x = startX; x <= endX; x++) {
                    if (worldMap[y][x] > 0) return true;
                }
            }
            return false;
        }

        let netSyncCounter = 0;

        function updateGame() {
            hero.vx = 0;
            if (keys['a'] || keys['arrowleft']) {
                hero.vx = -hero.speed;
                hero.facing = 'left';
            }
            if (keys['d'] || keys['arrowright']) {
                hero.vx = hero.speed;
                hero.facing = 'right';
            }

            hero.x += hero.vx;
            if (checkCollision(hero.x, hero.y, hero.width, hero.height)) {
                hero.x -= hero.vx;
            }

            if ((keys['w'] || keys['arrowup'] || keys[' ']) && hero.grounded) {
                hero.vy = hero.jumpForce;
                hero.grounded = false;
            }

            hero.vy += hero.gravity;
            hero.y += hero.vy;
            hero.grounded = false;

            if (checkCollision(hero.x, hero.y, hero.width, hero.height)) {
                hero.y -= hero.vy;
                if (hero.vy > 0) hero.grounded = true;
                hero.vy = 0;
            }

            if (hero.vx !== 0 && hero.grounded) {
                hero.animTimer++;
                if (hero.animTimer > 8) {
                    hero.frame = (hero.frame + 1) % 4;
                    hero.animTimer = 0;
                }
            } else {
                hero.frame = 0;
            }

            netSyncCounter++;
            if (netSyncCounter > 2) {
                socket.emit('player_update', {
                    room: currentRoom,
                    x: hero.x,
                    y: hero.y,
                    facing: hero.facing,
                    frame: hero.frame
                });
                netSyncCounter = 0;
            }

            for (let i = entities.length - 1; i >= 0; i--) {
                let ent = entities[i];
                if (ent.type === 'slime') {
                    ent.jumpTimer++;
                    if (ent.jumpTimer > 80 && Math.abs(hero.x - ent.x) < 300) {
                        ent.vy = -7;
                        ent.vx = hero.x > ent.x ? 1.5 : -1.5;
                        ent.jumpTimer = 0;
                    }

                    ent.vy += 0.5;
                    ent.x += ent.vx;
                    if (checkCollision(ent.x, ent.y, ent.width, ent.height)) {
                        ent.x -= ent.vx;
                        ent.vx *= -1;
                    }
                    ent.y += ent.vy;
                    if (checkCollision(ent.x, ent.y, ent.width, ent.height)) {
                        ent.y -= ent.vy;
                        ent.vy = 0;
                    }

                    if (
                        hero.x < ent.x + ent.width &&
                        hero.x + hero.width > ent.x &&
                        hero.y < ent.y + ent.height &&
                        hero.y + hero.height > ent.y
                    ) {
                        ent.hp -= hero.atk;
                        particles.push({ x: ent.x, y: ent.y, text: `-${hero.atk}`, life: 30, color: '#f87171' });

                        if (ent.hp <= 0) {
                            let goldDrop = 15 + Math.floor(Math.random() * 20);
                            hero.gold += goldDrop;
                            particles.push({ x: ent.x, y: ent.y - 10, text: `+${goldDrop}G`, life: 45, color: '#fbbf24' });
                            entities.splice(i, 1);
                        } else {
                            hero.hp -= 8;
                            hero.vy = -5;
                            hero.vx = hero.facing === 'right' ? -4 : 4;
                            if (hero.hp <= 0) {
                                alert("You were defeated!");
                                location.reload();
                            }
                        }
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].y -= 0.6;
                particles[i].life--;
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            // Update UI elements
            document.getElementById('hud-lvl').textContent = hero.level;
            document.getElementById('hud-hp').textContent = Math.max(0, hero.hp);
            document.getElementById('hud-max-hp').textContent = hero.maxHp;
            document.getElementById('hud-gold').textContent = hero.gold;
            document.getElementById('count-1').textContent = inventory[1];
            document.getElementById('count-2').textContent = inventory[2];
            document.getElementById('count-3').textContent = inventory[3];
        }

        function drawGame() {
            let gradient = ctx.createLinearGradient(0, 0, 0, screenHeight);
            gradient.addColorStop(0, '#0284c7');
            gradient.addColorStop(0.5, '#38bdf8');
            gradient.addColorStop(1, '#bae6fd');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, screenWidth, screenHeight);

            let cameraX = hero.x - screenWidth / 2 + hero.width / 2;
            let cameraY = hero.y - screenHeight / 2 + hero.height / 2;

            cameraX = Math.max(0, Math.min(WORLD_WIDTH * TILE_SIZE - screenWidth, cameraX));
            cameraY = Math.max(0, Math.min(WORLD_HEIGHT * TILE_SIZE - screenHeight, cameraY));

            ctx.save();
            ctx.translate(-Math.floor(cameraX), -Math.floor(cameraY));

            let startCol = Math.floor(cameraX / TILE_SIZE);
            let endCol = startCol + Math.ceil(screenWidth / TILE_SIZE) + 1;
            let startRow = Math.floor(cameraY / TILE_SIZE);
            let endRow = startRow + Math.ceil(screenHeight / TILE_SIZE) + 1;

            for (let y = startRow; y <= endRow && y < WORLD_HEIGHT; y++) {
                for (let x = startCol; x <= endCol && x < WORLD_WIDTH; x++) {
                    let tile = worldMap[y][x];
                    if (tile > 0) {
                        let rx = x * TILE_SIZE;
                        let ry = y * TILE_SIZE;

                        if (tile === 3) {
                            ctx.fillStyle = '#22c55e';
                            ctx.fillRect(rx, ry, TILE_SIZE, TILE_SIZE);
                            ctx.fillStyle = '#16a34a';
                            ctx.fillRect(rx, ry + TILE_SIZE - 6, TILE_SIZE, 6);
                        } else if (tile === 1) {
                            ctx.fillStyle = '#b45309';
                            ctx.fillRect(rx, ry, TILE_SIZE, TILE_SIZE);
                            ctx.fillStyle = '#92400e';
                            ctx.fillRect(rx + 4, ry + 4, 8, 8);
                            ctx.fillRect(rx + 18, ry + 16, 8, 8);
                        } else if (tile === 2) {
                            ctx.fillStyle = '#64748b';
                            ctx.fillRect(rx, ry, TILE_SIZE, TILE_SIZE);
                            ctx.fillStyle = '#475569';
                            ctx.fillRect(rx + 6, ry + 6, 10, 10);
                        }
                    }
                }
            }

            entities.forEach(ent => {
                if (ent.type === 'slime') {
                    ctx.fillStyle = ent.color;
                    ctx.beginPath();
                    ctx.roundRect(ent.x, ent.y + 6, ent.width, ent.height - 6, [8, 8, 4, 4]);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    let eyeOffset = hero.x > ent.x ? 4 : 12;
                    ctx.fillRect(ent.x + eyeOffset, ent.y + 8, 5, 6);
                    ctx.fillStyle = '#000';
                    ctx.fillRect(ent.x + eyeOffset + (hero.x > ent.x ? 2 : 1), ent.y + 10, 2, 3);
                }
            });

            for (let id in remotePlayers) {
                let rp = remotePlayers[id];
                let rpx = Math.floor(rp.x);
                let rpy = Math.floor(rp.y);

                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(rpx - 10, rpy - 22, (rp.name.length * 8) + 8, 16);
                ctx.fillStyle = '#38bdf8';
                ctx.font = 'bold 11px "Courier New", monospace';
                ctx.fillText(rp.name, rpx - 6, rpy - 10);

                ctx.fillStyle = '#ec4899';
                ctx.fillRect(rpx + 4, rpy + 8, 14, 16);
                ctx.fillStyle = '#fbcfe8';
                ctx.fillRect(rpx + 3, rpy, 16, 10);
            }

            let hx = Math.floor(hero.x);
            let hy = Math.floor(hero.y);

            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(hx - 10, hy - 22, (hero.name.length * 8) + 8, 16);
            ctx.fillStyle = '#4ade80';
            ctx.font = 'bold 11px "Courier New", monospace';
            ctx.fillText(hero.name, hx - 6, hy - 10);

            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(hx + 4, hy + 8, 14, 16);

            ctx.fillStyle = '#fde047';
            ctx.fillRect(hx + 3, hy, 16, 10);
            ctx.fillStyle = '#94a3b8';
            let visorX = hero.facing === 'right' ? hx + 11 : hx + 4;
            ctx.fillRect(visorX, hy + 3, 5, 4);

            ctx.fillStyle = '#1e293b';
            if (hero.frame === 1) {
                ctx.fillRect(hx + 4, hy + 24, 5, 6);
                ctx.fillRect(hx + 13, hy + 22, 5, 8);
            } else if (hero.frame === 3) {
                ctx.fillRect(hx + 4, hy + 22, 5, 8);
                ctx.fillRect(hx + 13, hy + 24, 5, 6);
            } else {
                ctx.fillRect(hx + 5, hy + 24, 4, 6);
                ctx.fillRect(hx + 13, hy + 24, 4, 6);
            }

            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.font = 'bold 14px "Courier New", monospace';
                ctx.fillText(p.text, p.x, p.y);
            });

            ctx.restore();
        }

        function gameLoop() {
            updateGame();
            drawGame();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
