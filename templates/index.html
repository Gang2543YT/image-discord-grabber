<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Player Defense Arena</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    canvas {
      display: block;
    }
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      padding: 20px;
      box-sizing: border-box;
    }
    .hud-panel {
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #444;
      border-radius: 8px;
      padding: 10px 15px;
      display: inline-block;
      font-size: 18px;
      font-weight: bold;
    }
    #game-over {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
    }
    button {
      padding: 15px 30px;
      font-size: 20px;
      font-weight: bold;
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover { background: #c0392b; }
  </style>
</head>
<body>

  <div id="ui-layer">
    <div class="hud-panel" id="hp-box">HP: 100 / 100</div>
    <div class="hud-panel" id="wave-box" style="margin-left: 10px;">Wave: 1</div>
    
    <div id="game-over">
      <h1 style="color: #e74c3c; font-size: 50px; margin: 0;">YOU DIED</h1>
      <p id="final-score" style="font-size: 20px; margin: 10px 0;">Survived 0 Waves</p>
      <button onclick="location.reload()">Play Again</button>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// --- GAME SETTINGS & STATE ---
const WORLD_SIZE = 2500;
let keys = {};
let mouse = { x: 0, y: 0, down: false };

let player = {
  x: WORLD_SIZE / 2,
  y: WORLD_SIZE / 2,
  size: 30,
  speed: 4.5,
  hp: 100,
  maxHp: 100,
  damage: 25,
  cooldown: 0,
  maxCooldown: 15
};

let enemies = [];
let projectiles = [];
let floatingTexts = [];
let wave = 1;
let enemiesToSpawn = 0;
let spawnTimer = 0;
let waveActive = false;
let gameOver = false;

// --- INPUT HANDLERS ---
window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

window.addEventListener("mousemove", e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});
window.addEventListener("mousedown", () => mouse.down = true);
window.addEventListener("mouseup", () => mouse.down = false);

function addFloatingText(x, y, text, color) {
  floatingTexts.push({ x, y, text, color, life: 30 });
}

function startNextWave() {
  waveActive = true;
  enemiesToSpawn = 5 + (wave * 4);
  spawnTimer = 0;
}

// --- UPDATE LOOP ---
function update() {
  if (gameOver) return;

  // 1. Move Player (WASD)
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup']) dy -= 1;
  if (keys['s'] || keys['arrowdown']) dy += 1;
  if (keys['a'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;

  if (dx !== 0 && dy !== 0) {
    dx *= 0.7071;
    dy *= 0.7071;
  }
  player.x += dx * player.speed;
  player.y += dy * player.speed;

  // Clamp player to world bounds
  player.x = Math.max(player.size, Math.min(WORLD_SIZE - player.size, player.x));
  player.y = Math.max(player.size, Math.min(WORLD_SIZE - player.size, player.y));

  // 2. Player Auto-Shooting towards mouse cursor
  if (player.cooldown > 0) player.cooldown--;
  else if (mouse.down) {
    player.cooldown = player.maxCooldown;
    // Calculate world position of mouse
    let camX = player.x - canvas.width / 2;
    let camY = player.y - canvas.height / 2;
    let targetWorldX = mouse.x + camX;
    let targetWorldY = mouse.y + camY;
    
    let angle = Math.atan2(targetWorldY - player.y, targetWorldX - player.x);
    projectiles.push({
      x: player.x,
      y: player.y,
      vx: Math.cos(angle) * 8,
      vy: Math.sin(angle) * 8,
      damage: player.damage,
      life: 100
    });
  }

  // 3. Wave & Enemy Spawning
  if (!waveActive) {
    wave++;
    startNextWave();
  } else if (enemiesToSpawn > 0) {
    spawnTimer--;
    if (spawnTimer <= 0) {
      // Spawn enemies outside the screen border tracking the player
      let angle = Math.random() * Math.PI * 2;
      let dist = Math.max(canvas.width, canvas.height) / 2 + 100;
      let ex = player.x + Math.cos(angle) * dist;
      let ey = player.y + Math.sin(angle) * dist;

      let baseHp = 40 + (wave * 10);
      enemies.push({
        x: ex,
        y: ey,
        hp: baseHp,
        maxHp: baseHp,
        speed: 2 + (wave * 0.05),
        size: 20,
        damage: 15
      });
      enemiesToSpawn--;
      spawnTimer = 30 - Math.min(15, wave);
    }
  } else if (enemies.length === 0) {
    waveActive = false; // Wave cleared, loop triggers next
  }

  // 4. Update Enemies (Directly tracking player)
  for (let i = enemies.length - 1; i >= 0; i--) {
    let e = enemies[i];
    let angle = Math.atan2(player.y - e.y, player.x - e.x);
    e.x += Math.cos(angle) * e.speed;
    e.y += Math.sin(angle) * e.speed;

    // Melee hit player check
    let distToPlayer = Math.hypot(player.x - e.x, player.y - e.y);
    if (distToPlayer < player.size / 2 + e.size / 2) {
      player.hp -= e.damage / 30; // continuous damage over time on contact
      if (player.hp <= 0) {
        player.hp = 0;
        gameOver = true;
        document.getElementById("final-score").innerText = `Survived ${wave - 1} Waves`;
        document.getElementById("game-over").style.display = "flex";
      }
    }
  }

  // 5. Update Projectiles
  for (let i = projectiles.length - 1; i >= 0; i--) {
    let p = projectiles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;

    // Check hit against enemies
    let hit = false;
    for (let j = enemies.length - 1; j >= 0; j--) {
      let e = enemies[j];
      let dist = Math.hypot(p.x - e.x, p.y - e.y);
      if (dist < e.size + 4) {
        e.hp -= p.damage;
        addFloatingText(e.x, e.y, `-${p.damage}`, "#f1c40f");
        hit = true;
        
        if (e.hp <= 0) {
          enemies.splice(j, 1);
        }
        break;
      }
    }

    if (hit || p.life <= 0) {
      projectiles.splice(i, 1);
    }
  }

  // 6. Update Floating Text
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    floatingTexts[i].life--;
    floatingTexts[i].y -= 0.6;
    if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
  }

  // Update HUD text
  document.getElementById("hp-box").innerText = `HP: ${Math.ceil(player.hp)} / ${player.maxHp}`;
  document.getElementById("wave-box").innerText = `Wave: ${wave}`;
}

// --- RENDER LOOP ---
function draw() {
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  // Camera translation to follow player
  let camX = player.x - canvas.width / 2;
  let camY = player.y - canvas.height / 2;
  ctx.translate(-camX, -camY);

  // Draw World Bounds Grid
  ctx.strokeStyle = "#333";
  ctx.lineWidth = 2;
  for (let i = 0; i <= WORLD_SIZE; i += 200) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, WORLD_SIZE); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(WORLD_SIZE, i); ctx.stroke();
  }
  ctx.strokeStyle = "#e74c3c";
  ctx.lineWidth = 6;
  ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);

  // Draw Enemies
  enemies.forEach(e => {
    ctx.fillStyle = "#c0392b";
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#962d22";
    ctx.lineWidth = 3;
    ctx.stroke();

    // Enemy Health Bar
    ctx.fillStyle = "#222";
    ctx.fillRect(e.x - 15, e.y - e.size - 12, 30, 4);
    ctx.fillStyle = "#2ecc71";
    ctx.fillRect(e.x - 15, e.y - e.size - 12, 30 * (e.hp / e.maxHp), 4);
  });

  // Draw Projectiles
  projectiles.forEach(p => {
    ctx.fillStyle = "#f39c12";
    ctx.beginPath();
    ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
    ctx.fill();
  });

  // Draw Player
  ctx.fillStyle = "#3498db";
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#2980b9";
  ctx.lineWidth = 4;
  ctx.stroke();

  // Draw Floating Text
  floatingTexts.forEach(ft => {
    ctx.fillStyle = ft.color;
    ctx.globalAlpha = ft.life / 30;
    ctx.font = "bold 15px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.globalAlpha = 1.0;
  });

  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
