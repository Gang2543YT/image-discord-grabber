<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Web Engine & Crafting Guide</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #111;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 800px;
      height: 500px;
      border: 4px solid #333;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      background-color: #70b3ff;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* HUD Elements */
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-weight: bold;
      text-shadow: 2px 2px #000;
    }

    .status-bar {
      display: flex;
      gap: 15px;
      font-size: 16px;
    }

    .heart { color: #ff3333; }
    .score { color: #ffcc00; }

    /* UI Controls & Recipe Book Button */
    #ui-buttons {
      position: absolute;
      bottom: 10px;
      right: 10px;
      display: flex;
      gap: 10px;
    }

    .btn {
      background: #4a4a4a;
      border: 2px solid #8b8b8b;
      color: #fff;
      padding: 8px 14px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      box-shadow: inset -2px -2px 0px #222, inset 2px 2px 0px #aaa;
    }
    .btn:hover { background: #5a5a5a; }
    .btn:active { box-shadow: inset 2px 2px 0px #222; }

    /* Recipe & Crafting Modal */
    #crafting-modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 400px;
      background: #c6c6c6;
      border: 4px solid #373737;
      color: #000;
      box-shadow: inset -3px -3px 0 #555, inset 3px 3px 0 #fff, 0 0 20px rgba(0,0,0,0.8);
      padding: 16px;
      flex-direction: column;
      z-index: 10;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #555;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .modal-title { font-size: 18px; font-weight: bold; }

    .recipe-container {
      display: flex;
      flex: 1;
      gap: 12px;
      overflow: hidden;
    }

    .recipe-list {
      width: 50%;
      background: #8b8b8b;
      border: 2px solid #373737;
      overflow-y: auto;
      padding: 6px;
    }

    .recipe-item {
      background: #8b8b8b;
      padding: 6px 10px;
      margin-bottom: 4px;
      border: 2px solid #555;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    .recipe-item:hover { background: #9b9b9b; }
    .recipe-item.selected { background: #3b5998; color: white; border-color: #fff; }

    .recipe-detail {
      width: 50%;
      background: #a0a0a0;
      border: 2px solid #373737;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .ingredients-list { margin-top: 10px; font-size: 14px; }
    .ingredient { margin-bottom: 4px; }
    .ingredient.has { color: #006600; }
    .ingredient.missing { color: #990000; }

    /* Death Scene Screen Overlay */
    #death-screen {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(180, 0, 0, 0.65);
      backdrop-filter: blur(2px);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      animation: fadeIn 0.8s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    #death-screen h1 {
      font-size: 56px;
      color: #ff3333;
      text-shadow: 4px 4px 0px #000;
      margin-bottom: 10px;
    }

    #death-screen p {
      font-size: 18px;
      text-shadow: 2px 2px 0px #000;
      margin-bottom: 25px;
    }

    .respawn-btn {
      font-size: 20px;
      padding: 12px 24px;
      background: #4a4a4a;
      color: #fff;
      border: 3px solid #fff;
      cursor: pointer;
      box-shadow: 0 4px 0 #222;
    }
    .respawn-btn:hover { background: #666; }

    /* Hotbar */
    #hotbar {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      background: rgba(0,0,0,0.6);
      border: 2px solid #555;
      padding: 4px;
      gap: 4px;
    }

    .slot {
      width: 36px;
      height: 36px;
      background: #8b8b8b;
      border: 2px solid #373737;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      position: relative;
    }
    .slot-count {
      position: absolute;
      bottom: 1px;
      right: 2px;
      font-size: 10px;
      color: #fff;
      text-shadow: 1px 1px #000;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <!-- HUD -->
    <div id="hud">
      <div class="status-bar">
        <div>Health: <span id="hp-display" class="heart">❤❤❤❤❤❤❤❤❤❤</span></div>
        <div>Score: <span id="score-display" class="score">0</span></div>
      </div>
      <div>Press <b style="color:#ffcc00">[E]</b> for Recipe Book</div>
    </div>

    <!-- Hotbar -->
    <div id="hotbar"></div>

    <!-- UI Buttons -->
    <div id="ui-buttons">
      <button class="btn" id="open-craft-btn">Recipe Book (E)</button>
    </div>

    <!-- Crafting Modal / Recipe Guide -->
    <div id="crafting-modal">
      <div class="modal-header">
        <span class="modal-title">Crafting Guide & Recipes</span>
        <button class="btn" id="close-craft-btn" style="padding:2px 8px;">X</button>
      </div>
      <div class="recipe-container">
        <div class="recipe-list" id="recipe-list-ui"></div>
        <div class="recipe-detail" id="recipe-detail-ui">
          <div>
            <h3 id="recipe-name">Select a Recipe</h3>
            <p id="recipe-desc" style="font-size: 12px; margin: 6px 0; color: #333;"></p>
            <div class="ingredients-list" id="ingredients-ui"></div>
          </div>
          <button class="btn" id="craft-action-btn" style="width: 100%;" disabled>Craft Item</button>
        </div>
      </div>
    </div>

    <!-- Death Screen -->
    <div id="death-screen">
      <h1>You Died!</h1>
      <p id="death-cause">Slain by Zombie</p>
      <p>Score: <span id="final-score">0</span></p>
      <button class="respawn-btn" id="respawn-btn">Respawn</button>
    </div>
  </div>

<script>
// ==========================================
// 1. MINECRAFT DATA REGISTRIES (Mobs & Recipes)
// ==========================================

const MOBS_DATABASE = {
  cow: { name: "Cow", hp: 10, hostile: false, color: "#5c4033", size: 28, speed: 0.8, drop: { item: "Raw Beef", count: 2 } },
  pig: { name: "Pig", hp: 10, hostile: false, color: "#f8a4a4", size: 24, speed: 1.0, drop: { item: "Raw Porkchop", count: 2 } },
  zombie: { name: "Zombie", hp: 20, hostile: true, damage: 2, color: "#2d6a4f", size: 28, speed: 1.2, drop: { item: "Rotten Flesh", count: 1 } },
  skeleton: { name: "Skeleton", hp: 20, hostile: true, damage: 3, color: "#d3d3d3", size: 26, speed: 1.1, drop: { item: "Bone", count: 2 } },
  creeper: { name: "Creeper", hp: 20, hostile: true, damage: 8, color: "#38b000", size: 26, speed: 1.4, drop: { item: "Gunpowder", count: 1 } }
};

const RECIPES_DATABASE = [
  {
    id: "planks",
    name: "Oak Planks",
    output: { item: "Oak Planks", count: 4 },
    inputs: [{ item: "Oak Log", count: 1 }],
    desc: "Basic building material processed from logs."
  },
  {
    id: "stick",
    name: "Sticks",
    output: { item: "Stick", count: 4 },
    inputs: [{ item: "Oak Planks", count: 2 }],
    desc: "Used to craft tools, torches, and weapons."
  },
  {
    id: "crafting_table",
    name: "Crafting Table",
    output: { item: "Crafting Table", count: 1 },
    inputs: [{ item: "Oak Planks", count: 4 }],
    desc: "Allows crafting complex 3x3 items."
  },
  {
    id: "wooden_sword",
    name: "Wooden Sword",
    output: { item: "Wooden Sword", count: 1 },
    inputs: [{ item: "Oak Planks", count: 2 }, { item: "Stick", count: 1 }],
    desc: "Deals basic melee attack damage (+4 Damage)."
  },
  {
    id: "stone_sword",
    name: "Stone Sword",
    output: { item: "Stone Sword", count: 1 },
    inputs: [{ item: "Cobblestone", count: 2 }, { item: "Stick", count: 1 }],
    desc: "Durable early game weapon (+5 Damage)."
  },
  {
    id: "iron_sword",
    name: "Iron Sword",
    output: { item: "Iron Sword", count: 1 },
    inputs: [{ item: "Iron Ingot", count: 2 }, { item: "Stick", count: 1 }],
    desc: "High damage combat sword (+6 Damage)."
  },
  {
    id: "torch",
    name: "Torch",
    output: { item: "Torch", count: 4 },
    inputs: [{ item: "Coal", count: 1 }, { item: "Stick", count: 1 }],
    desc: "Provides light and repels darkness."
  },
  {
    id: "furnace",
    name: "Furnace",
    output: { item: "Furnace", count: 1 },
    inputs: [{ item: "Cobblestone", count: 8 }],
    desc: "Used for smelting ores and cooking food."
  }
];

// ==========================================
// 2. GAME STATE & VARIABLES
// ==========================================

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let player = {
  x: 400,
  y: 250,
  size: 24,
  hp: 20,
  maxHp: 20,
  speed: 3,
  score: 0,
  inventory: {
    "Oak Log": 5,
    "Cobblestone": 8,
    "Coal": 2,
    "Iron Ingot": 2
  }
};

let activeMobs = [];
let keys = {};
let selectedRecipe = null;
let gameActive = true;
let lastDamageTime = 0;

// ==========================================
// 3. ENGINE & CANVAS GRAPHICS
// ==========================================

function spawnMob(typeKey) {
  const template = MOBS_DATABASE[typeKey];
  const side = Math.floor(Math.random() * 4);
  let x, y;
  if (side === 0) { x = Math.random() * canvas.width; y = -30; }
  else if (side === 1) { x = canvas.width + 30; y = Math.random() * canvas.height; }
  else if (side === 2) { x = Math.random() * canvas.width; y = canvas.height + 30; }
  else { x = -30; y = Math.random() * canvas.height; }

  activeMobs.push({
    ...template,
    typeKey: typeKey,
    x: x,
    y: y,
    currentHp: template.hp
  });
}

// Initial Mob Population
for (let i = 0; i < 3; i++) spawnMob("cow");
for (let i = 0; i < 2; i++) spawnMob("zombie");
for (let i = 0; i < 1; i++) spawnMob("creeper");

function updateGame() {
  if (!gameActive) return;

  // Player Movement
  if (keys['w'] || keys['W'] || keys['ArrowUp']) player.y = Math.max(player.size, player.y - player.speed);
  if (keys['s'] || keys['S'] || keys['ArrowDown']) player.y = Math.min(canvas.height - player.size, player.y + player.speed);
  if (keys['a'] || keys['A'] || keys['ArrowLeft']) player.x = Math.max(player.size, player.x - player.speed);
  if (keys['d'] || keys['D'] || keys['ArrowRight']) player.x = Math.min(canvas.width - player.size, player.x + player.speed);

  // Update Mobs
  activeMobs.forEach((mob, index) => {
    const dx = player.x - mob.x;
    const dy = player.y - mob.y;
    const dist = Math.hypot(dx, dy);

    if (mob.hostile && dist > 0) {
      mob.x += (dx / dist) * mob.speed;
      mob.y += (dy / dist) * mob.speed;

      // Combat Collision
      if (dist < (player.size + mob.size) / 2) {
        const now = Date.now();
        if (now - lastDamageTime > 800) { // Invulnerability window
          takeDamage(mob.damage, `Slain by ${mob.name}`);
          lastDamageTime = now;
        }
      }
    }
  });

  // Periodically spawn mobs
  if (Math.random() < 0.005 && activeMobs.length < 8) {
    const types = ["cow", "pig", "zombie", "skeleton", "creeper"];
    spawnMob(types[Math.floor(Math.random() * types.length)]);
  }
}

function renderGame() {
  // Background
  ctx.fillStyle = "#70b3ff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Decorative Grass Tiles
  ctx.fillStyle = "#55a630";
  ctx.fillRect(0, 100, canvas.width, canvas.height - 100);

  // Render Mobs
  activeMobs.forEach(mob => {
    ctx.fillStyle = mob.color;
    ctx.fillRect(mob.x - mob.size/2, mob.y - mob.size/2, mob.size, mob.size);

    // Eyes
    ctx.fillStyle = "#000";
    ctx.fillRect(mob.x - 6, mob.y - 6, 4, 4);
    ctx.fillRect(mob.x + 2, mob.y - 6, 4, 4);

    // Name Label
    ctx.fillStyle = "#fff";
    ctx.font = "10px Courier New";
    ctx.textAlign = "center";
    ctx.fillText(mob.name, mob.x, mob.y - mob.size/2 - 4);
  });

  // Render Player
  ctx.fillStyle = "#00b4d8"; // Cyan Steve shirt
  ctx.fillRect(player.x - player.size/2, player.y - player.size/2, player.size, player.size);
  ctx.fillStyle = "#ffb5a7"; // Head/Face
  ctx.fillRect(player.x - 8, player.y - 8, 16, 10);

  // Render Crosshair / Target Indicator
  ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
  ctx.lineWidth = 2;
  ctx.strokeRect(player.x - player.size/2 - 4, player.y - player.size/2 - 4, player.size + 8, player.size + 8);
}

function gameLoop() {
  updateGame();
  renderGame();
  requestAnimationFrame(gameLoop);
}

// Attack Mobs on Click
canvas.addEventListener("click", (e) => {
  if (!gameActive) return;
  const rect = canvas.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  const clickY = e.clientY - rect.top;

  activeMobs.forEach((mob, index) => {
    const dist = Math.hypot(clickX - mob.x, clickY - mob.y);
    if (dist < mob.size) {
      mob.currentHp -= 10; // Player attack power
      if (mob.currentHp <= 0) {
        // Collect drop
        const drop = mob.drop;
        player.inventory[drop.item] = (player.inventory[drop.item] || 0) + drop.count;
        player.score += mob.hostile ? 50 : 10;
        activeMobs.splice(index, 1);
        updateHUD();
        renderHotbar();
      }
    }
  });
});

// ==========================================
// 4. PLAYER HEALTH & DEATH SCENE SYSTEM
// ==========================================

function takeDamage(amount, cause) {
  player.hp -= amount;
  if (player.hp < 0) player.hp = 0;
  updateHUD();

  if (player.hp === 0) {
    triggerDeathScreen(cause);
  }
}

function triggerDeathScreen(cause) {
  gameActive = false;
  document.getElementById("death-cause").innerText = cause;
  document.getElementById("final-score").innerText = player.score;
  document.getElementById("death-screen").style.display = "flex";
}

function respawn() {
  player.hp = player.maxHp;
  player.x = canvas.width / 2;
  player.y = canvas.height / 2;
  player.score = Math.max(0, player.score - 50);
  activeMobs = [];
  
  // Re-populate basic mobs
  for (let i = 0; i < 3; i++) spawnMob("cow");
  for (let i = 0; i < 2; i++) spawnMob("zombie");

  document.getElementById("death-screen").style.display = "none";
  updateHUD();
  gameActive = true;
}

document.getElementById("respawn-btn").addEventListener("click", respawn);

// ==========================================
// 5. RECIPE BOOK & CRAFTING ENGINE
// ==========================================

const craftModal = document.getElementById("crafting-modal");
const recipeListUI = document.getElementById("recipe-list-ui");
const ingredientsUI = document.getElementById("ingredients-ui");
const craftBtn = document.getElementById("craft-action-btn");

function toggleCraftingModal() {
  const isVisible = craftModal.style.display === "flex";
  craftModal.style.display = isVisible ? "none" : "flex";
  if (!isVisible) {
    populateRecipeList();
  }
}

function populateRecipeList() {
  recipeListUI.innerHTML = "";
  RECIPES_DATABASE.forEach(recipe => {
    const item = document.createElement("div");
    item.className = `recipe-item ${selectedRecipe === recipe ? 'selected' : ''}`;
    item.innerHTML = `<span>${recipe.name}</span><b>x${recipe.output.count}</b>`;
    item.onclick = () => selectRecipe(recipe);
    recipeListUI.appendChild(item);
  });
}

function selectRecipe(recipe) {
  selectedRecipe = recipe;
  populateRecipeList();

  document.getElementById("recipe-name").innerText = recipe.name;
  document.getElementById("recipe-desc").innerText = recipe.desc;

  ingredientsUI.innerHTML = "<b>Required Ingredients:</b>";
  let canCraft = true;

  recipe.inputs.forEach(input => {
    const playerHas = player.inventory[input.item] || 0;
    const satisfies = playerHas >= input.count;
    if (!satisfies) canCraft = false;

    const div = document.createElement("div");
    div.className = `ingredient ${satisfies ? 'has' : 'missing'}`;
    div.innerText = `• ${input.item}: ${playerHas} / ${input.count}`;
    ingredientsUI.appendChild(div);
  });

  craftBtn.disabled = !canCraft;
}

craftBtn.addEventListener("click", () => {
  if (!selectedRecipe) return;

  // Deduct ingredients
  selectedRecipe.inputs.forEach(input => {
    player.inventory[input.item] -= input.count;
  });

  // Add craft result
  const out = selectedRecipe.output;
  player.inventory[out.item] = (player.inventory[out.item] || 0) + out.count;

  selectRecipe(selectedRecipe);
  renderHotbar();
  updateHUD();
});

document.getElementById("open-craft-btn").onclick = toggleCraftingModal;
document.getElementById("close-craft-btn").onclick = toggleCraftingModal;

// ==========================================
// 6. UI UPDATES & INITIALIZATION
// ==========================================

function updateHUD() {
  // Update Health Hearts
  const heartsCount = Math.ceil(player.hp / 2);
  document.getElementById("hp-display").innerText = "❤".repeat(heartsCount);
  document.getElementById("score-display").innerText = player.score;
}

function renderHotbar() {
  const hotbar = document.getElementById("hotbar");
  hotbar.innerHTML = "";
  
  Object.keys(player.inventory).forEach(itemName => {
    const count = player.inventory[itemName];
    if (count > 0) {
      const slot = document.createElement("div");
      slot.className = "slot";
      slot.title = itemName;
      slot.innerText = itemName.substring(0, 3);
      
      const countEl = document.createElement("span");
      countEl.className = "slot-count";
      countEl.innerText = count;
      slot.appendChild(countEl);
      
      hotbar.appendChild(slot);
    }
  });
}

// Input Handlers
window.addEventListener("keydown", e => {
  keys[e.key] = true;
  if (e.key === "e" || e.key === "E") toggleCraftingModal();
});
window.addEventListener("keyup", e => keys[e.key] = false);

// Launch Engine
updateHUD();
renderHotbar();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
