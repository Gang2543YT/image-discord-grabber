<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚔️ Terraria-Style Multiplayer WebSocket RPG</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
            background: #020617; font-family: 'Courier New', Courier, monospace; color: #f8fafc;
        }
        canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; width: 100vw; height: 100vh; cursor: crosshair; }
        .screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e1b4b); z-index: 10;
        }
        .screen.active { display: flex; }
        h1 { font-size: 3.5rem; margin-bottom: 5px; color: #38bdf8; text-shadow: 4px 4px #000; letter-spacing: 2px; }
        p { color: #94a3b8; font-size: 1.1rem; margin-bottom: 25px; }
        input {
            background: #090d16; border: 3px solid #334155; color: #fff; padding: 12px 20px;
            font-size: 1.2rem; font-family: 'Courier New', Courier, monospace; text-align: center;
            outline: none; border-radius: 4px; margin-bottom: 15px; box-shadow: inset 0 4px 6px rgba(0,0,0,0.6); width: 280px;
        }
        input:focus { border-color: #38bdf8; }
        .pixel-btn {
            background: #0284c7; border: 3px solid #7dd3fc; color: white; padding: 12px 32px;
            font-size: 1.2rem; font-family: 'Courier New', Courier, monospace; font-weight: bold; cursor: pointer;
            box-shadow: 0 6px 0 #0369a1, 0 10px 10px rgba(0,0,0,0.5); transition: transform 0.1s, box-shadow 0.1s;
        }
        .pixel-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #0369a1, 0 5px 5px rgba(0,0,0,0.5); }
        
        #hud { position: absolute; top: 20px; left: 20px; display: none; flex-direction: column; gap: 10px; pointer-events: none; z-index: 5; }
        #hud.active { display: flex; }
        .hud-box {
            background: rgba(15, 23, 42, 0.85); border: 3px solid #334155; padding: 10px 18px;
            font-size: 1rem; font-weight: bold; box-shadow: 4px 4px 0px rgba(0,0,0,0.5); display: flex; gap: 15px;
        }
        
        #hotbar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: none; gap: 8px; z-index: 5; pointer-events: auto; }
        #hotbar.active { display: flex; }
        .slot {
            width: 50px; height: 50px; background: rgba(15, 23, 42, 0.9); border: 3px solid #334155;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 0.75rem; color: #94a3b8; position: relative; box-shadow: 3px 3px 0px rgba(0,0,0,0.5); cursor: pointer;
        }
        .slot.selected { border-color: #38bdf8; background: rgba(30, 41, 59, 0.95); }
        .slot .icon { font-size: 1.2rem; }
        .slot .count { position: absolute; bottom: 2px; right: 4px; font-size: 0.7rem; color: #f8fafc; font-weight: bold; }

        /* Inventory & Crafting UI Overlay */
        #inventory-ui {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 480px; background: rgba(15, 23, 42, 0.95); border: 4px solid #334155;
            padding: 20px; display: none; flex-direction: column; gap: 15px; z-index: 20; box-shadow: 8px 8px 0px rgba(0,0,0,0.7);
        }
        #inventory-ui.active { display: flex; }
        .inv-section-title { font-size: 1.1rem; color: #38bdf8; border-bottom: 2px solid #334155; padding-bottom: 5px; }
        .inv-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .crafting-container { display: flex; gap: 20px; align-items: center; }
        .recipe-btn {
            background: #1e293b; border: 2px solid #475569; color: #f8fafc; padding: 8px 12px;
            font-family: 'Courier New', Courier, monospace; font-size: 0.85rem; cursor: pointer; text-align: left;
        }
        .recipe-btn:hover { background: #334155; border-color: #38bdf8; }

        .controls-overlay {
            position: absolute; bottom: 85px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9); border: 3px solid #334155; padding: 8px 16px;
            font-size: 0.85rem; color: #cbd5e1; text-align: center; pointer-events: none; box-shadow: 4px 4px 0px rgba(0,0,0,0.5); z-index: 5; display: none;
        }
        .controls-overlay.active { display: block; }
    </style>
</head>
<body>

    <div id="title-screen" class="screen active">
        <h1>TERRA-QUEST MMO</h1>
        <p>Explore, Mine Ores, Craft Tools & Build!</p>
        <input id="name-input" maxlength="15" placeholder="Hero Name..." /><br>
        <input id="room-input" maxlength="15" placeholder="Server Room (e.g. alpha)" value="main" /><br>
        <button class="pixel-btn" onclick="connectToServer()">JOIN WORLD</button>
    </div>

    <div id="hud">
        <div class="hud-box">
            <span>🛡️ <span id="hud-name">Hero</span></span>
            <span>ROOM: <span id="hud-room" style="color:#38bdf8;">main</span></span>
            <span>TOOL: <span id="hud-tool" style="color:#fbbf24;">Fists</span></span>
        </div>
    </div>

    <!-- Inventory Screen -->
    <div id="inventory-ui">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span class="inv-section-title" style="border:none; font-size: 1.4rem;">🎒 INVENTORY & CRAFTING</span>
            <span style="cursor:pointer; color:#ef4444; font-weight:bold;" onclick="toggleInventory()">[X]</span>
        </div>
        <div>
            <div class="inv-section-title">Item Storage (Blank until collected)</div>
            <div id="inventory-slots" class="inv-grid" style="margin-top: 10px;">
                <!-- Dynamically filled slots -->
            </div>
        </div>
        <div>
            <div class="inv-section-title">Crafting Bench</div>
            <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px;">
                <button class="recipe-btn" onclick="craftItem('wooden_pickaxe')">🛠️ Craft Wooden Pickaxe (Req: 5 Wood)</button>
                <button class="recipe-btn" onclick="craftItem('stone_pickaxe')">⛏️ Craft Stone Pickaxe (Req: 5 Stone)</button>
                <button class="recipe-btn" onclick="craftItem('iron_pickaxe')">⚙️ Craft Iron Pickaxe (Req: 5 Iron)</button>
            </div>
        </div>
    </div>

    <div id="controls-hint" class="controls-overlay">
        Move: <b>A/D</b> | Jump: <b>W/Space</b> | Inventory: <b>E</b> | <b>Left-Click</b>: Mine/Attack | <b>Right-Click</b>: Place
    </div>

    <div id="hotbar">
        <div class="slot selected" id="slot-0" onclick="selectSlot(0)"><span class="icon">🟫</span><span class="count" id="count-1">0</span></div>
        <div class="slot" id="slot-1" onclick="selectSlot(1)"><span class="icon">⬜</span><span class="count" id="count-2">0</span></div>
        <div class="slot" id="slot-2" onclick="selectSlot(2)"><span class="icon">🟩</span><span class="count" id="count-3">0</span></div>
    </div>

    <canvas id="game-canvas"></canvas>

    <script>
        const socket = io();
        const titleScreen = document.getElementById('title-screen');
        const hud = document.getElementById('hud');
        const hotbar = document.getElementById('hotbar');
        const controlsHint = document.getElementById('controls-hint');
        const inventoryUi = document.getElementById('inventory-ui');
        const nameInput = document.getElementById('name-input');
        const roomInput = document.getElementById('room-input');
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        ctx.imageSmoothingEnabled = false;

        let screenWidth = window.innerWidth;
        let screenHeight = window.innerHeight;
        canvas.width = screenWidth;
        canvas.height = screenHeight;

        window.addEventListener('resize', () => {
            screenWidth = window.innerWidth;
            screenHeight = window.innerHeight;
            canvas.width = screenWidth;
            canvas.height = screenHeight;
        });

        const TILE_SIZE = 32;
        const WORLD_WIDTH = 140; 
        const WORLD_HEIGHT = 50; 

        let worldMap = []; 
        let droppedItems = []; 
        let remotePlayers = {}; 
        let currentRoom = 'main';
        let gameStarted = false;
        let inventoryOpen = false;

        // Inventory mapping: Tile/Item IDs
        // 1: Dirt, 2: Stone, 3: Grass, 4: Wood, 5: Leaves, 6: Coal, 7: Iron, 8: Gold, 9: Diamond
        let inventory = {}; 
        let selectedSlotIndex = 0;
        const hotbarMapping = [1, 2, 4]; // Dirt, Stone, Wood in hotbar by default

        let hero = {
            name: 'Hero',
            x: 100,
            y: 100,
            width: 22,
            height: 30,
            vx: 0,
            vy: 0,
            speed: 3.5,
            jumpForce: -11,
            gravity: 0.5,
            grounded: false,
            facing: 'right',
            animTimer: 0,
            frame: 0,
            tool: 'Fists',
            toolTier: 1
        };

        const tileNames = {
            1: 'Dirt Block',
            2: 'Stone Block',
            3: 'Grass Block',
            4: 'Wood Block',
            5: 'Leaves',
            6: 'Coal Ore',
            7: 'Iron Ore',
            8: 'Gold Ore',
            9: 'Diamond Ore'
        };

        function selectSlot(index) {
            selectedSlotIndex = index;
            document.querySelectorAll('.slot').forEach((s, i) => {
                if (i === index) s.classList.add('selected');
                else s.classList.remove('selected');
            });
        }

        function toggleInventory() {
            inventoryOpen = !inventoryOpen;
            if (inventoryOpen) {
                inventoryUi.classList.add('active');
                renderInventoryUI();
            } else {
                inventoryUi.classList.remove('active');
            }
        }

        function renderInventoryUI() {
            const slotsContainer = document.getElementById('inventory-slots');
            slotsContainer.innerHTML = '';
            
            // Render only items that have quantity > 0 (Blank until collected)
            for (let id in inventory) {
                if (inventory[id] > 0) {
                    let slotDiv = document.createElement('div');
                    slotDiv.className = 'slot';
                    slotDiv.style.width = '100%';
                    slotDiv.style.height = '60px';
                    slotDiv.innerHTML = `<span class="icon">📦</span><span style="font-size:0.65rem">${tileNames[id] || 'Item'}</span><span class="count">${inventory[id]}</span>`;
                    slotsContainer.appendChild(slotDiv);
                }
            }
            if (slotsContainer.children.length === 0) {
                slotsContainer.innerHTML = '<div style="color: #64748b; font-size: 0.85rem; grid-column: span 5; text-align:center; padding:15px;">Inventory is empty. Mine blocks to collect items!</div>';
            }
        }

        function craftItem(recipeType) {
            if (recipeType === 'wooden_pickaxe') {
                if ((inventory[4] || 0) >= 5) {
                    inventory[4] -= 5;
                    hero.tool = 'Wooden Pickaxe';
                    hero.toolTier = 2;
                    alert('Successfully crafted Wooden Pickaxe!');
                } else {
                    alert('Not enough Wood! Need 5 Wood blocks.');
                }
            } else if (recipeType === 'stone_pickaxe') {
                if ((inventory[2] || 0) >= 5) {
                    inventory[2] -= 5;
                    hero.tool = 'Stone Pickaxe';
                    hero.toolTier = 3;
                    alert('Successfully crafted Stone Pickaxe!');
                } else {
                    alert('Not enough Stone! Need 5 Stone blocks.');
                }
            } else if (recipeType === 'iron_pickaxe') {
                if ((inventory[7] || 0) >= 5) {
                    inventory[7] -= 5;
                    hero.tool = 'Iron Pickaxe';
                    hero.toolTier = 4;
                    alert('Successfully crafted Iron Pickaxe!');
                } else {
                    alert('Not enough Iron! Need 5 Iron Ore.');
                }
            }
            document.getElementById('hud-tool').textContent = hero.tool;
            renderInventoryUI();
        }

        function connectToServer() {
            let name = nameInput.value.trim();
            if (name) hero.name = name;
            let room = roomInput.value.trim().toLowerCase();
            if (room) currentRoom = room;

            document.getElementById('hud-name').textContent = hero.name;
            document.getElementById('hud-room').textContent = currentRoom;

            socket.emit('join_server', { name: hero.name, room: currentRoom });
        }

        socket.on('init_world', (data) => {
            worldMap = data.world;
            remotePlayers = data.players;
            droppedItems = data.items || [];
            if (socket.id && remotePlayers[socket.id]) {
                delete remotePlayers[socket.id];
            }

            hero.x = 4 * TILE_SIZE;
            for (let y = 0; y < WORLD_HEIGHT; y++) {
                if (worldMap[y][4] > 0) {
                    hero.y = (y - 2) * TILE_SIZE;
                    break;
                }
            }

            if (!gameStarted) {
                gameStarted = true;
                titleScreen.classList.remove('active');
                hud.classList.add('active');
                hotbar.classList.add('active');
                controlsHint.classList.add('active');
                requestAnimationFrame(gameLoop);
            }
        });

        socket.on('player_joined', (player) => { remotePlayers[player.id] = player; });
        socket.on('player_moved', (player) => { remotePlayers[player.id] = player; });
        socket.on('player_left', (data) => { delete remotePlayers[data.id]; });
        socket.on('tile_updated', (data) => {
            if (worldMap.length > 0 && data.y < worldMap.length && data.x < worldMap[0].length) {
                worldMap[data.y][data.x] = data.tile;
            }
        });
        socket.on('sync_items', (items) => { droppedItems = items; });

        const keys = {};
        window.addEventListener('keydown', e => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
            if (e.key.toLowerCase() === 'e') {
                toggleInventory();
                return;
            }
            if (inventoryOpen) return;

            keys[e.key] = true;
            keys[e.key.toLowerCase()] = true;
            if (e.key === '1') selectSlot(0);
            if (e.key === '2') selectSlot(1);
            if (e.key === '3') selectSlot(2);
        });

        window.addEventListener('keyup', e => {
            keys[e.key] = false;
            keys[e.key.toLowerCase()] = false;
        });

        window.addEventListener('mousedown', e => {
            if (!gameStarted || inventoryOpen) return;

            let cameraX = Math.max(0, Math.min(WORLD_WIDTH * TILE_SIZE - screenWidth, hero.x - screenWidth / 2 + hero.width / 2));
            let cameraY = Math.max(0, Math.min(WORLD_HEIGHT * TILE_SIZE - screenHeight, hero.y - screenHeight / 2 + hero.height / 2));

            let worldMouseX = e.clientX + cameraX;
            let worldMouseY = e.clientY + cameraY;

            let tileX = Math.floor(worldMouseX / TILE_SIZE);
            let tileY = Math.floor(worldMouseY / TILE_SIZE);

            if (tileX < 0 || tileX >= WORLD_WIDTH || tileY < 0 || tileY >= WORLD_HEIGHT) return;

            let dist = Math.hypot((hero.x + hero.width/2) - worldMouseX, (hero.y + hero.height/2) - worldMouseY);
            if (dist > 140) return;

            if (e.button === 0) {
                let currentTile = worldMap[tileY][tileX];
                if (currentTile > 0) {
                    worldMap[tileY][tileX] = 0;
                    socket.emit('update_tile', { room: currentRoom, x: tileX, y: tileY, tile: 0 });

                    // Spawn physical drop item with bouncy animation velocity
                    let newItem = {
                        id: Math.random().toString(36).substring(2, 9),
                        type: currentTile,
                        x: tileX * TILE_SIZE + 8,
                        y: tileY * TILE_SIZE + 8,
                        vx: (Math.random() - 0.5) * 4,
                        vy: -5
                    };
                    droppedItems.push(newItem);
                    socket.emit('spawn_item', { room: currentRoom, item: newItem });
                }
            } else if (e.button === 2) {
                let activeTileType = hotbarMapping[selectedSlotIndex];
                if (worldMap[tileY][tileX] === 0 && (inventory[activeTileType] || 0) > 0) {
                    let pBox = { x: hero.x, y: hero.y, w: hero.width, h: hero.height };
                    let tBox = { x: tileX * TILE_SIZE, y: tileY * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE };
                    let overlapping = !(pBox.x + pBox.w < tBox.x || pBox.x > tBox.x + tBox.w || pBox.y + pBox.h < tBox.y || pBox.y > tBox.y + tBox.h);
                    
                    if (!overlapping) {
                        inventory[activeTileType]--;
                        worldMap[tileY][tileX] = activeTileType;
                        socket.emit('update_tile', { room: currentRoom, x: tileX, y: tileY, tile: activeTileType });
                    }
                }
            }
        });

        window.addEventListener('contextmenu', e => e.preventDefault());

        function checkCollision(nx, ny, w, h) {
            if (worldMap.length === 0) return false;
            let startX = Math.floor(nx / TILE_SIZE);
            let endX = Math.floor((nx + w - 1) / TILE_SIZE);
            let startY = Math.floor(ny / TILE_SIZE);
            let endY = Math.floor((ny + h - 1) / TILE_SIZE);

            if (startX < 0 || endX >= WORLD_WIDTH || startY < 0 || endY >= WORLD_HEIGHT) return true;

            for (let y = startY; y <= endY; y++) {
                for (let x = startX; x <= endX; x++) {
                    if (worldMap[y] && worldMap[y][x] > 0) return true;
                }
            }
            return false;
        }

        let netSyncCounter = 0;

        function updateGame() {
            if (!inventoryOpen) {
                hero.vx = 0;
                if (keys['a'] || keys['arrowleft']) { hero.vx = -hero.speed; hero.facing = 'left'; }
                if (keys['d'] || keys['arrowright']) { hero.vx = hero.speed; hero.facing = 'right'; }

                hero.x += hero.vx;
                if (checkCollision(hero.x, hero.y, hero.width, hero.height)) hero.x -= hero.vx;

                if ((keys['w'] || keys['arrowup'] || keys[' ']) && hero.grounded) {
                    hero.vy = hero.jumpForce;
                    hero.grounded = false;
                }

                hero.vy += hero.gravity;
                hero.y += hero.vy;
                hero.grounded = false;

                if (checkCollision(hero.x, hero.y, hero.width, hero.height)) {
                    hero.y -= hero.vy;
                    if (hero.vy > 0) hero.grounded = true;
                    hero.vy = 0;
                }

                if (hero.vx !== 0 && hero.grounded) {
                    hero.animTimer++;
                    if (hero.animTimer > 8) { hero.frame = (hero.frame + 1) % 4; hero.animTimer = 0; }
                } else {
                    hero.frame = 0;
                }
            }

            // Update item physics & animation drop bounces
            for (let i = droppedItems.length - 1; i >= 0; i--) {
                let item = droppedItems[i];
                item.vy += 0.45;
                item.x += item.vx;
                item.y += item.vy;

                let tx = Math.floor((item.x + 8) / TILE_SIZE);
                let ty = Math.floor((item.y + 16) / TILE_SIZE);
                if (ty >= 0 && ty < WORLD_HEIGHT && tx >= 0 && tx < WORLD_WIDTH && worldMap[ty][tx] > 0) {
                    item.y = ty * TILE_SIZE - 16;
                    item.vy = -item.vy * 0.3; // Bounce animation effect
                    item.vx *= 0.75;
                }

                let pBox = { x: hero.x, y: hero.y, w: hero.width, h: hero.height };
                let iBox = { x: item.x, y: item.y, w: 16, h: 16 };
                let colliding = !(pBox.x + pBox.w < iBox.x || pBox.x > iBox.x + iBox.w || pBox.y + pBox.h < iBox.y || pBox.y > iBox.y + iBox.h);

                if (colliding) {
                    inventory[item.type] = (inventory[item.type] || 0) + 1;
                    socket.emit('collect_item', { room: currentRoom, index: i });
                    droppedItems.splice(i, 1);
                }
            }

            netSyncCounter++;
            if (netSyncCounter > 2) {
                socket.emit('player_update', { room: currentRoom, x: hero.x, y: hero.y, facing: hero.facing, frame: hero.frame });
                netSyncCounter = 0;
            }

            document.getElementById('count-1').textContent = inventory[1] || 0;
            document.getElementById('count-2').textContent = inventory[2] || 0;
            document.getElementById('count-3').textContent = inventory[4] || 0; // Hotbar slot 3 set to wood blocks
        }

        function drawGame() {
            let gradient = ctx.createLinearGradient(0, 0, 0, screenHeight);
            gradient.addColorStop(0, '#0284c7');
            gradient.addColorStop(0.5, '#38bdf8');
            gradient.addColorStop(1, '#bae6fd');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, screenWidth, screenHeight);

            if (worldMap.length === 0) return;

            let cameraX = Math.max(0, Math.min(WORLD_WIDTH * TILE_SIZE - screenWidth, hero.x - screenWidth / 2 + hero.width / 2));
            let cameraY = Math.max(0, Math.min(WORLD_HEIGHT * TILE_SIZE - screenHeight, hero.y - screenHeight / 2 + hero.height / 2));

            ctx.save();
            ctx.translate(-Math.floor(cameraX), -Math.floor(cameraY));

            let startCol = Math.floor(cameraX / TILE_SIZE);
            let endCol = startCol + Math.ceil(screenWidth / TILE_SIZE) + 1;
            let startRow = Math.floor(cameraY / TILE_SIZE);
            let endRow = startRow + Math.ceil(screenHeight / TILE_SIZE) + 1;

            for (let y = startRow; y <= endRow && y < WORLD_HEIGHT; y++) {
                for (let x = startCol; x <= endCol && x < WORLD_WIDTH; x++) {
                    let tile = worldMap[y][x];
                    if (tile > 0) {
                        let rx = x * TILE_SIZE;
                        let ry = y * TILE_SIZE;
                        if (tile === 3) {
                            ctx.fillStyle = '#22c55e'; ctx.fillRect(rx, ry, TILE_SIZE, TILE_SIZE);
                            ctx.fillStyle = '#16a34a'; ctx.fillRect(rx, ry + TILE_SIZE - 6, TILE_SIZE, 6);
                        } else if (tile === 1) {
                            ctx.fillStyle = '#b45309'; ctx.fillRect(rx, ry, TILE_SIZE, TILE_SIZE);
                            ctx.fillStyle = '#92400e'; ctx.fillRect(rx + 4, ry + 4, 8, 8);
                        } else if (tile === 2) {
                            ctx.fillStyle = '#64748b'; ctx.fillRect(rx, ry, TILE_SIZE, TILE_SIZE);
                            ctx.fillStyle = '#475569'; ctx.fillRect(rx + 6, ry + 6, 10, 10);
                        } else if (tile === 4) {
                            ctx.fillStyle = '#78350f'; ctx.fillRect(rx, ry, TILE_SIZE, TILE_SIZE);
                            ctx.fillStyle = '#451a03'; ctx.fillRect(rx + 4, ry + 4, 8, 24);
                        } else if (tile === 5) {
                            ctx.fillStyle = '#15803d'; ctx.fillRect(rx, ry, TILE_SIZE, TILE_SIZE);
                        } else if (tile === 6) { // Coal
                            ctx.fillStyle = '#64748b'; ctx.fillRect(rx, ry, TILE_SIZE, TILE_SIZE);
                            ctx.fillStyle = '#0f172a'; ctx.fillRect(rx + 5, ry + 5, 10, 10);
                        } else if (tile === 7) { // Iron
                            ctx.fillStyle = '#64748b'; ctx.fillRect(rx, ry, TILE_SIZE, TILE_SIZE);
                            ctx.fillStyle = '#e2e8f0'; ctx.fillRect(rx + 5, ry + 5, 10, 10);
                        } else if (tile === 8) { // Gold
                            ctx.fillStyle = '#64748b'; ctx.fillRect(rx, ry, TILE_SIZE, TILE_SIZE);
                            ctx.fillStyle = '#fbbf24'; ctx.fillRect(rx + 5, ry + 5, 10, 10);
                        } else if (tile === 9) { // Diamond
                            ctx.fillStyle = '#64748b'; ctx.fillRect(rx, ry, TILE_SIZE, TILE_SIZE);
                            ctx.fillStyle = '#38bdf8'; ctx.fillRect(rx + 5, ry + 5, 10, 10);
                        }
                    }
                }
            }

            // Draw dropped item animations with floating visual offsets
            droppedItems.forEach(item => {
                if (item.type === 3 || item.type === 5) ctx.fillStyle = '#22c55e';
                else if (item.type === 1 || item.type === 4) ctx.fillStyle = '#b45309';
                else if (item.type === 6) ctx.fillStyle = '#0f172a';
                else if (item.type === 7) ctx.fillStyle = '#e2e8f0';
                else if (item.type === 8) ctx.fillStyle = '#fbbf24';
                else if (item.type === 9) ctx.fillStyle = '#38bdf8';
                else ctx.fillStyle = '#64748b';
                ctx.fillRect(item.x, item.y + Math.sin(Date.now() * 0.01) * 3, 14, 14);
            });

            for (let id in remotePlayers) {
                let rp = remotePlayers[id];
                let rpx = Math.floor(rp.x);
                let rpy = Math.floor(rp.y);

                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(rpx - 10, rpy - 22, (rp.name.length * 8) + 8, 16);
                ctx.fillStyle = '#38bdf8';
                ctx.font = 'bold 11px "Courier New", monospace';
                ctx.fillText(rp.name, rpx - 6, rpy - 10);

                ctx.fillStyle = '#ec4899';
                ctx.fillRect(rpx + 4, rpy + 8, 14, 16);
                ctx.fillStyle = '#fbcfe8';
                ctx.fillRect(rpx + 3, rpy, 16, 10);
            }

            let hx = Math.floor(hero.x);
            let hy = Math.floor(hero.y);

            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(hx - 10, hy - 22, (hero.name.length * 8) + 8, 16);
            ctx.fillStyle = '#4ade80';
            ctx.font = 'bold 11px "Courier New", monospace';
            ctx.fillText(hero.name, hx - 6, hy - 10);

            ctx.fillStyle = '#38bdf8'; ctx.fillRect(hx + 4, hy + 8, 14, 16);
            ctx.fillStyle = '#fde047'; ctx.fillRect(hx + 3, hy, 16, 10);

            ctx.restore();
        }

        function gameLoop() {
            updateGame();
            drawGame();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
