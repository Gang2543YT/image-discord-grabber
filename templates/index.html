<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Terraria-Style Sandbox RPG</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a24;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        canvas {
            display: block;
        }
        /* Start Screen Styles */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #151d28, #2c3e50);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            color: white;
        }
        .menu-box {
            background: rgba(0, 0, 0, 0.75);
            padding: 30px 40px;
            border-radius: 10px;
            border: 3px solid #f39c12;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }
        .menu-box h1 {
            margin-top: 0;
            color: #f39c12;
            font-size: 28px;
            text-shadow: 2px 2px #000;
        }
        .menu-box input {
            width: 80%;
            padding: 10px;
            font-size: 16px;
            font-family: 'Courier New', Courier, monospace;
            background: #222;
            border: 2px solid #555;
            color: white;
            border-radius: 5px;
            margin-bottom: 10px;
            outline: none;
            text-align: center;
        }
        .menu-box input:focus {
            border-color: #f39c12;
        }
        .menu-box button {
            background: #f39c12;
            color: #111;
            font-weight: bold;
            padding: 10px 25px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            transition: background 0.2s;
        }
        .menu-box button:hover {
            background: #e67e22;
        }
        #name-error {
            color: #ff4d4d;
            font-size: 13px;
            margin-bottom: 15px;
            height: 16px;
            font-weight: bold;
        }
        .taken-list {
            font-size: 11px;
            color: #aaa;
            margin-top: 15px;
        }

        /* In-Game UI */
        #ui-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px;
            border-radius: 6px;
            border: 2px solid #444;
            pointer-events: none;
            font-size: 13px;
            display: none;
        }
        #hotbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 8px;
            background: rgba(0, 0, 0, 0.75);
            padding: 8px;
            border-radius: 8px;
            border: 2px solid #555;
        }
        .slot {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #666;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 11px;
            position: relative;
        }
        .slot.active {
            border-color: #f39c12;
            background: rgba(243, 156, 18, 0.2);
        }
        .slot span {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 10px;
            color: #f1c40f;
        }
    </style>
</head>
<body>

    <!-- Start Screen Overlay -->
    <div id="start-screen">
        <div class="menu-box">
            <h1>TERRARIA 2D SANDBOX</h1>
            <p>Enter your player name:</p>
            <input type="text" id="player-name-input" placeholder="e.g. PixelKnight" maxlength="16">
            <div id="name-error"></div>
            <button id="start-btn">PLAY GAME</button>
            <div class="taken-list">Taken names: Steve, Terrarian, BuilderX, MinerBro, Notch</div>
        </div>
    </div>

    <div id="ui-overlay">
        <strong>Controls:</strong> A/D to Move | Space to Jump | Mouse to Aim<br>
        <strong>Left Click:</strong> Swing Sword / Mine Blocks<br>
        <strong>Hotbar:</strong> 1-5 to select items
    </div>

    <div id="hotbar">
        <div class="slot active" id="slot-0">Sword<span>1</span></div>
        <div class="slot" id="slot-1">Pick<span>2</span></div>
        <div class="slot" id="slot-2">Wood<span>15</span></div>
        <div class="slot" id="slot-3">Stone<span>0</span></div>
        <div class="slot" id="slot-4">Ore<span>0</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- GAME CONFIG & CONSTANTS ---
        const TILE_SIZE = 24;
        const CHUNK_WIDTH = 32;
        const WORLD_HEIGHT = 80;
        const loadedChunks = new Map();
        let gameStarted = false;

        const TAKEN_NAMES = ['steve', 'terrarian', 'builderx', 'minerbro', 'notch'];
        const RANDOM_NAMES = ['PixelKnight', 'VoxelVoyager', 'CraftMaster', 'DiggingDwarf', 'BlockBuster', 'CaveCrawler'];

        const COLORS = {
            skyTop: '#151d28',
            skyBottom: '#4a90e2',
            surface: '#43a047',
            grass: '#558b2f',
            dirt: '#795548',
            stone: '#616161',
            copper_ore: '#d84315',
            iron_ore: '#b0bec5',
            wood: '#8d6e63'
        };

        // --- PLAYER & PARTICLES ---
        const player = {
            name: 'Player',
            x: 0,
            y: 40 * TILE_SIZE,
            width: 20,
            height: 38,
            vx: 0,
            vy: 0,
            speed: 4.5,
            jumpForce: -10.5,
            gravity: 0.45,
            grounded: false,
            selectedSlot: 0,
            facing: 1,
            swingTimer: 0,
            inventory: {
                copper_broadsword: 1,
                copper_pickaxe: 1,
                wood: 15,
                stone: 0,
                copper_ore: 0
            }
        };

        const hotbarKeys = ['copper_broadsword', 'copper_pickaxe', 'wood', 'stone', 'copper_ore'];
        const particles = [];
        const clouds = [
            { x: 100, y: 80, speed: 0.3, width: 120, height: 40 },
            { x: 450, y: 130, speed: 0.2, width: 180, height: 50 },
            { x: 900, y: 60, speed: 0.4, width: 100, height: 35 }
        ];

        // --- START SCREEN LOGIC ---
        const startBtn = document.getElementById('start-btn');
        const nameInput = document.getElementById('player-name-input');
        const nameError = document.getElementById('name-error');

        startBtn.addEventListener('click', startGameHandler);
        nameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') startGameHandler();
        });

        function startGameHandler() {
            let enteredName = nameInput.value.trim();

            if (enteredName === '') {
                // Random name assigned if blank
                enteredName = RANDOM_NAMES[Math.floor(Math.random() * RANDOM_NAMES.length)];
            } else {
                // Check if name is taken
                if (TAKEN_NAMES.includes(enteredName.toLowerCase())) {
                    nameError.innerText = `⚠️ The name "${enteredName}" is already taken! Please choose another.`;
                    nameInput.style.borderColor = '#ff4d4d';
                    return;
                }
            }

            player.name = enteredName;
            gameStarted = true;

            // Hide start screen, show game HUD
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('ui-overlay').style.display = 'block';
            document.getElementById('hotbar').style.display = 'flex';

            // Initialize chunks around player
            generateChunk(0);
            generateChunk(1);
            generateChunk(-1);
            updateHotbarUI();
        }

        // Input Management
        const keys = {};
        const mouse = { x: 0, y: 0, down: false };

        window.addEventListener('keydown', e => {
            if (!gameStarted) return;
            keys[e.code] = true;
            if (e.code >= 'Digit1' && e.code <= 'Digit5') {
                player.selectedSlot = parseInt(e.code) - 1;
                updateHotbarUI();
            }
        });
        window.addEventListener('keyup', e => { if (gameStarted) keys[e.code] = false; });
        window.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });
        window.addEventListener('mousedown', () => { if (gameStarted) mouse.down = true; });
        window.addEventListener('mouseup', () => { mouse.down = false; });
        window.addEventListener('contextmenu', e => e.preventDefault());

        function updateHotbarUI() {
            for (let i = 0; i < 5; i++) {
                const slot = document.getElementById(`slot-${i}`);
                const itemName = hotbarKeys[i];
                const count = player.inventory[itemName] || 0;
                slot.querySelector('span').innerText = count;
                if (i === player.selectedSlot) {
                    slot.classList.add('active');
                } else {
                    slot.classList.remove('active');
                }
            }
        }

        // --- PROCEDURAL WORLD GENERATION ---
        function generateChunk(cx) {
            const chunkData = [];
            for (let x = 0; x < CHUNK_WIDTH; x++) {
                const worldX = cx * CHUNK_WIDTH + x;
                const surfaceHeight = Math.floor(40 + Math.sin(worldX * 0.04) * 8 + Math.cos(worldX * 0.015) * 15);
                
                const column = {};
                for (let y = 0; y < WORLD_HEIGHT; y++) {
                    let type = null;
                    if (y === surfaceHeight) {
                        type = 'grass';
                    } else if (y > surfaceHeight && y < surfaceHeight + 5) {
                        type = 'dirt';
                    } else if (y >= surfaceHeight + 5) {
                        if (y > surfaceHeight + 15 && Math.random() < 0.06) {
                            type = Math.random() < 0.5 ? 'copper_ore' : 'iron_ore';
                        } else {
                            type = 'stone';
                        }
                    }
                    if (type) column[y] = type;
                }
                chunkData[x] = { surfaceHeight, blocks: column };
            }
            loadedChunks.set(cx, chunkData);
            return chunkData;
        }

        function getBlock(bx, by) {
            const cx = Math.floor(bx / CHUNK_WIDTH);
            const lx = ((bx % CHUNK_WIDTH) + CHUNK_WIDTH) % CHUNK_WIDTH;
            let chunk = loadedChunks.get(cx);
            if (!chunk) chunk = generateChunk(cx);
            return chunk[lx]?.blocks[by] || null;
        }

        function setBlock(bx, by, type) {
            const cx = Math.floor(bx / CHUNK_WIDTH);
            const lx = ((bx % CHUNK_WIDTH) + CHUNK_WIDTH) % CHUNK_WIDTH;
            let chunk = loadedChunks.get(cx);
            if (!chunk) chunk = generateChunk(cx);
            if (type === null) {
                delete chunk[lx].blocks[by];
            } else {
                chunk[lx].blocks[by] = type;
            }
        }

        // --- PHYSICS & COLLISION ---
        function checkCollision(nx, ny) {
            const left = Math.floor(nx / TILE_SIZE);
            const right = Math.floor((nx + player.width - 1) / TILE_SIZE);
            const top = Math.floor(ny / TILE_SIZE);
            const bottom = Math.floor((ny + player.height - 1) / TILE_SIZE);

            for (let bx = left; bx <= right; bx++) {
                for (let by = top; by <= bottom; by++) {
                    if (getBlock(bx, by) !== null) return true;
                }
            }
            return false;
        }

        function updatePlayer() {
            player.vx = 0;
            if (keys['KeyA'] || keys['ArrowLeft']) { player.vx = -player.speed; player.facing = -1; }
            if (keys['KeyD'] || keys['ArrowRight']) { player.vx = player.speed; player.facing = 1; }

            player.x += player.vx;
            if (checkCollision(player.x, player.y)) player.x -= player.vx;

            player.vy += player.gravity;
            player.y += player.vy;
            player.grounded = false;

            if (checkCollision(player.x, player.y)) {
                player.y -= player.vy;
                if (player.vy > 0) player.grounded = true;
                player.vy = 0;
            }

            if ((keys['Space'] || keys['KeyW'] || keys['ArrowUp']) && player.grounded) {
                player.vy = player.jumpForce;
                player.grounded = false;
            }

            if (player.swingTimer > 0) player.swingTimer--;

            // Handle Item / Tool Action (Mining / Swinging)
            if (mouse.down && player.swingTimer === 0) {
                const cameraX = player.x - canvas.width / 2;
                const cameraY = player.y - canvas.height / 2;
                const worldMouseX = mouse.x + cameraX;
                const worldMouseY = mouse.y + cameraY;

                const targetBx = Math.floor(worldMouseX / TILE_SIZE);
                const targetBy = Math.floor(worldMouseY / TILE_SIZE);

                const playerBx = Math.floor((player.x + player.width / 2) / TILE_SIZE);
                const playerBy = Math.floor((player.y + player.height / 2) / TILE_SIZE);

                if (Math.hypot(targetBx - playerBx, targetBy - playerBy) < 6) {
                    const block = getBlock(targetBx, targetBy);
                    const selectedItem = hotbarKeys[player.selectedSlot];

                    if (selectedItem.includes('pickaxe') || selectedItem.includes('broadsword')) {
                        player.swingTimer = 12;
                        if (block) {
                            const blockColor = COLORS[block] || '#fff';
                            setBlock(targetBx, targetBy, null);
                            
                            // Spawn breaking particles
                            for (let p = 0; p < 6; p++) {
                                particles.push({
                                    x: (targetBx + 0.5) * TILE_SIZE,
                                    y: (targetBy + 0.5) * TILE_SIZE,
                                    vx: (Math.random() - 0.5) * 5,
                                    vy: (Math.random() - 0.7) * 5,
                                    size: Math.random() * 4 + 2,
                                    color: blockColor,
                                    life: 25
                                });
                            }

                            const dropName = block.includes('ore') ? block : (block === 'stone' ? 'stone' : 'wood');
                            player.inventory[dropName] = (player.inventory[dropName] || 0) + 1;
                            updateHotbarUI();
                        }
                    } else if (selectedItem === 'wood' || selectedItem === 'stone') {
                        if (!block && player.inventory[selectedItem] > 0) {
                            setBlock(targetBx, targetBy, selectedItem);
                            player.inventory[selectedItem]--;
                            updateHotbarUI();
                            player.swingTimer = 10;
                        }
                    }
                }
            }

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const pt = particles[i];
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.vy += 0.3; // gravity
                pt.life--;
                if (pt.life <= 0) particles.splice(i, 1);
            }
        }

        // --- RENDER LOOP ---
        const camera = { x: 0, y: 0 };

        function draw() {
            camera.x = player.x - canvas.width / 2 + player.width / 2;
            camera.y = player.y - canvas.height / 2 + player.height / 2;

            // Gradient Sky Background
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, COLORS.skyTop);
            grad.addColorStop(1, COLORS.skyBottom);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Parallax Clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
            clouds.forEach(cloud => {
                cloud.x -= cloud.speed;
                if (cloud.x < -cloud.width) cloud.x = canvas.width + 200;
                let renderCloudX = cloud.x - (camera.x * 0.2) % (canvas.width + 400);
                ctx.fillRect(renderCloudX, cloud.y, cloud.width, cloud.height);
            });

            // Render Chunks & Blocks
            const startChunk = Math.floor(camera.x / (CHUNK_WIDTH * TILE_SIZE)) - 1;
            const endChunk = startChunk + Math.ceil(canvas.width / (CHUNK_WIDTH * TILE_SIZE)) + 2;

            for (let cx = startChunk; cx <= endChunk; cx++) {
                let chunk = loadedChunks.get(cx) || generateChunk(cx);
                for (let lx = 0; lx < CHUNK_WIDTH; lx++) {
                    const bx = cx * CHUNK_WIDTH + lx;
                    const col = chunk[lx];
                    for (const [strY, type] of Object.entries(col.blocks)) {
                        const by = parseInt(strY);
                        const screenX = bx * TILE_SIZE - camera.x;
                        const screenY = by * TILE_SIZE - camera.y;

                        if (screenX < -TILE_SIZE || screenX > canvas.width + TILE_SIZE ||
                            screenY < -TILE_SIZE || screenY > canvas.height + TILE_SIZE) continue;

                        ctx.fillStyle = COLORS[type] || '#fff';
                        ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);

                        // Underground Darkness starts strictly right after the grass block layer
                        if (by > col.surfaceHeight) {
                            const depth = by - col.surfaceHeight;
                            const alpha = Math.min(0.88, depth * 0.05 + 0.1); // Starts right under grass
                            ctx.fillStyle = `rgba(8, 8, 14, ${alpha})`;
                            ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
                        }
                    }
                }
            }

            // Draw Breaking Particles
            particles.forEach(pt => {
                ctx.fillStyle = pt.color;
                ctx.fillRect(pt.x - camera.x, pt.y - camera.y, pt.size, pt.size);
            });

            // Draw Player Character
            const px = player.x - camera.x;
            const py = player.y - camera.y;

            // Legs
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(px + 3, py + 26, 5, 12);
            ctx.fillRect(px + 12, py + 26, 5, 12);
            // Torso / Shirt
            ctx.fillStyle = '#2980b9';
            ctx.fillRect(px + 2, py + 12, 16, 16);
            // Head & Hair
            ctx.fillStyle = '#f1c40f';
            ctx.fillRect(px + 3, py + 2, 14, 12);
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(px + 3, py, 14, 4);

            // Draw Player Name Tag Overhead
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.font = '11px Courier New';
            ctx.textAlign = 'center';
            const nameWidth = ctx.measureText(player.name).width;
            ctx.fillRect(px + player.width/2 - nameWidth/2 - 4, py - 22, nameWidth + 8, 16);
            ctx.fillStyle = '#ffffff';
            ctx.fillText(player.name, px + player.width/2, py - 10);

            // Draw Weapon Swing Arc if swinging
            if (player.swingTimer > 0) {
                ctx.save();
                ctx.translate(px + player.width / 2, py + player.height / 2);
                ctx.rotate(player.facing * (1 - player.swingTimer / 12) * Math.PI * 1.2);
                ctx.fillStyle = '#bdc3c7';
                ctx.fillRect(10, -4, 20, 6);
                ctx.restore();
            }
        }

        function loop() {
            if (gameStarted) {
                updatePlayer();
                draw();
            }
            requestAnimationFrame(loop);
        }

        // Start animation loop immediately
        loop();
    </script>
</body>
</html>
