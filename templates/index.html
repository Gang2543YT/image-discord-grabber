<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚔️ Terraria-Style Multiplayer WebSocket RPG</title>
    <!-- Built-in Flask-SocketIO Client Route -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #020617;
            font-family: 'Courier New', Courier, monospace;
            color: #f8fafc;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 100vw;
            height: 100vh;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            z-index: 10;
        }
        .screen.active {
            display: flex;
        }
        h1 {
            font-size: 3.5rem;
            margin-bottom: 5px;
            color: #38bdf8;
            text-shadow: 4px 4px #000;
            letter-spacing: 2px;
        }
        p {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 25px;
        }
        input {
            background: #090d16;
            border: 3px solid #334155;
            color: #fff;
            padding: 12px 20px;
            font-size: 1.2rem;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            outline: none;
            border-radius: 4px;
            margin-bottom: 15px;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.6);
            width: 280px;
        }
        input:focus {
            border-color: #38bdf8;
        }
        .pixel-btn {
            background: #0284c7;
            border: 3px solid #7dd3fc;
            color: white;
            padding: 12px 32px;
            font-size: 1.2rem;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 0 #0369a1, 0 10px 10px rgba(0,0,0,0.5);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .pixel-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0369a1, 0 5px 5px rgba(0,0,0,0.5);
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            display: none;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            z-index: 5;
        }
        #hud.active {
            display: flex;
        }
        .hud-box {
            background: rgba(15, 23, 42, 0.85);
            border: 3px solid #334155;
            padding: 10px 18px;
            font-size: 1rem;
            font-weight: bold;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
            display: flex;
            gap: 15px;
        }
        .controls-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            border: 3px solid #334155;
            padding: 10px 20px;
            font-size: 0.9rem;
            color: #cbd5e1;
            text-align: center;
            pointer-events: none;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
            z-index: 5;
            display: none;
        }
        .controls-overlay.active {
            display: block;
        }
    </style>
</head>
<body>

    <!-- START MENU SCREEN -->
    <div id="title-screen" class="screen active">
        <h1>TERRA-QUEST MMO</h1>
        <p>Live WebSocket Multiplayer Terraria Overworld RPG</p>
        <input id="name-input" maxlength="15" placeholder="Hero Name..." /><br>
        <input id="room-input" maxlength="15" placeholder="Server Room (e.g. alpha)" value="main" /><br>
        <button class="pixel-btn" onclick="connectToServer()">JOIN WORLD</button>
    </div>

    <!-- HUD OVERLAYS -->
    <div id="hud">
        <div class="hud-box">
            <span>🛡️ <span id="hud-name">Hero</span></span>
            <span>ROOM: <span id="hud-room" style="color:#38bdf8;">main</span></span>
            <span>LVL: <span id="hud-lvl">1</span></span>
            <span>HP: <span id="hud-hp" style="color:#f87171;">100</span>/<span id="hud-max-hp">100</span></span>
            <span>GOLD: <span id="hud-gold" style="color:#fbbf24;">0</span></span>
        </div>
    </div>

    <div id="controls-hint" class="controls-overlay">
        Move: <b>A / D</b> or <b>Left / Right</b> &nbsp;|&nbsp; Jump: <b>W, Space, Up</b> &nbsp;|&nbsp; See connected online players live!
    </div>

    <!-- MAIN GAME CANVAS -->
    <canvas id="game-canvas"></canvas>

    <script>
        const socket = io();
        const titleScreen = document.getElementById('title-screen');
        const hud = document.getElementById('hud');
        const controlsHint = document.getElementById('controls-hint');
        const nameInput = document.getElementById('name-input');
        const roomInput = document.getElementById('room-input');
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        ctx.imageSmoothingEnabled = false;

        let screenWidth = window.innerWidth;
        let screenHeight = window.innerHeight;
        canvas.width = screenWidth;
        canvas.height = screenHeight;

        window.addEventListener('resize', () => {
            screenWidth = window.innerWidth;
            screenHeight = window.innerHeight;
            canvas.width = screenWidth;
            canvas.height = screenHeight;
        });

        const TILE_SIZE = 32;
        const WORLD_WIDTH = 120; 
        const WORLD_HEIGHT = 45; 

        let worldMap = []; 
        let entities = []; 
        let particles = []; 
        let remotePlayers = {}; 
        let currentRoom = 'main';

        let hero = {
            name: 'Hero',
            x: 100,
            y: 100,
            width: 22,
            height: 30,
            vx: 0,
            vy: 0,
            speed: 3.5,
            jumpForce: -11,
            gravity: 0.5,
            grounded: false,
            facing: 'right',
            animTimer: 0,
            frame: 0,
            hp: 100,
            maxHp: 100,
            level: 1,
            exp: 0,
            maxExp: 50,
            gold: 0,
            atk: 15
        };

        function connectToServer() {
            let name = nameInput.value.trim();
            if (name) hero.name = name;
            let room = roomInput.value.trim().toLowerCase();
            if (room) currentRoom = room;

            document.getElementById('hud-name').textContent = hero.name;
            document.getElementById('hud-room').textContent = currentRoom;

            socket.emit('join_server', { name: hero.name, room: currentRoom });

            generateTerrain();
            titleScreen.classList.remove('active');
            hud.classList.add('active');
            controlsHint.classList.add('active');

            requestAnimationFrame(gameLoop);
        }

        socket.on('current_players', (players) => {
            remotePlayers = players;
            if (socket.id && remotePlayers[socket.id]) {
                delete remotePlayers[socket.id];
            }
        });

        socket.on('player_joined', (player) => {
            remotePlayers[player.id] = player;
        });

        socket.on('player_moved', (player) => {
            remotePlayers[player.id] = player;
        });

        socket.on('player_left', (data) => {
            delete remotePlayers[data.id];
        });

        function generateTerrain() {
            worldMap = [];
            for (let y = 0; y < WORLD_HEIGHT; y++) {
                let row = [];
                for (let x = 0; x < WORLD_WIDTH; x++) {
                    row.push(0);
                }
                worldMap.push(row);
            }

            let surfaceHeight = 18;
            for (let x = 0; x < WORLD_WIDTH; x++) {
                surfaceHeight += Math.floor(Math.sin(x * 0.15) * 1.5 + (Math.random() * 0.6 - 0.3));
                surfaceHeight = Math.max(12, Math.min(28, surfaceHeight));

                for (let y = surfaceHeight; y < WORLD_HEIGHT; y++) {
                    if (y === surfaceHeight) {
                        worldMap[y][x] = 3; 
                    } else if (y < surfaceHeight + 5) {
                        worldMap[y][x] = 1; 
                    } else {
                        worldMap[y][x] = 2; 
                    }
                }
            }

            hero.x = 4 * TILE_SIZE;
            for (let y = 0; y < WORLD_HEIGHT; y++) {
                if (worldMap[y][4] > 0) {
                    hero.y = (y - 2) * TILE_SIZE;
                    break;
                }
            }

            entities = [];
            for (let x = 10; x < WORLD_WIDTH - 5; x += Math.floor(Math.random() * 6) + 5) {
                for (let y = 5; y < WORLD_HEIGHT - 2; y++) {
                    if (worldMap[y][x] === 0 && worldMap[y + 1][x] > 0) {
                        let typeRoll = Math.random();
                        if (typeRoll < 0.65) {
                            entities.push({
                                type: 'slime',
                                x: x * TILE_SIZE,
                                y: y * TILE_SIZE,
                                width: 26,
                                height: 20,
                                vx: (Math.random() > 0.5 ? 1 : -1) * 1.2,
                                vy: 0,
                                hp: 35,
                                maxHp: 35,
                                color: Math.random() > 0.5 ? '#4ade80' : '#ec4899',
                                jumpTimer: 0
                            });
                        } else if (typeRoll < 0.85) {
                            entities.push({
                                type: 'chest',
                                x: x * TILE_SIZE,
                                y: (y * TILE_SIZE) + 6,
                                width: 26,
                                height: 26,
                                gold: 25 + Math.floor(Math.random() * 50)
                            });
                        }
                        break;
                    }
                }
            }
        }

        const keys = {};
        window.addEventListener('keydown', e => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
            keys[e.key] = true;
            keys[e.key.toLowerCase()] = true;
        });
        window.addEventListener('keyup', e => {
            keys[e.key] = false;
            keys[e.key.toLowerCase()] = false;
        });

        function checkCollision(nx, ny, w, h) {
            let startX = Math.floor(nx / TILE_SIZE);
            let endX = Math.floor((nx + w - 1) / TILE_SIZE);
            let startY = Math.floor(ny / TILE_SIZE);
            let endY = Math.floor((ny + h - 1) / TILE_SIZE);

            if (startX < 0 || endX >= WORLD_WIDTH || startY < 0 || endY >= WORLD_HEIGHT) return true;

            for (let y = startY; y <= endY; y++) {
                for (let x = startX; x <= endX; x++) {
                    if (worldMap[y][x] > 0) return true;
                }
            }
            return false;
        }

        let netSyncCounter = 0;

        function updateGame() {
            hero.vx = 0;
            if (keys['a'] || keys['arrowleft']) {
                hero.vx = -hero.speed;
                hero.facing = 'left';
            }
            if (keys['d'] || keys['arrowright']) {
                hero.vx = hero.speed;
                hero.facing = 'right';
            }

            hero.x += hero.vx;
            if (checkCollision(hero.x, hero.y, hero.width, hero.height)) {
                hero.x -= hero.vx;
            }

            if ((keys['w'] || keys['arrowup'] || keys[' ']) && hero.grounded) {
                hero.vy = hero.jumpForce;
                hero.grounded = false;
            }

            hero.vy += hero.gravity;
            hero.y += hero.vy;
            hero.grounded = false;

            if (checkCollision(hero.x, hero.y, hero.width, hero.height)) {
                hero.y -= hero.vy;
                if (hero.vy > 0) hero.grounded = true;
                hero.vy = 0;
            }

            if (hero.vx !== 0 && hero.grounded) {
                hero.animTimer++;
                if (hero.animTimer > 8) {
                    hero.frame = (hero.frame + 1) % 4;
                    hero.animTimer = 0;
                }
            } else {
                hero.frame = 0;
            }

            netSyncCounter++;
            if (netSyncCounter > 2) {
                socket.emit('player_update', {
                    room: currentRoom,
                    x: hero.x,
                    y: hero.y,
                    facing: hero.facing,
                    frame: hero.frame
                });
                netSyncCounter = 0;
            }

            for (let i = entities.length - 1; i >= 0; i--) {
                let ent = entities[i];

                if (ent.type === 'slime') {
                    ent.jumpTimer++;
                    if (ent.jumpTimer > 80 && Math.abs(hero.x - ent.x) < 300) {
                        ent.vy = -7;
                        ent.vx = hero.x > ent.x ? 1.5 : -1.5;
                        ent.jumpTimer = 0;
                    }

                    ent.vy += 0.5;
                    ent.x += ent.vx;
                    if (checkCollision(ent.x, ent.y, ent.width, ent.height)) {
                        ent.x -= ent.vx;
                        ent.vx *= -1;
                    }
                    ent.y += ent.vy;
                    if (checkCollision(ent.x, ent.y, ent.width, ent.height)) {
                        ent.y -= ent.vy;
                        ent.vy = 0;
                    }

                    if (
                        hero.x < ent.x + ent.width &&
                        hero.x + hero.width > ent.x &&
                        hero.y < ent.y + ent.height &&
                        hero.y + hero.height > ent.y
                    ) {
                        ent.hp -= hero.atk;
                        particles.push({ x: ent.x, y: ent.y, text: `-${hero.atk}`, life: 30, color: '#f87171' });

                        if (ent.hp <= 0) {
                            let goldDrop = 15 + Math.floor(Math.random() * 20);
                            hero.gold += goldDrop;
                            hero.exp += 25;
                            particles.push({ x: ent.x, y: ent.y - 10, text: `+${goldDrop}G`, life: 45, color: '#fbbf24' });
                            entities.splice(i, 1);

                            if (hero.exp >= hero.maxExp) {
                                hero.level++;
                                hero.exp = 0;
                                hero.maxExp = Math.floor(hero.maxExp * 1.3);
                                hero.maxHp += 20;
                                hero.hp = hero.maxHp;
                                hero.atk += 5;
                            }
                        } else {
                            hero.hp -= 8;
                            hero.vy = -5;
                            hero.vx = hero.facing === 'right' ? -4 : 4;
                            if (hero.hp <= 0) {
                                alert("You were defeated in the overworld!");
                                location.reload();
                            }
                        }
                    }
                } else if (ent.type === 'chest') {
                    if (
                        hero.x < ent.x + ent.width &&
                        hero.x + hero.width > ent.x &&
                        hero.y < ent.y + ent.height &&
                        hero.y + hero.height > ent.y
                    ) {
                        hero.gold += ent.gold;
                        particles.push({ x: ent.x, y: ent.y - 15, text: `+🪙${ent.gold}`, life: 50, color: '#38bdf8' });
                        entities.splice(i, 1);
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].y -= 0.6;
                particles[i].life--;
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            document.getElementById('hud-lvl').textContent = hero.level;
            document.getElementById('hud-hp').textContent = Math.max(0, hero.hp);
            document.getElementById('hud-max-hp').textContent = hero.maxHp;
            document.getElementById('hud-gold').textContent = hero.gold;
        }

        function drawGame() {
            let gradient = ctx.createLinearGradient(0, 0, 0, screenHeight);
            gradient.addColorStop(0, '#0284c7');
            gradient.addColorStop(0.5, '#38bdf8');
            gradient.addColorStop(1, '#bae6fd');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, screenWidth, screenHeight);

            let cameraX = hero.x - screenWidth / 2 + hero.width / 2;
            let cameraY = hero.y - screenHeight / 2 + hero.height / 2;

            cameraX = Math.max(0, Math.min(WORLD_WIDTH * TILE_SIZE - screenWidth, cameraX));
            cameraY = Math.max(0, Math.min(WORLD_HEIGHT * TILE_SIZE - screenHeight, cameraY));

            ctx.save();
            ctx.translate(-Math.floor(cameraX), -Math.floor(cameraY));

            let startCol = Math.floor(cameraX / TILE_SIZE);
            let endCol = startCol + Math.ceil(screenWidth / TILE_SIZE) + 1;
            let startRow = Math.floor(cameraY / TILE_SIZE);
            let endRow = startRow + Math.ceil(screenHeight / TILE_SIZE) + 1;

            for (let y = startRow; y <= endRow && y < WORLD_HEIGHT; y++) {
                for (let x = startCol; x <= endCol && x < WORLD_WIDTH; x++) {
                    let tile = worldMap[y][x];
                    if (tile > 0) {
                        let rx = x * TILE_SIZE;
                        let ry = y * TILE_SIZE;

                        if (tile === 3) {
                            ctx.fillStyle = '#22c55e';
                            ctx.fillRect(rx, ry, TILE_SIZE, TILE_SIZE);
                            ctx.fillStyle = '#16a34a';
                            ctx.fillRect(rx, ry + TILE_SIZE - 6, TILE_SIZE, 6);
                        } else if (tile === 1) {
                            ctx.fillStyle = '#b45309';
                            ctx.fillRect(rx, ry, TILE_SIZE, TILE_SIZE);
                            ctx.fillStyle = '#92400e';
                            ctx.fillRect(rx + 4, ry + 4, 8, 8);
                            ctx.fillRect(rx + 18, ry + 16, 8, 8);
                        } else if (tile === 2) {
                            ctx.fillStyle = '#64748b';
                            ctx.fillRect(rx, ry, TILE_SIZE, TILE_SIZE);
                            ctx.fillStyle = '#475569';
                            ctx.fillRect(rx + 6, ry + 6, 10, 10);
                        }
                    }
                }
            }

            entities.forEach(ent => {
                if (ent.type === 'slime') {
                    ctx.fillStyle = ent.color;
                    ctx.beginPath();
                    ctx.roundRect(ent.x, ent.y + 6, ent.width, ent.height - 6, [8, 8, 4, 4]);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    let eyeOffset = hero.x > ent.x ? 4 : 12;
                    ctx.fillRect(ent.x + eyeOffset, ent.y + 8, 5, 6);
                    ctx.fillStyle = '#000';
                    ctx.fillRect(ent.x + eyeOffset + (hero.x > ent.x ? 2 : 1), ent.y + 10, 2, 3);
                } else if (ent.type === 'chest') {
                    ctx.fillStyle = '#d97706';
                    ctx.fillRect(ent.x, ent.y + 6, ent.width, ent.height - 6);
                    ctx.fillStyle = '#fbbf24';
                    ctx.fillRect(ent.x + 8, ent.y + 12, 10, 8);
                    ctx.fillStyle = '#000';
                    ctx.fillRect(ent.x + 11, ent.y + 14, 4, 4);
                }
            });

            for (let id in remotePlayers) {
                let rp = remotePlayers[id];
                let rpx = Math.floor(rp.x);
                let rpy = Math.floor(rp.y);

                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(rpx - 10, rpy - 22, (rp.name.length * 8) + 8, 16);
                ctx.fillStyle = '#38bdf8';
                ctx.font = 'bold 11px "Courier New", monospace';
                ctx.fillText(rp.name, rpx - 6, rpy - 10);

                ctx.fillStyle = '#ec4899';
                ctx.fillRect(rpx + 4, rpy + 8, 14, 16);
                ctx.fillStyle = '#fbcfe8';
                ctx.fillRect(rpx + 3, rpy, 16, 10);
            }

            let hx = Math.floor(hero.x);
            let hy = Math.floor(hero.y);

            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(hx - 10, hy - 22, (hero.name.length * 8) + 8, 16);
            ctx.fillStyle = '#4ade80';
            ctx.font = 'bold 11px "Courier New", monospace';
            ctx.fillText(hero.name, hx - 6, hy - 10);

            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(hx + 4, hy + 8, 14, 16);

            ctx.fillStyle = '#fde047';
            ctx.fillRect(hx + 3, hy, 16, 10);
            ctx.fillStyle = '#94a3b8';
            let visorX = hero.facing === 'right' ? hx + 11 : hx + 4;
            ctx.fillRect(visorX, hy + 3, 5, 4);

            ctx.fillStyle = '#1e293b';
            if (hero.frame === 1) {
                ctx.fillRect(hx + 4, hy + 24, 5, 6);
                ctx.fillRect(hx + 13, hy + 22, 5, 8);
            } else if (hero.frame === 3) {
                ctx.fillRect(hx + 4, hy + 22, 5, 8);
                ctx.fillRect(hx + 13, hy + 24, 5, 6);
            } else {
                ctx.fillRect(hx + 5, hy + 24, 4, 6);
                ctx.fillRect(hx + 13, hy + 24, 4, 6);
            }

            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.font = 'bold 14px "Courier New", monospace';
                ctx.fillText(p.text, p.x, p.y);
            });

            ctx.restore();
        }

        function gameLoop() {
            updateGame();
            drawGame();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
