<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arena Survival - Gold & Auto-Shoot</title>
  <style>
    body {
      margin: 0;
      background: #121212;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    canvas {
      display: block;
    }
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      padding: 20px;
      box-sizing: border-box;
    }
    .hud-panel {
      background: rgba(0, 0, 0, 0.75);
      border: 2px solid #444;
      border-radius: 8px;
      padding: 10px 18px;
      display: inline-block;
      font-size: 18px;
      font-weight: bold;
    }
    #gold-display {
      color: #f1c40f;
    }
    #xp-bar-container {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 50%;
      height: 20px;
      background: rgba(0,0,0,0.8);
      border: 2px solid #555;
      border-radius: 10px;
      overflow: hidden;
    }
    #xp-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3498db, #2ecc71);
      transition: width 0.1s;
    }
    #upgrade-modal, #game-over {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
    }
    .cards-container {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }
    .upgrade-card {
      background: #222;
      border: 3px solid #555;
      border-radius: 10px;
      padding: 25px;
      width: 200px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .upgrade-card:hover {
      background: #333;
      border-color: #3498db;
      transform: translateY(-5px);
    }
    button {
      padding: 15px 30px;
      font-size: 20px;
      font-weight: bold;
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover { background: #c0392b; }
  </style>
</head>
<body>

  <div id="ui-layer">
    <div class="hud-panel" id="hp-box">HP: 100 / 100</div>
    <div class="hud-panel" id="lvl-box" style="margin-left: 10px;">Level: 1</div>
    <div class="hud-panel" style="margin-left: 10px;">Gold: <span id="gold-display">0</span></div>
    
    <div id="xp-bar-container">
      <div id="xp-bar"></div>
    </div>

    <div id="upgrade-modal">
      <h1 style="color: #f1c40f; font-size: 40px; margin: 0;">LEVEL UP!</h1>
      <p style="color: #ccc; margin-top: 5px;">Choose an upgrade:</p>
      <div class="cards-container" id="cards-box"></div>
    </div>

    <div id="game-over">
      <h1 style="color: #e74c3c; font-size: 60px; margin: 0;">DEFEATED</h1>
      <p id="final-stats" style="font-size: 20px; margin: 10px 0;">You reached Level 1</p>
      <button onclick="location.reload()">Play Again</button>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// --- GAME SETTINGS & STATE ---
const WORLD_SIZE = 2500;
let keys = {};

let player = {
  x: WORLD_SIZE / 2,
  y: WORLD_SIZE / 2,
  size: 24,
  speed: 4.5,
  hp: 100,
  maxHp: 100,
  damage: 25,
  cooldown: 0,
  maxCooldown: 25,
  range: 400,
  level: 1,
  xp: 0,
  xpNeeded: 50,
  gold: 0
};

let enemies = [];
let gems = [];
let coins = [];
let projectiles = [];
let floatingTexts = [];
let spawnTimer = 0;
let gameOver = false;
let gamePaused = false;

// --- INPUT HANDLERS ---
window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

function addFloatingText(x, y, text, color) {
  floatingTexts.push({ x, y, text, color, life: 30 });
}

// --- UPGRADE SYSTEM ---
const UPGRADE_POOL = [
  { title: "Max Health", desc: "+30 Max HP & Heal", apply: () => { player.maxHp += 30; player.hp = player.maxHp; } },
  { title: "Sharpened", desc: "+12 Attack Damage", apply: () => { player.damage += 12; } },
  { title: "Agility", desc: "+0.8 Move Speed", apply: () => { player.speed += 0.8; } },
  { title: "Rapid Fire", desc: "Shoot Faster", apply: () => { player.maxCooldown = Math.max(8, player.maxCooldown - 4); } },
  { title: "Radar Scope", desc: "+100 Targeting Range", apply: () => { player.range += 100; } }
];

function triggerLevelUp() {
  gamePaused = true;
  document.getElementById("upgrade-modal").style.display = "flex";
  
  let container = document.getElementById("cards-box");
  container.innerHTML = "";

  let shuffled = [...UPGRADE_POOL].sort(() => 0.5 - Math.random());
  let choices = shuffled.slice(0, 3);

  choices.forEach(choice => {
    let card = document.createElement("div");
    card.className = "upgrade-card";
    card.innerHTML = `<h3 style="margin-top:0; color:#3498db;">${choice.title}</h3><p style="font-size:14px; color:#ccc;">${choice.desc}</p>`;
    card.onclick = () => {
      choice.apply();
      document.getElementById("upgrade-modal").style.display = "none";
      gamePaused = false;
    };
    container.appendChild(card);
  });
}

// --- UPDATE LOOP ---
function update() {
  if (gameOver || gamePaused) return;

  // 1. Move Player (WASD)
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup']) dy -= 1;
  if (keys['s'] || keys['arrowdown']) dy += 1;
  if (keys['a'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;

  if (dx !== 0 && dy !== 0) {
    dx *= 0.7071;
    dy *= 0.7071;
  }
  player.x += dx * player.speed;
  player.y += dy * player.speed;

  player.x = Math.max(player.size, Math.min(WORLD_SIZE - player.size, player.x));
  player.y = Math.max(player.size, Math.min(WORLD_SIZE - player.size, player.y));

  // 2. Player Auto-Shooting
  if (player.cooldown > 0) {
    player.cooldown--;
  } else if (enemies.length > 0) {
    let closestEnemy = null;
    let closestDist = player.range;

    for (let e of enemies) {
      let dist = Math.hypot(player.x - e.x, player.y - e.y);
      if (dist < closestDist) {
        closestDist = dist;
        closestEnemy = e;
      }
    }

    if (closestEnemy) {
      player.cooldown = player.maxCooldown;
      let angle = Math.atan2(closestEnemy.y - player.y, closestEnemy.x - player.x);
      
      projectiles.push({
        x: player.x,
        y: player.y,
        vx: Math.cos(angle) * 10,
        vy: Math.sin(angle) * 10,
        damage: player.damage,
        life: 100
      });
    }
  }

  // 3. Enemy Spawning Loop
  spawnTimer--;
  if (spawnTimer <= 0) {
    spawnTimer = Math.max(15, 45 - (player.level * 2));
    
    let angle = Math.random() * Math.PI * 2;
    let dist = Math.max(canvas.width, canvas.height) / 2 + 100;
    let ex = player.x + Math.cos(angle) * dist;
    let ey = player.y + Math.sin(angle) * dist;

    let rand = Math.random();
    let tierData;

    if (rand < 0.60 || player.level < 2) {
      tierData = { color: "#e74c3c", size: 14, hp: 20, speed: 3.2, damage: 8, xpValue: 10, goldValue: 2 };
    } else if (rand < 0.88 || player.level < 4) {
      tierData = { color: "#9b59b6", size: 28, hp: 80, speed: 1.6, damage: 25, xpValue: 35, goldValue: 5 };
    } else {
      tierData = { color: "#f1c40f", size: 36, hp: 200, speed: 2.2, damage: 40, xpValue: 100, goldValue: 15 };
    }

    enemies.push({
      x: ex,
      y: ey,
      hp: tierData.hp,
      maxHp: tierData.hp,
      speed: tierData.speed,
      size: tierData.size,
      damage: tierData.damage,
      color: tierData.color,
      xpValue: tierData.xpValue,
      goldValue: tierData.goldValue
    });
  }

  // 4. Update Enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    let e = enemies[i];
    let angle = Math.atan2(player.y - e.y, player.x - e.x);
    e.x += Math.cos(angle) * e.speed;
    e.y += Math.sin(angle) * e.speed;

    let distToPlayer = Math.hypot(player.x - e.x, player.y - e.y);
    if (distToPlayer < player.size + e.size) {
      player.hp -= e.damage / 30;
      if (player.hp <= 0) {
        player.hp = 0;
        gameOver = true;
        document.getElementById("final-stats").innerText = `You reached Level ${player.level}`;
        document.getElementById("game-over").style.display = "flex";
      }
    }
  }

  // 5. Update Projectiles
  for (let i = projectiles.length - 1; i >= 0; i--) {
    let p = projectiles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;

    let hit = false;
    for (let j = enemies.length - 1; j >= 0; j--) {
      let e = enemies[j];
      let dist = Math.hypot(p.x - e.x, p.y - e.y);
      if (dist < e.size + 4) {
        e.hp -= p.damage;
        addFloatingText(e.x, e.y, `-${Math.floor(p.damage)}`, "#fff");
        hit = true;
        
        if (e.hp <= 0) {
          gems.push({ x: e.x, y: e.y, val: e.xpValue });
          coins.push({ x: e.x, y: e.y, val: e.goldValue });
          enemies.splice(j, 1);
        }
        break;
      }
    }

    if (hit || p.life <= 0) {
      projectiles.splice(i, 1);
    }
  }

  // 6. Update XP Gems
  for (let i = gems.length - 1; i >= 0; i--) {
    let g = gems[i];
    let dist = Math.hypot(player.x - g.x, player.y - g.y);

    if (dist < 180) {
      let angle = Math.atan2(player.y - g.y, player.x - g.x);
      g.x += Math.cos(angle) * 6;
      g.y += Math.sin(angle) * 6;
    }

    if (dist < player.size + 8) {
      player.xp += g.val;
      gems.splice(i, 1);

      if (player.xp >= player.xpNeeded) {
        player.xp -= player.xpNeeded;
        player.level++;
        player.xpNeeded = Math.floor(player.xpNeeded * 1.4);
        triggerLevelUp();
      }
    }
  }

  // 7. Update Gold Coins
  for (let i = coins.length - 1; i >= 0; i--) {
    let c = coins[i];
    let dist = Math.hypot(player.x - c.x, player.y - c.y);

    // Coins have a slightly wider magnet range
    if (dist < 200) {
      let angle = Math.atan2(player.y - c.y, player.x - c.x);
      c.x += Math.cos(angle) * 7;
      c.y += Math.sin(angle) * 7;
    }

    if (dist < player.size + 8) {
      player.gold += c.val;
      addFloatingText(c.x, c.y - 10, `+${c.val}g`, "#f1c40f");
      coins.splice(i, 1);
    }
  }

  // 8. Update Floating Text
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    floatingTexts[i].life--;
    floatingTexts[i].y -= 0.6;
    if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
  }

  // Update HUD
  document.getElementById("hp-box").innerText = `HP: ${Math.ceil(player.hp)} / ${player.maxHp}`;
  document.getElementById("lvl-box").innerText = `Level: ${player.level}`;
  document.getElementById("gold-display").innerText = player.gold;
  let xpPercent = (player.xp / player.xpNeeded) * 100;
  document.getElementById("xp-bar").style.width = `${xpPercent}%`;
}

// --- RENDER LOOP ---
function draw() {
  ctx.fillStyle = "#161616";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  let camX = player.x - canvas.width / 2;
  let camY = player.y - canvas.height / 2;
  ctx.translate(-camX, -camY);

  // Draw World Grid
  ctx.strokeStyle = "#222";
  ctx.lineWidth = 2;
  for (let i = 0; i <= WORLD_SIZE; i += 200) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, WORLD_SIZE); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(WORLD_SIZE, i); ctx.stroke();
  }
  ctx.strokeStyle = "#e74c3c";
  ctx.lineWidth = 6;
  ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);

  // Draw Range Circle
  ctx.strokeStyle = "rgba(52, 152, 219, 0.15)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.range, 0, Math.PI * 2);
  ctx.stroke();

  // Draw XP Gems
  gems.forEach(g => {
    ctx.fillStyle = g.val > 50 ? "#f1c40f" : "#3498db";
    ctx.beginPath();
    ctx.arc(g.x, g.y, g.val > 50 ? 8 : 5, 0, Math.PI * 2);
    ctx.fill();
  });

  // Draw Gold Coins
  coins.forEach(c => {
    ctx.fillStyle = "#f1c40f";
    ctx.beginPath();
    ctx.arc(c.x, c.y, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#d4ac0d";
    ctx.lineWidth = 2;
    ctx.stroke();
  });

  // Draw Enemies
  enemies.forEach(e => {
    ctx.fillStyle = e.color;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#111";
    ctx.lineWidth = 3;
    ctx.stroke();

    // Health bar
    ctx.fillStyle = "#222";
    ctx.fillRect(e.x - 18, e.y - e.size - 12, 36, 5);
    ctx.fillStyle = "#2ecc71";
    ctx.fillRect(e.x - 18, e.y - e.size - 12, 36 * (e.hp / e.maxHp), 5);
  });

  // Draw Projectiles
  projectiles.forEach(p => {
    ctx.fillStyle = "#f1c40f";
    ctx.beginPath();
    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
    ctx.fill();
  });

  // Draw Player
  ctx.fillStyle = "#3498db";
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#2980b9";
  ctx.lineWidth = 4;
  ctx.stroke();

  // Draw Floating Text
  floatingTexts.forEach(ft => {
    ctx.fillStyle = ft.color;
    ctx.globalAlpha = ft.life / 30;
    ctx.font = "bold 15px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.globalAlpha = 1.0;
  });

  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
