<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stationary Turret Defense</title>
  <style>
    body {
      margin: 0;
      background: #121212;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    canvas {
      display: block;
    }
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      padding: 20px;
      box-sizing: border-box;
    }
    .hud-panel {
      background: rgba(0, 0, 0, 0.75);
      border: 2px solid #444;
      border-radius: 8px;
      padding: 10px 18px;
      display: inline-block;
      font-size: 18px;
      font-weight: bold;
      pointer-events: auto;
    }
    #gold-display {
      color: #f1c40f;
    }
    #shop-btn {
      background: #f1c40f;
      color: #111;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 15px;
      transition: 0.2s;
    }
    #shop-btn:hover { background: #f39c12; }

    /* Upgrade Shop Modal */
    #shop-modal {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
    }
    .shop-container {
      background: #222;
      border: 3px solid #444;
      border-radius: 12px;
      padding: 30px;
      width: 450px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
    }
    .shop-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #2a2a2a;
      margin: 10px 0;
      padding: 12px 20px;
      border-radius: 8px;
      border: 2px solid #444;
    }
    .shop-item button {
      background: #2ecc71;
      color: white;
      border: none;
      padding: 8px 15px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
    }
    .shop-item button:hover { background: #27ae60; }
    .close-btn {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 20px;
    }
    .close-btn:hover { background: #c0392b; }

    #game-over {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
    }
    button.retry {
      padding: 15px 30px;
      font-size: 20px;
      font-weight: bold;
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
    }
    button.retry:hover { background: #c0392b; }
  </style>
</head>
<body>

  <div id="ui-layer">
    <div class="hud-panel" id="hp-box">HP: 100 / 100</div>
    <div class="hud-panel" style="margin-left: 10px;">Gold: <span id="gold-display">0</span></div>
    <button class="hud-panel" id="shop-btn" onclick="toggleShop(true)">Upgrade Shop</button>
    
    <!-- Upgrade Shop Overlay -->
    <div id="shop-modal">
      <div class="shop-container">
        <h2 style="color: #f1c40f; margin-top: 0;">TURRET UPGRADE SHOP</h2>
        <div class="shop-item">
          <div style="text-align: left;">
            <strong>Damage Boost</strong><br><span style="font-size: 13px; color: #aaa;" id="dmg-desc">+10 Damage</span>
          </div>
          <button onclick="buyUpgrade('damage')">Cost: <span id="cost-damage">50</span>g</button>
        </div>
        <div class="shop-item">
          <div style="text-align: left;">
            <strong>Rapid Fire</strong><br><span style="font-size: 13px; color: #aaa;" id="fire-desc">Shoot Faster</span>
          </div>
          <button onclick="buyUpgrade('fireRate')">Cost: <span id="cost-fireRate">75</span>g</button>
        </div>
        <div class="shop-item">
          <div style="text-align: left;">
            <strong>Radar Range</strong><br><span style="font-size: 13px; color: #aaa;" id="range-desc">+75 Range</span>
          </div>
          <button onclick="buyUpgrade('range')">Cost: <span id="cost-range">60</span>g</button>
        </div>
        <div class="shop-item">
          <div style="text-align: left;">
            <strong>Repair Base</strong><br><span style="font-size: 13px; color: #aaa;">Restore 30 HP</span>
          </div>
          <button onclick="buyUpgrade('heal')">Cost: <span id="cost-heal">40</span>g</button>
        </div>
        <button class="close-btn" onclick="toggleShop(false)">Resume Game</button>
      </div>
    </div>

    <div id="game-over">
      <h1 style="color: #e74c3c; font-size: 60px; margin: 0;">BASE DESTROYED</h1>
      <p id="final-stats" style="font-size: 20px; margin: 10px 0;">You survived valiantly</p>
      <button class="retry" onclick="location.reload()">Play Again</button>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// --- GAME SETTINGS & STATE ---
let player = {
  x: window.innerWidth / 2,
  y: window.innerHeight / 2,
  size: 28,
  hp: 100,
  maxHp: 100,
  damage: 25,
  cooldown: 0,
  maxCooldown: 25,
  range: 350,
  gold: 0
};

let upgradeCosts = {
  damage: 50,
  fireRate: 75,
  range: 60,
  heal: 40
};

let enemies = [];
let projectiles = [];
let floatingTexts = [];
let spawnTimer = 0;
let wave = 1;
let gameOver = false;
let shopOpen = false;

function addFloatingText(x, y, text, color) {
  floatingTexts.push({ x, y, text, color, life: 30 });
}

// --- SHOP LOGIC ---
function toggleShop(open) {
  shopOpen = open;
  document.getElementById("shop-modal").style.display = open ? "flex" : "none";
}

function buyUpgrade(type) {
  let cost = upgradeCosts[type];
  if (player.gold >= cost) {
    player.gold -= cost;
    
    if (type === 'damage') {
      player.damage += 12;
      upgradeCosts.damage = Math.floor(upgradeCosts.damage * 1.5);
      document.getElementById("cost-damage").innerText = upgradeCosts.damage;
    } else if (type === 'fireRate') {
      player.maxCooldown = Math.max(6, player.maxCooldown - 4);
      upgradeCosts.fireRate = Math.floor(upgradeCosts.fireRate * 1.6);
      document.getElementById("cost-fireRate").innerText = upgradeCosts.fireRate;
    } else if (type === 'range') {
      player.range += 75;
      upgradeCosts.range = Math.floor(upgradeCosts.range * 1.4);
      document.getElementById("cost-range").innerText = upgradeCosts.range;
    } else if (type === 'heal') {
      player.hp = Math.min(player.maxHp, player.hp + 30);
      upgradeCosts.heal = Math.floor(upgradeCosts.heal * 1.3);
      document.getElementById("cost-heal").innerText = upgradeCosts.heal;
    }
  } else {
    addFloatingText(player.x, player.y - 40, "Not enough Gold!", "#e74c3c");
  }
}

// --- UPDATE LOOP ---
function update() {
  if (gameOver || shopOpen) return;

  // Keep player completely stationary at the center of the screen/world
  player.x = window.innerWidth / 2;
  player.y = window.innerHeight / 2;

  // 1. Auto-Shooting (Closest enemy in range)
  if (player.cooldown > 0) {
    player.cooldown--;
  } else if (enemies.length > 0) {
    let closestEnemy = null;
    let closestDist = player.range;

    for (let e of enemies) {
      let dist = Math.hypot(player.x - e.x, player.y - e.y);
      if (dist < closestDist) {
        closestDist = dist;
        closestEnemy = e;
      }
    }

    if (closestEnemy) {
      player.cooldown = player.maxCooldown;
      let angle = Math.atan2(closestEnemy.y - player.y, closestEnemy.x - player.x);
      
      projectiles.push({
        x: player.x,
        y: player.y,
        vx: Math.cos(angle) * 11,
        vy: Math.sin(angle) * 11,
        damage: player.damage,
        life: 100
      });
    }
  }

  // 2. Enemy Spawning Loop
  spawnTimer--;
  if (spawnTimer <= 0) {
    spawnTimer = Math.max(15, 40 - (wave * 2));
    
    let angle = Math.random() * Math.PI * 2;
    let dist = Math.max(window.innerWidth, window.innerHeight) / 2 + 100;
    let ex = player.x + Math.cos(angle) * dist;
    let ey = player.y + Math.sin(angle) * dist;

    let rand = Math.random();
    let tierData;

    if (rand < 0.60) {
      tierData = { color: "#e74c3c", size: 14, hp: 25, speed: 2.8, damage: 6, goldValue: 3 };
    } else if (rand < 0.88) {
      tierData = { color: "#9b59b6", size: 26, hp: 90, speed: 1.5, damage: 18, goldValue: 8 };
    } else {
      tierData = { color: "#f1c40f", size: 34, hp: 220, speed: 2.0, damage: 30, goldValue: 20 };
    }

    enemies.push({
      x: ex,
      y: ey,
      hp: tierData.hp,
      maxHp: tierData.hp,
      speed: tierData.speed,
      size: tierData.size,
      damage: tierData.damage,
      color: tierData.color,
      goldValue: tierData.goldValue
    });
  }

  // 3. Update Enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    let e = enemies[i];
    let angle = Math.atan2(player.y - e.y, player.x - e.x);
    e.x += Math.cos(angle) * e.speed;
    e.y += Math.sin(angle) * e.speed;

    let distToPlayer = Math.hypot(player.x - e.x, player.y - e.y);
    if (distToPlayer < player.size + e.size) {
      player.hp -= e.damage / 30;
      if (player.hp <= 0) {
        player.hp = 0;
        gameOver = true;
        document.getElementById("final-stats").innerText = `Your base fell to the swarm!`;
        document.getElementById("game-over").style.display = "flex";
      }
    }
  }

  // 4. Update Projectiles
  for (let i = projectiles.length - 1; i >= 0; i--) {
    let p = projectiles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;

    let hit = false;
    for (let j = enemies.length - 1; j >= 0; j--) {
      let e = enemies[j];
      let dist = Math.hypot(p.x - e.x, p.y - e.y);
      if (dist < e.size + 4) {
        e.hp -= p.damage;
        addFloatingText(e.x, e.y, `-${Math.floor(p.damage)}`, "#fff");
        hit = true;
        
        if (e.hp <= 0) {
          player.gold += e.goldValue;
          enemies.splice(j, 1);
        }
        break;
      }
    }

    if (hit || p.life <= 0) {
      projectiles.splice(i, 1);
    }
  }

  // 5. Update Floating Text
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    floatingTexts[i].life--;
    floatingTexts[i].y -= 0.6;
    if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
  }

  // Update HUD
  document.getElementById("hp-box").innerText = `Base HP: ${Math.ceil(player.hp)} / ${player.maxHp}`;
  document.getElementById("gold-display").innerText = player.gold;
}

// --- RENDER LOOP ---
function draw() {
  ctx.fillStyle = "#161616";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw Background Grid Pattern
  ctx.strokeStyle = "#222";
  ctx.lineWidth = 2;
  let gridSize = 100;
  let offsetX = (canvas.width / 2) % gridSize;
  let offsetY = (canvas.height / 2) % gridSize;
  for (let x = offsetX; x < canvas.width; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = offsetY; y < canvas.height; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }

  // Draw Range Circle around stationary base
  ctx.strokeStyle = "rgba(52, 152, 219, 0.15)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.range, 0, Math.PI * 2);
  ctx.stroke();

  // Draw Enemies
  enemies.forEach(e => {
    ctx.fillStyle = e.color;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#111";
    ctx.lineWidth = 3;
    ctx.stroke();

    // Health bar
    ctx.fillStyle = "#222";
    ctx.fillRect(e.x - 18, e.y - e.size - 12, 36, 5);
    ctx.fillStyle = "#2ecc71";
    ctx.fillRect(e.x - 18, e.y - e.size - 12, 36 * (e.hp / e.maxHp), 5);
  });

  // Draw Projectiles
  projectiles.forEach(p => {
    ctx.fillStyle = "#f1c40f";
    ctx.beginPath();
    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
    ctx.fill();
  });

  // Draw Stationary Turret Base (Player)
  ctx.fillStyle = "#3498db";
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#2980b9";
  ctx.lineWidth = 4;
  ctx.stroke();

  // Inner core visual
  ctx.fillStyle = "#1abc9c";
  ctx.beginPath();
  ctx.arc(player.x, player.y, 10, 0, Math.PI * 2);
  ctx.fill();

  // Draw Floating Text
  floatingTexts.forEach(ft => {
    ctx.fillStyle = ft.color;
    ctx.globalAlpha = ft.life / 30;
    ctx.font = "bold 15px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.globalAlpha = 1.0;
  });
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
