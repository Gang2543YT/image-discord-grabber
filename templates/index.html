<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPG Arena IO - Ranged Update</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #222;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* HUD */
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      pointer-events: none;
      z-index: 5;
    }
    
    .stat-box {
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid #555;
      padding: 10px 15px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    /* XP Bar */
    #xp-container {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 25px;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #aaa;
      border-radius: 12px;
      z-index: 5;
      overflow: hidden;
    }
    #xp-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%);
      transition: width 0.2s ease-out;
    }
    #level-indicator {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 20px;
      font-weight: bold;
      text-shadow: 2px 2px 0 #000;
      color: #00d2ff;
    }

    /* Upgrade Modal */
    #upgrade-modal {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }

    #upgrade-modal h1 {
      font-size: 48px;
      color: #ffcc00;
      margin-bottom: 30px;
      text-shadow: 0 0 20px #ffcc00;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }

    .cards-container {
      display: flex;
      gap: 20px;
    }

    .upgrade-card {
      background: #333;
      border: 3px solid #555;
      border-radius: 12px;
      width: 220px;
      padding: 30px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }
    .upgrade-card:hover {
      background: #444;
      border-color: #00d2ff;
      transform: translateY(-10px);
    }
    .upgrade-card h2 { font-size: 24px; margin-bottom: 10px; color: #fff; }
    .upgrade-card p { font-size: 16px; color: #ccc; }

    /* Death Screen */
    #death-screen {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(150, 0, 0, 0.8);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 30;
    }
    #death-screen h1 { font-size: 72px; margin-bottom: 20px; text-shadow: 4px 4px 0 #000; }
    .btn {
      padding: 15px 30px;
      font-size: 24px;
      font-weight: bold;
      background: #222;
      color: #fff;
      border: 3px solid #fff;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn:hover { background: #444; }

  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div class="stat-box" id="hp-box">HP: 100 / 100</div>
    <div class="stat-box" id="stats-box">ATK: 25 | SPD: 5</div>
  </div>

  <div id="xp-container">
    <div id="level-indicator">Level 1</div>
    <div id="xp-bar"></div>
  </div>

  <div id="upgrade-modal">
    <h1>Level Up!</h1>
    <div class="cards-container" id="cards-container">
      <!-- Cards generated via JS -->
    </div>
  </div>

  <div id="death-screen">
    <h1>Defeated</h1>
    <p style="font-size: 24px; margin-bottom: 30px;">You reached <span id="final-level">Level 1</span></p>
    <button class="btn" onclick="location.reload()">Play Again</button>
  </div>

<script>
// ==========================================
// 1. ENGINE SETUP & ARENA CONSTANTS
// ==========================================
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const ARENA_SIZE = 4000;
const TILE_SIZE = 100;

// ==========================================
// 2. GAME STATE & ENTITIES
// ==========================================
let gameActive = true;
let isPaused = false;
let keys = {};

let player = {
  x: ARENA_SIZE / 2,
  y: ARENA_SIZE / 2,
  size: 30,
  hp: 100,
  maxHp: 100,
  speed: 5,
  damage: 25,
  attackRadius: 120,
  attackCooldown: 0,
  maxCooldown: 30, // Frames between auto-attacks
  level: 1,
  xp: 0,
  xpNeeded: 100,
  color: "#4facfe"
};

let enemies = [];
let gems = [];
let projectiles = []; // Stores Skeleton Arrows
let damageTexts = [];
let slashes = [];

// ==========================================
// 3. SPAWNERS & CLASSES
// ==========================================
class Enemy {
  constructor(x, y, type) {
    this.x = x;
    this.y = y;
    this.type = type;
    
    // Scale enemies slightly as player levels up
    const scale = 1 + (player.level * 0.1);

    if (type === "zombie") {
      this.size = 30; this.hp = 40 * scale; this.maxHp = 40 * scale; 
      this.speed = 2.5; this.damage = 15 * scale; this.color = "#4caf50"; // Green Circle
      this.xpValue = 20;
    } else if (type === "skeleton") {
      this.size = 25; this.hp = 30 * scale; this.maxHp = 30 * scale; 
      this.speed = 2.0; this.damage = 10 * scale; this.color = "#ffffff"; // White Circle
      this.xpValue = 35; 
      this.attackCooldown = 0;
      this.range = 350; // Distance to shoot from
    } else if (type === "brute") {
      this.size = 50; this.hp = 200 * scale; this.maxHp = 200 * scale; 
      this.speed = 1.5; this.damage = 35 * scale; this.color = "#1b5e20"; // Dark Green
      this.xpValue = 100;
    }
  }
}

function spawnEnemy() {
  if (enemies.length > 100) return; // Cap

  // Spawn just outside viewport
  const angle = Math.random() * Math.PI * 2;
  const dist = Math.max(canvas.width, canvas.height) / 2 + 100;
  const x = player.x + Math.cos(angle) * dist;
  const y = player.y + Math.sin(angle) * dist;

  // Keep inside arena bounds
  if (x < 0 || x > ARENA_SIZE || y < 0 || y > ARENA_SIZE) return;

  const rand = Math.random();
  let type = "zombie";
  if (rand > 0.6 && player.level > 2) type = "skeleton"; // Start spawning skeletons at level 3
  if (rand > 0.9 && player.level > 5) type = "brute";    // Giant zombies at level 6

  enemies.push(new Enemy(x, y, type));
}

// ==========================================
// 4. COMBAT & UPGRADES (RPG MECHANICS)
// ==========================================
function autoAttack() {
  if (player.attackCooldown > 0) {
    player.attackCooldown--;
    return;
  }

  // Find nearest enemy
  let nearest = null;
  let minDist = player.attackRadius;

  enemies.forEach(enemy => {
    let dist = Math.hypot(enemy.x - player.x, enemy.y - player.y);
    if (dist < minDist) { minDist = dist; nearest = enemy; }
  });

  if (nearest) {
    // Attack nearest
    nearest.hp -= player.damage;
    player.attackCooldown = player.maxCooldown;

    // Visuals
    damageTexts.push({ x: nearest.x, y: nearest.y - 20, text: player.damage, life: 30 });
    slashes.push({ x: nearest.x, y: nearest.y, life: 10 });

    if (nearest.hp <= 0) {
      // Drop XP Gem
      gems.push({ x: nearest.x, y: nearest.y, value: nearest.xpValue });
      enemies.splice(enemies.indexOf(nearest), 1);
    }
  }
}

const UPGRADE_POOL = [
  { title: "Vitality", desc: "+25 Max Health", apply: () => { player.maxHp += 25; player.hp += 25; } },
  { title: "Sharpened Blade", desc: "+10 Damage", apply: () => { player.damage += 10; } },
  { title: "Agility", desc: "+1 Move Speed", apply: () => { player.speed += 1; } },
  { title: "Haste", desc: "-15% Attack Cooldown", apply: () => { player.maxCooldown = Math.max(5, Math.floor(player.maxCooldown * 0.85)); } },
  { title: "Reach", desc: "+30 Attack Range", apply: () => { player.attackRadius += 30; } }
];

function triggerLevelUp() {
  isPaused = true;
  document.getElementById("upgrade-modal").style.display = "flex";
  
  const container = document.getElementById("cards-container");
  container.innerHTML = "";

  // Pick 3 random distinct upgrades
  let shuffled = UPGRADE_POOL.sort(() => 0.5 - Math.random());
  let choices = shuffled.slice(0, 3);

  choices.forEach(choice => {
    let card = document.createElement("div");
    card.className = "upgrade-card";
    card.innerHTML = `<h2>${choice.title}</h2><p>${choice.desc}</p>`;
    card.onclick = () => {
      choice.apply();
      resumeGame();
    };
    container.appendChild(card);
  });
}

function resumeGame() {
  document.getElementById("upgrade-modal").style.display = "none";
  updateHUD();
  isPaused = false;
}

// ==========================================
// 5. MAIN GAME LOOP
// ==========================================
function update() {
  if (!gameActive || isPaused) return;

  // Player Movement
  if (keys['w'] || keys['ArrowUp']) player.y -= player.speed;
  if (keys['s'] || keys['ArrowDown']) player.y += player.speed;
  if (keys['a'] || keys['ArrowLeft']) player.x -= player.speed;
  if (keys['d'] || keys['ArrowRight']) player.x += player.speed;

  // Clamp to Arena
  player.x = Math.max(player.size, Math.min(ARENA_SIZE - player.size, player.x));
  player.y = Math.max(player.size, Math.min(ARENA_SIZE - player.size, player.y));

  autoAttack();

  // Update Enemies
  enemies.forEach(enemy => {
    let angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
    let dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);

    if (enemy.type === "skeleton") {
      // Skeleton Ranged AI
      if (dist > enemy.range * 0.8) {
        // Move closer if too far
        enemy.x += Math.cos(angle) * enemy.speed;
        enemy.y += Math.sin(angle) * enemy.speed;
      } else if (dist < enemy.range * 0.4) {
        // Back away if player gets too close
        enemy.x -= Math.cos(angle) * (enemy.speed * 0.5);
        enemy.y -= Math.sin(angle) * (enemy.speed * 0.5);
      }

      // Shoot Arrow
      if (enemy.attackCooldown > 0) enemy.attackCooldown--;
      if (enemy.attackCooldown <= 0 && dist <= enemy.range) {
        enemy.attackCooldown = 80; // Cooldown before next shot
        projectiles.push({
          x: enemy.x,
          y: enemy.y,
          vx: Math.cos(angle) * 8, // Arrow speed
          vy: Math.sin(angle) * 8,
          damage: enemy.damage,
          life: 150 // How long the arrow flies before disappearing
        });
      }
    } else {
      // Zombie & Brute Melee AI
      enemy.x += Math.cos(angle) * enemy.speed;
      enemy.y += Math.sin(angle) * enemy.speed;
    }

    // Melee collision with player
    if (dist < player.size/2 + enemy.size/2) {
      if (enemy.type !== "skeleton") {
        player.hp -= enemy.damage / 30; // Consistent melee damage
      } else {
        player.hp -= (enemy.damage * 0.3) / 30; // Skeletons are weak in melee
      }
      if (player.hp <= 0) die();
    }
  });

  // Update Projectiles (Arrows)
  for (let i = projectiles.length - 1; i >= 0; i--) {
    let p = projectiles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;

    // Collision with player
    let dist = Math.hypot(player.x - p.x, player.y - p.y);
    if (dist < player.size/2 + 5) {
      player.hp -= p.damage;
      projectiles.splice(i, 1);
      
      // Floating damage number on player
      damageTexts.push({ x: player.x, y: player.y - 20, text: `-${Math.floor(p.damage)}`, life: 30, color: "#ff3333" });

      if (player.hp <= 0) die();
      continue;
    }

    if (p.life <= 0) {
      projectiles.splice(i, 1);
    }
  }

  // Collect Gems
  for (let i = gems.length - 1; i >= 0; i--) {
    let gem = gems[i];
    let dist = Math.hypot(player.x - gem.x, player.y - gem.y);
    
    // Magnet effect
    if (dist < 150) {
      let angle = Math.atan2(player.y - gem.y, player.x - gem.x);
      gem.x += Math.cos(angle) * 8;
      gem.y += Math.sin(angle) * 8;
    }

    if (dist < player.size) {
      player.xp += gem.value;
      gems.splice(i, 1);
      
      if (player.xp >= player.xpNeeded) {
        player.xp -= player.xpNeeded;
        player.level++;
        player.xpNeeded = Math.floor(player.xpNeeded * 1.5);
        triggerLevelUp();
      }
      updateHUD();
    }
  }

  // Spawner Tick
  if (Math.random() < 0.05) spawnEnemy();

  updateHUD();
}

function draw() {
  if (!gameActive) return;

  // 1. Clear Screen
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 2. Setup Camera Translate
  ctx.save();
  const camX = canvas.width / 2 - player.x;
  const camY = canvas.height / 2 - player.y;
  ctx.translate(camX, camY);

  // 3. Draw Arena Floor & Grid
  ctx.fillStyle = "#2a2a2a";
  ctx.fillRect(0, 0, ARENA_SIZE, ARENA_SIZE);
  
  ctx.strokeStyle = "#333";
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = 0; x <= ARENA_SIZE; x += TILE_SIZE) { ctx.moveTo(x, 0); ctx.lineTo(x, ARENA_SIZE); }
  for (let y = 0; y <= ARENA_SIZE; y += TILE_SIZE) { ctx.moveTo(0, y); ctx.lineTo(ARENA_SIZE, y); }
  ctx.stroke();

  ctx.strokeStyle = "#ff3333";
  ctx.lineWidth = 8;
  ctx.strokeRect(0, 0, ARENA_SIZE, ARENA_SIZE);

  // 4. Draw Gems (XP)
  gems.forEach(gem => {
    ctx.fillStyle = "#00d2ff";
    ctx.beginPath();
    ctx.arc(gem.x, gem.y, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 10;
    ctx.shadowColor = "#00d2ff";
    ctx.shadowBlur = 0;
  });

  // 5. Draw Projectiles (Arrows)
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 3;
  projectiles.forEach(p => {
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    // Draw line backwards based on velocity to make it look like an arrow
    ctx.lineTo(p.x - (p.vx * 2), p.y - (p.vy * 2)); 
    ctx.stroke();
  });

  // 6. Draw Enemies
  enemies.forEach(enemy => {
    ctx.fillStyle = enemy.color;
    ctx.beginPath();
    ctx.arc(enemy.x, enemy.y, enemy.size/2, 0, Math.PI * 2);
    ctx.fill();
    
    // Enemy HP Bar
    ctx.fillStyle = "#000";
    ctx.fillRect(enemy.x - 15, enemy.y - enemy.size/2 - 12, 30, 6);
    ctx.fillStyle = "#ff3333";
    ctx.fillRect(enemy.x - 15, enemy.y - enemy.size/2 - 12, 30 * (enemy.hp / enemy.maxHp), 6);
  });

  // 7. Draw Player & Attack Radius Indicator
  ctx.fillStyle = "rgba(255, 255, 255, 0.05)";
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.attackRadius, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = player.color;
  ctx.shadowBlur = 15;
  ctx.shadowColor = player.color;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.size/2, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // 8. Draw Visual Effects (Slashes & Numbers)
  for (let i = slashes.length - 1; i >= 0; i--) {
    let s = slashes[i];
    ctx.strokeStyle = `rgba(255, 255, 255, ${s.life / 10})`;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(s.x, s.y, 20, 0, Math.PI);
    ctx.stroke();
    s.life--;
    if (s.life <= 0) slashes.splice(i, 1);
  }

  for (let i = damageTexts.length - 1; i >= 0; i--) {
    let t = damageTexts[i];
    ctx.fillStyle = t.color ? t.color : `rgba(255, 200, 0, ${t.life / 30})`;
    ctx.font = "bold 20px Arial";
    ctx.textAlign = "center";
    ctx.fillText(t.text, t.x, t.y);
    t.y -= 1; 
    t.life--;
    if (t.life <= 0) damageTexts.splice(i, 1);
  }

  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// ==========================================
// 6. UI & INPUT MANAGEMENT
// ==========================================
function updateHUD() {
  document.getElementById("hp-box").innerText = `HP: ${Math.ceil(player.hp)} / ${player.maxHp}`;
  document.getElementById("stats-box").innerText = `ATK: ${player.damage} | SPD: ${player.speed}`;
  
  document.getElementById("level-indicator").innerText = `Level ${player.level}`;
  let xpPercent = (player.xp / player.xpNeeded) * 100;
  document.getElementById("xp-bar").style.width = `${xpPercent}%`;
}

function die() {
  gameActive = false;
  document.getElementById("final-level").innerText = `Level ${player.level}`;
  document.getElementById("death-screen").style.display = "flex";
}

window.addEventListener("keydown", e => keys[e.key] = true);
window.addEventListener("keyup", e => keys[e.key] = false);

// Initial spawn
for(let i=0; i<15; i++) spawnEnemy();
requestAnimationFrame(loop);
</script>
</body>
</html>
