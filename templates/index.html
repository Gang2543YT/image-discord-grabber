<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Easy RPG Arena</title>
  <style>
    /* SIMPLIFIED CSS */
    body { margin: 0; overflow: hidden; background: #222; color: #fff; font-family: sans-serif; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    
    #hud { position: absolute; top: 20px; left: 20px; font-size: 18px; font-weight: bold; }
    .panel { background: rgba(0,0,0,0.7); padding: 10px 15px; border: 2px solid #555; border-radius: 8px; margin-bottom: 5px; }
    
    #upgrade-modal, #death-screen {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); flex-direction: column; justify-content: center; align-items: center; pointer-events: auto;
    }
    .card { background: #333; padding: 20px; margin: 10px; border-radius: 8px; cursor: pointer; text-align: center; border: 2px solid #aaa; width: 200px; }
    .card:hover { background: #555; border-color: #fff; }
    button { padding: 15px 30px; font-size: 20px; font-weight: bold; cursor: pointer; border-radius: 8px; }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div id="ui-layer">
    <div id="hud">
      <div class="panel" id="hp-box">HP: 200 / 200</div>
      <div class="panel" id="lvl-box">Level: 1 | XP: 0 / 50</div>
    </div>

    <div id="upgrade-modal">
      <h1 style="color: gold; margin-bottom: 20px;">Level Up! Choose an Upgrade:</h1>
      <div style="display: flex;" id="cards"></div>
    </div>

    <div id="death-screen">
      <h1 style="color: red; font-size: 60px;">Game Over</h1>
      <button onclick="location.reload()">Play Again</button>
    </div>
  </div>

<script>
// --- SIMPLIFIED ENGINE ---
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
window.onresize();

const ARENA = 3000; 
let keys = {};
window.onkeydown = e => keys[e.key] = true;
window.onkeyup = e => keys[e.key] = false;

// --- GAME STATE ---
let playing = true;
let paused = false;

// EASIER PLAYER STATS
let player = {
  x: ARENA / 2, y: ARENA / 2, size: 30, color: "#4facfe",
  hp: 200, maxHp: 200, speed: 7, // Faster, more HP
  damage: 40, attackRange: 150, cooldown: 0, maxCooldown: 20, // Hits harder, hits faster
  level: 1, xp: 0, xpNeeded: 50 // Requires less XP to level up initially
};

let enemies = [];
let gems = [];
let arrows = [];

// --- LOGIC ---
function spawnEnemy() {
  if (enemies.length > 40) return; // Cap at fewer enemies

  let angle = Math.random() * Math.PI * 2;
  let dist = canvas.width / 2 + 100; 
  let ex = player.x + Math.cos(angle) * dist;
  let ey = player.y + Math.sin(angle) * dist;
  if (ex < 0 || ex > ARENA || ey < 0 || ey > ARENA) return;

  let type = "zombie";
  let r = Math.random();
  if (r > 0.7 && player.level > 2) type = "skeleton";

  if (type === "zombie") {
    // Slower, weaker zombies
    enemies.push({ x: ex, y: ey, type, size: 30, hp: 30, speed: 1.5, dmg: 5, color: "#4caf50", xp: 20 });
  } else {
    // Slower skeletons with slower arrows
    enemies.push({ x: ex, y: ey, type, size: 25, hp: 20, speed: 1.0, dmg: 5, color: "#ffffff", xp: 30, shootCd: 0 });
  }
}

function getDist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

function update() {
  if (!playing || paused) return;

  // 1. Move Player
  if (keys['w'] || keys['ArrowUp']) player.y -= player.speed;
  if (keys['s'] || keys['ArrowDown']) player.y += player.speed;
  if (keys['a'] || keys['ArrowLeft']) player.x -= player.speed;
  if (keys['d'] || keys['ArrowRight']) player.x += player.speed;
  
  // Keep in bounds
  player.x = Math.max(0, Math.min(ARENA, player.x));
  player.y = Math.max(0, Math.min(ARENA, player.y));

  // 2. Player Auto-Attack
  if (player.cooldown > 0) player.cooldown--;
  else {
    let target = enemies.find(e => getDist(player, e) < player.attackRange);
    if (target) {
      target.hp -= player.damage;
      player.cooldown = player.maxCooldown;
      if (target.hp <= 0) {
        gems.push({ x: target.x, y: target.y, val: target.xp });
        enemies.splice(enemies.indexOf(target), 1);
      }
    }
  }

  // 3. Enemies & Arrows Update
  enemies.forEach(e => {
    let angle = Math.atan2(player.y - e.y, player.x - e.x);
    let dist = getDist(player, e);

    if (e.type === "zombie") {
      e.x += Math.cos(angle) * e.speed;
      e.y += Math.sin(angle) * e.speed;
    } else if (e.type === "skeleton") {
      // Skeletons try to stay 300 units away
      if (dist > 300) { e.x += Math.cos(angle) * e.speed; e.y += Math.sin(angle) * e.speed; }
      else if (dist < 150) { e.x -= Math.cos(angle) * e.speed; e.y -= Math.sin(angle) * e.speed; }
      
      e.shootCd--;
      if (e.shootCd <= 0 && dist < 350) {
        e.shootCd = 120; // Shoots much slower
        arrows.push({ x: e.x, y: e.y, vx: Math.cos(angle)*4, vy: Math.sin(angle)*4, dmg: e.dmg, life: 150 });
      }
    }

    // Weak melee collision damage
    if (dist < 20) player.hp -= e.dmg / 60; 
  });

  for (let i = arrows.length - 1; i >= 0; i--) {
    let a = arrows[i];
    a.x += a.vx; a.y += a.vy; a.life--;
    if (getDist(player, a) < 20) { player.hp -= a.dmg; arrows.splice(i, 1); }
    else if (a.life <= 0) arrows.splice(i, 1);
  }

  // 4. Collect XP Gems
  for (let i = gems.length - 1; i >= 0; i--) {
    let g = gems[i];
    // Increased pickup radius
    if (getDist(player, g) < player.size + 40) {
      player.xp += g.val;
      gems.splice(i, 1);
      if (player.xp >= player.xpNeeded) levelUp();
    }
  }

  // 5. Check Death & Spawn
  if (player.hp <= 0) { playing = false; document.getElementById("death-screen").style.display = "flex"; }
  if (Math.random() < 0.02) spawnEnemy(); // Reduced spawn rate

  // Update HUD text
  document.getElementById("hp-box").innerText = `HP: ${Math.floor(player.hp)} / ${player.maxHp}`;
  document.getElementById("lvl-box").innerText = `Level: ${player.level} | XP: ${player.xp} / ${player.xpNeeded}`;
}

// --- UPGRADES ---
const upgrades = [
  { text: "Vitality\n+50 Max HP", apply: () => { player.maxHp += 50; player.hp += 50; } },
  { text: "Strength\n+20 Damage", apply: () => player.damage += 20 },
  { text: "Haste\nAttack Faster", apply: () => player.maxCooldown = Math.max(5, player.maxCooldown - 4) }
];

function levelUp() {
  player.level++;
  player.xp -= player.xpNeeded;
  player.xpNeeded = Math.floor(player.xpNeeded * 1.5);
  paused = true;
  
  let html = "";
  upgrades.forEach((u, i) => html += `<div class='card' onclick='pickUp(${i})'><h2>${u.text.replace('\n', '<br>')}</h2></div>`);
  document.getElementById("cards").innerHTML = html;
  document.getElementById("upgrade-modal").style.display = "flex";
}

// Attached to window so the HTML onclick can find it
window.pickUp = function(index) { 
  upgrades[index].apply();
  document.getElementById("upgrade-modal").style.display = "none";
  paused = false;
};

// --- DRAWING ---
function drawCircle(x, y, r, color) {
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
}

function draw() {
  if (!playing) return;
  ctx.fillStyle = "#111"; ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  // Follow player camera
  ctx.translate(canvas.width/2 - player.x, canvas.height/2 - player.y);

  // Draw Grid
  ctx.strokeStyle = "#333";
  for(let i=0; i<=ARENA; i+=200) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, ARENA); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(ARENA, i); ctx.stroke();
  }
  
  // Arena Border
  ctx.strokeStyle = "red"; ctx.lineWidth = 4; ctx.strokeRect(0, 0, ARENA, ARENA); 

  // Draw Entities
  gems.forEach(g => drawCircle(g.x, g.y, 8, "#00d2ff"));
  arrows.forEach(a => drawCircle(a.x, a.y, 5, "#ffeb3b"));
  enemies.forEach(e => drawCircle(e.x, e.y, e.size/2, e.color));
  
  // Draw Player
  drawCircle(player.x, player.y, player.size/2, player.color);
  
  // Draw faint attack range ring
  ctx.strokeStyle = "rgba(255,255,255,0.1)"; 
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(player.x, player.y, player.attackRange, 0, Math.PI*2); ctx.stroke();

  ctx.restore();
}

// Start Game Loop
function loop() { update(); draw(); requestAnimationFrame(loop); }
for(let i=0; i<5; i++) spawnEnemy();
loop();
</script>
</body>
</html>
