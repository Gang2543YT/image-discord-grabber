<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Terraria-Style Sandbox RPG</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a24;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        canvas {
            display: block;
        }
        #ui-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px;
            border-radius: 6px;
            border: 2px solid #444;
            pointer-events: none;
            font-size: 13px;
        }
        #hotbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.75);
            padding: 8px;
            border-radius: 8px;
            border: 2px solid #555;
        }
        .slot {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #666;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 11px;
            position: relative;
        }
        .slot.active {
            border-color: #f39c12;
            background: rgba(243, 156, 18, 0.2);
        }
        .slot span {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 10px;
            color: #f1c40f;
        }
    </style>
</head>
<body>
    <div id="ui-overlay">
        <strong>Controls:</strong> A/D to Move | Space to Jump | W/S or Mouse to Aim<br>
        <strong>Left Click:</strong> Swing Sword / Mine Blocks<br>
        <strong>Hotbar:</strong> 1-5 to select items
    </div>

    <div id="hotbar">
        <div class="slot active" id="slot-0">Sword<span>1</span></div>
        <div class="slot" id="slot-1">Pick<span>2</span></div>
        <div class="slot" id="slot-2">Wood<span>0</span></div>
        <div class="slot" id="slot-3">Stone<span>0</span></div>
        <div class="slot" id="slot-4">Ore<span>0</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- GAME CONFIG & CONSTANTS ---
        const TILE_SIZE = 24;
        const CHUNK_WIDTH = 32;
        const WORLD_HEIGHT = 80;
        const loadedChunks = new Map();

        const COLORS = {
            skyTop: '#151d28',
            skyBottom: '#4a90e2',
            surface: '#43a047',
            grass: '#558b2f',
            dirt: '#795548',
            stone: '#616161',
            copper_ore: '#d84315',
            iron_ore: '#b0bec5',
            wood: '#8d6e63'
        };

        // --- PLAYER & ENTITIES ---
        const player = {
            x: 0,
            y: 45 * TILE_SIZE,
            width: 20,
            height: 38,
            vx: 0,
            vy: 0,
            speed: 4.5,
            jumpForce: -10.5,
            gravity: 0.45,
            grounded: false,
            health: 100,
            maxHealth: 100,
            selectedSlot: 0,
            facing: 1, // 1 for right, -1 for left
            swingTimer: 0,
            inventory: {
                copper_broadsword: 1,
                copper_pickaxe: 1,
                wood: 15,
                stone: 0,
                copper_ore: 0
            }
        };

        const hotbarKeys = ['copper_broadsword', 'copper_pickaxe', 'wood', 'stone', 'copper_ore'];

        // Input Management
        const keys = {};
        const mouse = { x: 0, y: 0, down: false };

        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code >= 'Digit1' && e.code <= 'Digit5') {
                player.selectedSlot = parseInt(e.code) - 1;
                updateHotbarUI();
            }
        });
        window.addEventListener('keyup', e => { keys[e.code] = false; });
        window.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });
        window.addEventListener('mousedown', () => { mouse.down = true; });
        window.addEventListener('mouseup', () => { mouse.down = false; });
        window.addEventListener('contextmenu', e => e.preventDefault());

        function updateHotbarUI() {
            for (let i = 0; i < 5; i++) {
                const slot = document.getElementById(`slot-${i}`);
                const itemName = hotbarKeys[i];
                const count = player.inventory[itemName] || 0;
                slot.querySelector('span').innerText = count;
                if (i === player.selectedSlot) {
                    slot.classList.add('active');
                } else {
                    slot.classList.remove('active');
                }
            }
        }

        // --- PROCEDURAL WORLD GENERATION ---
        function generateChunk(cx) {
            const chunkData = [];
            for (let x = 0; x < CHUNK_WIDTH; x++) {
                const worldX = cx * CHUNK_WIDTH + x;
                const surfaceHeight = Math.floor(40 + Math.sin(worldX * 0.04) * 8 + Math.cos(worldX * 0.015) * 15);
                
                const column = {};
                for (let y = 0; y < WORLD_HEIGHT; y++) {
                    let type = null;
                    if (y === surfaceHeight) {
                        type = 'grass';
                    } else if (y > surfaceHeight && y < surfaceHeight + 5) {
                        type = 'dirt';
                    } else if (y >= surfaceHeight + 5) {
                        if (y > surfaceHeight + 15 && Math.random() < 0.06) {
                            type = Math.random() < 0.5 ? 'copper_ore' : 'iron_ore';
                        } else {
                            type = 'stone';
                        }
                    }
                    if (type) column[y] = type;
                }
                chunkData[x] = { surfaceHeight, blocks: column };
            }
            loadedChunks.set(cx, chunkData);
            return chunkData;
        }

        function getBlock(bx, by) {
            const cx = Math.floor(bx / CHUNK_WIDTH);
            const lx = ((bx % CHUNK_WIDTH) + CHUNK_WIDTH) % CHUNK_WIDTH;
            let chunk = loadedChunks.get(cx);
            if (!chunk) chunk = generateChunk(cx);
            return chunk[lx]?.blocks[by] || null;
        }

        function setBlock(bx, by, type) {
            const cx = Math.floor(bx / CHUNK_WIDTH);
            const lx = ((bx % CHUNK_WIDTH) + CHUNK_WIDTH) % CHUNK_WIDTH;
            let chunk = loadedChunks.get(cx);
            if (!chunk) chunk = generateChunk(cx);
            if (type === null) {
                delete chunk[lx].blocks[by];
            } else {
                chunk[lx].blocks[by] = type;
            }
        }

        // --- PHYSICS & COLLISION ---
        function checkCollision(nx, ny) {
            const left = Math.floor(nx / TILE_SIZE);
            const right = Math.floor((nx + player.width - 1) / TILE_SIZE);
            const top = Math.floor(ny / TILE_SIZE);
            const bottom = Math.floor((ny + player.height - 1) / TILE_SIZE);

            for (let bx = left; bx <= right; bx++) {
                for (let by = top; by <= bottom; by++) {
                    if (getBlock(bx, by) !== null) return true;
                }
            }
            return false;
        }

        function updatePlayer() {
            player.vx = 0;
            if (keys['KeyA'] || keys['ArrowLeft']) { player.vx = -player.speed; player.facing = -1; }
            if (keys['KeyD'] || keys['ArrowRight']) { player.vx = player.speed; player.facing = 1; }

            player.x += player.vx;
            if (checkCollision(player.x, player.y)) player.x -= player.vx;

            player.vy += player.gravity;
            player.y += player.vy;
            player.grounded = false;

            if (checkCollision(player.x, player.y)) {
                player.y -= player.vy;
                if (player.vy > 0) player.grounded = true;
                player.vy = 0;
            }

            if ((keys['Space'] || keys['KeyW'] || keys['ArrowUp']) && player.grounded) {
                player.vy = player.jumpForce;
                player.grounded = false;
            }

            if (player.swingTimer > 0) player.swingTimer--;

            // Handle Item / Tool Action (Mining / Swinging)
            if (mouse.down && player.swingTimer === 0) {
                const cameraX = player.x - canvas.width / 2;
                const cameraY = player.y - canvas.height / 2;
                const worldMouseX = mouse.x + cameraX;
                const worldMouseY = mouse.y + cameraY;

                const targetBx = Math.floor(worldMouseX / TILE_SIZE);
                const targetBy = Math.floor(worldMouseY / TILE_SIZE);

                const playerBx = Math.floor((player.x + player.width / 2) / TILE_SIZE);
                const playerBy = Math.floor((player.y + player.height / 2) / TILE_SIZE);

                // Reach check (Terraria-style distance limit ~5 tiles)
                if (Math.hypot(targetBx - playerBx, targetBy - playerBy) < 6) {
                    const block = getBlock(targetBx, targetBy);
                    const selectedItem = hotbarKeys[player.selectedSlot];

                    if (selectedItem.includes('pickaxe') || selectedItem.includes('broadsword')) {
                        player.swingTimer = 12; // Cooldown frames
                        if (block) {
                            setBlock(targetBx, targetBy, null);
                            const dropName = block.includes('ore') ? block : (block === 'stone' ? 'stone' : 'wood');
                            player.inventory[dropName] = (player.inventory[dropName] || 0) + 1;
                            updateHotbarUI();
                        }
                    } else if (selectedItem === 'wood' || selectedItem === 'stone') {
                        if (!block && player.inventory[selectedItem] > 0) {
                            setBlock(targetBx, targetBy, selectedItem);
                            player.inventory[selectedItem]--;
                            updateHotbarUI();
                            player.swingTimer = 10;
                        }
                    }
                }
            }
        }

        // --- RENDER LOOP ---
        const camera = { x: 0, y: 0 };

        function draw() {
            camera.x = player.x - canvas.width / 2 + player.width / 2;
            camera.y = player.y - canvas.height / 2 + player.height / 2;

            // Gradient Sky Background
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, COLORS.skyTop);
            grad.addColorStop(1, COLORS.skyBottom);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Render Chunks & Blocks
            const startChunk = Math.floor(camera.x / (CHUNK_WIDTH * TILE_SIZE)) - 1;
            const endChunk = startChunk + Math.ceil(canvas.width / (CHUNK_WIDTH * TILE_SIZE)) + 2;

            for (let cx = startChunk; cx <= endChunk; cx++) {
                let chunk = loadedChunks.get(cx) || generateChunk(cx);
                for (let lx = 0; lx < CHUNK_WIDTH; lx++) {
                    const bx = cx * CHUNK_WIDTH + lx;
                    const col = chunk[lx];
                    for (const [strY, type] of Object.entries(col.blocks)) {
                        const by = parseInt(strY);
                        const screenX = bx * TILE_SIZE - camera.x;
                        const screenY = by * TILE_SIZE - camera.y;

                        if (screenX < -TILE_SIZE || screenX > canvas.width + TILE_SIZE ||
                            screenY < -TILE_SIZE || screenY > canvas.height + TILE_SIZE) continue;

                        ctx.fillStyle = COLORS[type] || '#fff';
                        ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);

                        // Underground Darkness Gradient Overlay
                        if (by > col.surfaceHeight) {
                            const depth = by - col.surfaceHeight;
                            const alpha = Math.min(0.85, depth * 0.045);
                            ctx.fillStyle = `rgba(10, 10, 18, ${alpha})`;
                            ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
                        }
                    }
                }
            }

            // Draw Player Character (Terraria-style sprite placeholder)
            const px = player.x - camera.x;
            const py = player.y - camera.y;

            // Legs
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(px + 3, py + 26, 5, 12);
            ctx.fillRect(px + 12, py + 26, 5, 12);
            // Torso / Shirt
            ctx.fillStyle = '#2980b9';
            ctx.fillRect(px + 2, py + 12, 16, 16);
            // Head & Hair
            ctx.fillStyle = '#f1c40f';
            ctx.fillRect(px + 3, py + 2, 14, 12);
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(px + 3, py, 14, 4);

            // Draw Weapon Swing Arc if swinging
            if (player.swingTimer > 0) {
                ctx.save();
                ctx.translate(px + player.width / 2, py + player.height / 2);
                ctx.rotate(player.facing * (1 - player.swingTimer / 12) * Math.PI * 1.2);
                ctx.fillStyle = '#bdc3c7';
                ctx.fillRect(10, -4, 20, 6); // Sword blade
                ctx.restore();
            }
        }

        function loop() {
            updatePlayer();
            draw();
            requestAnimationFrame(loop);
        }

        // Initialize surrounding chunks and start
        generateChunk(0);
        generateChunk(1);
        generateChunk(-1);
        updateHotbarUI();
        loop();
    </script>
</body>
</html>
